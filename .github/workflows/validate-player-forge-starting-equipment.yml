UMtkXNg/file?c_luid=c335000c","hash":"02cbc988a79662691ab495b01871b0d4986b38d8b3487e235be624e3bb6f0910","size":1026325}]'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, struct, urllib.request
          from pathlib import Path
          manifest=json.loads(os.environ["ITEM_ART_MANIFEST"])
          target=Path("public/item-art/masters/foundation-batch-01")
          target.mkdir(parents=True,exist_ok=True)
          def dropbox_hash(data):
              block=4*1024*1024
              digests=b"".join(hashlib.sha256(data[i:i+block]).digest() for i in range(0,len(data),block))
              return hashlib.sha256(digests).hexdigest()
          for item in manifest:
              req=urllib.request.Request(item["url"],headers={"User-Agent":"DNDNext-Item-Art-Import/1.0"})
              with urllib.request.urlopen(req,timeout=120) as resp:
                  data=resp.read()
              if len(data)!=int(item["size"]):
                  raise SystemExit(f'{item["name"]}: size mismatch')
              if dropbox_hash(data)!=item["hash"]:
                  raise SystemExit(f'{item["name"]}: Dropbox content hash mismatch')
              if data[:8]!=b"\x89PNG\r\n\x1a\n" or data[12:16]!=b"IHDR":
                  raise SystemExit(f'{item["name"]}: invalid PNG')
              width,height=struct.unpack(">II",data[16:24])
              if (width,height)!=(1024,1024):
                  raise SystemExit(f'{item["name"]}: expected 1024x1024, got {width}x{height}')
              (target/item["name"]).write_bytes(data)
              print(f'OK {item["name"]}: {width}x{height}, {len(data)} bytes')
          PY
      - name: Commit verified Item Art Batch 01
        run: |
          set -euo pipefail
          git add public/item-art/masters/foundation-batch-01
          if git diff --cached --quiet; then
            echo "Batch already imported."
            exit 0
          fi
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add foundational item art batch 01"
          git push origin HEAD:item-art-foundation-batch1
