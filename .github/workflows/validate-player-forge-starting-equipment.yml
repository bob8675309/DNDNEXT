        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, json, os, urllib.request
          from pathlib import Path
          from PIL import Image

          manifest=json.loads(os.environ["ITEM_ART_MANIFEST"])
          if len(manifest) != 19:
              raise SystemExit(f"expected 19 images, got {len(manifest)}")

          def dropbox_hash(data):
              block=4*1024*1024
              digests=b"".join(hashlib.sha256(data[i:i+block]).digest() for i in range(0,len(data),block))
              return hashlib.sha256(digests).hexdigest()

          target=Path("public/item-art/masters/foundation-batch-05")
          target.mkdir(parents=True,exist_ok=True)
          for name,url,expected_hash,expected_size in manifest:
              req=urllib.request.Request(url,headers={"User-Agent":"DNDNext-Item-Art-Import/5.0"})
              with urllib.request.urlopen(req,timeout=120) as resp:
                  data=resp.read()
              if len(data) != int(expected_size):
                  raise SystemExit(f"{name}: source size mismatch")
              if dropbox_hash(data) != expected_hash:
                  raise SystemExit(f"{name}: Dropbox content hash mismatch")
              src=Image.open(io.BytesIO(data)).convert("RGB")
              if src.width != src.height:
                  raise SystemExit(f"{name}: expected square source, got {src.width}x{src.height}")
              dst=src.resize((1024,1024),Image.Resampling.LANCZOS)
              out=target/name
              dst.save(out,format="PNG",optimize=True)
              check=Image.open(out)
              if check.size != (1024,1024) or check.format != "PNG":
                  raise SystemExit(f"{name}: normalized output failed validation")
              print(f"OK {name}: source={src.width}x{src.height} -> 1024x1024")
          PY
      - name: Commit verified Item Art Batch 05
        run: |
          set -euo pipefail
          test "$(find public/item-art/masters/foundation-batch-05 -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 19
          git add -f public/item-art/masters/foundation-batch-05
          if git diff --cached --quiet; then
            echo "Batch already imported."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "Add broader foundational item art batch 05"
          git push origin HEAD:item-art-foundation-batch1
