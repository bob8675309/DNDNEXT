name: Validate Player Forge starting equipment

on:
  push:
    paths:
      - "components/NewNpcModalV3Refined.js"
      - "components/NpcForgeCoreSupport.js"
      - "components/NpcForgeEquipmentStep.js"
      - "components/MerchantPanel.js"
      - "components/MerchantStorefrontView.js"
      - "components/NpcForgeMerchantMarket.js"
      - "components/MerchantAmbientBackdrop.js"
      - "components/NpcForgeEquipmentSummaryDock.js"
      - "components/useNpcForgeController.js"
      - "components/useNpcForgeDerivedModel.js"
      - "utils/playerForgeStartingEquipment.js"
      - "utils/merchantStorefrontMedia.js"
      - "scripts/validate_player_forge_starting_equipment.mjs"
      - "scripts/validate_merchant_market_ui_handoff.mjs"
      - "sql/20260808_49_player_forge_starting_equipment_currency.sql"
      - "styles/player-forge-equipment-market.css"
      - "styles/merchant-storefront.css"
      - "styles/npc-shop-embedded-fill.css"
      - "sql/20261012_02_merchant_stock_distribution.sql"
      - "sql/20261012_03_merchant_recipe_rarity_cap.sql"
      - ".github/workflows/validate-player-forge-starting-equipment.yml"
  pull_request:
    paths:
      - "components/NewNpcModalV3Refined.js"
      - "components/NpcForgeCoreSupport.js"
      - "components/NpcForgeEquipmentStep.js"
      - "components/MerchantPanel.js"
      - "components/MerchantStorefrontView.js"
      - "components/NpcForgeMerchantMarket.js"
      - "components/MerchantAmbientBackdrop.js"
      - "components/NpcForgeEquipmentSummaryDock.js"
      - "components/useNpcForgeController.js"
      - "components/useNpcForgeDerivedModel.js"
      - "utils/playerForgeStartingEquipment.js"
      - "utils/merchantStorefrontMedia.js"
      - "scripts/validate_player_forge_starting_equipment.mjs"
      - "scripts/validate_merchant_market_ui_handoff.mjs"
      - "sql/20260808_49_player_forge_starting_equipment_currency.sql"
      - "styles/player-forge-equipment-market.css"
      - "styles/merchant-storefront.css"
      - "styles/npc-shop-embedded-fill.css"
      - "sql/20261012_02_merchant_stock_distribution.sql"
      - "sql/20261012_03_merchant_recipe_rarity_cap.sql"
      - ".github/workflows/validate-player-forge-starting-equipment.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate starting equipment authority
        run: |
          node scripts/validate_player_forge_starting_equipment.mjs
          node scripts/validate_unified_character_forge.mjs
      - name: Run production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder
        run: npm run build:vercel


  import_item_art_batch_03:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'item-art-foundation-batch1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: item-art-foundation-batch1
          fetch-depth: 0
      - name: Download and verify Item Art Batch 03
        env:
          ITEM_ART_MANIFEST: '[["itemart_symbol_holy_plain_01.png","https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/2547b720-dd7e-49ab-b093-360ae9ca8d18/3af81954-8338-44a2-bfba-596d6368e994/A_single_standalone_neutral_fantasy_holy_symbol_displayed_as.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGE2MDcxOGVlNmYzYWM5MCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjQxMzcxMH0.hJXxdlwPLyYwdJ--Kf-ZJuFlf7df-Td-A_x85mpNNOg"],["itemart_tools_kit_plain_01.png","https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/e54c03fa-9030-4aa4-971c-5b6c754f4f81/99b5f4c1-c9a1-4d59-a416-8bef87fd4ad5/A_single_standalone_fantasy_artisan_tool_kit_displayed_as_th.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzQ1NWEzZjIxYWM0OGEwNSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjQwMTI2Nn0.g9qASyZB1wc8GXxpspnfajZLjicyEJ8KNXB7mgeRH9E"],["itemart_container_backpack_plain_01.png","https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/bc4e15e8-c417-4c10-a8ae-863e9d40c5aa/50738e97-d9e8-4f3a-bff4-9129a49a9846/A_single_standalone_medieval_fantasy_adventurer_backpack_dis.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZGY1MDBiMWU2MmQ5ZDVhMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjQ1NjA5NH0.CBa4OHH8K5ZwCEWxyXGKsPCVNqrgZp8fuy2ANtgbDms"],["itemart_trade_coinpouch_plain_01.png","https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/cfd1f339-93d3-427b-88cd-123377153ddd/cc62f617-3252-4949-b84f-264a68bf856d/A_single_standalone_fantasy_coin_pouch_displayed_as_the_hero.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiM2VmODQ3NmM3NTcyNzVkYiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjQxMzgwNH0.1t6jKfIXXwkCCzWKK7v0OkiiCIQApkvPy9STMD89Qdc"],["itemart_material_ingot_plain_01.png","https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/56bc7372-d31f-4696-a17d-2e07af7a85de/f6081acf-998f-4691-89e4-611ae3010b98/A_single_standalone_stack_of_three_plain_forged_metal_ingots.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzg3ZjEwMmQ2Y2FhM2Y3NSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjQxMzYxM30._AQLrUr3KHZ3pcl8IGgYWCBnrkjm9pal_IPCUJLy07I"],["itemart_ammo_arrow_bundle_plain_01.png","https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/a42e72ae-be27-40a1-a23f-7f34b5b71dee/0f78ad8c-489c-48bc-8e31-60a2fc0db9fb/A_single_standalone_bundle_of_medieval_fantasy_arrows_displa.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTUwMGViYWI4MTgyNjkxOCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjQxMjk3MX0.EeB2FbZ8A7AIWo2BJBO1FjXbyzDCru5myTavEAu588M"],["itemart_instrument_lute_plain_01.png","https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/72218100-7c3a-4de6-a4ac-f60ded53fb50/165f2e94-8011-43a4-a03b-f956fefb8368/A_single_standalone_medieval_fantasy_lute_displayed_as_the_h.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2ZjMjVlYjg4MTEzMmQ2YSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjQwMTQ2NH0.nq8bf_-ctlqosQIFgTf7YTW2Vls9VMTYKzFveT4ttEY"]]'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, struct, urllib.request
          from pathlib import Path
          manifest=json.loads(os.environ["ITEM_ART_MANIFEST"])
          if len(manifest) != 7:
              raise SystemExit(f"expected 7 images, got {len(manifest)}")
          target=Path("public/item-art/masters/foundation-batch-03")
          target.mkdir(parents=True,exist_ok=True)
          for name,url in manifest:
              req=urllib.request.Request(url,headers={"User-Agent":"DNDNext-Item-Art-Import/3.0"})
              with urllib.request.urlopen(req,timeout=120) as resp:
                  data=resp.read()
              if data[:8]!=b"\x89PNG\r\n\x1a\n" or data[12:16]!=b"IHDR":
                  raise SystemExit(f"{name}: invalid PNG")
              width,height=struct.unpack(">II",data[16:24])
              if (width,height)!=(1024,1024):
                  raise SystemExit(f"{name}: expected 1024x1024, got {width}x{height}")
              (target/name).write_bytes(data)
              print(f"OK {name}: {width}x{height}, {len(data)} bytes, sha256={hashlib.sha256(data).hexdigest()}")
          PY
      - name: Commit verified Item Art Batch 03
        run: |
          set -euo pipefail
          test "$(find public/item-art/masters/foundation-batch-03 -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 7
          git add -f public/item-art/masters/foundation-batch-03
          if git diff --cached --quiet; then
            echo "Batch already imported."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "Add foundational item art batch 03"
          git push origin HEAD:item-art-foundation-batch1
