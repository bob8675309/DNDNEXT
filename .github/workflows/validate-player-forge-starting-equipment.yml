name: Validate Player Forge starting equipment

on:
  push:
    paths:
      - "components/NewNpcModalV3Refined.js"
      - "components/NpcForgeCoreSupport.js"
      - "components/NpcForgeEquipmentStep.js"
      - "components/MerchantPanel.js"
      - "components/MerchantStorefrontView.js"
      - "components/NpcForgeMerchantMarket.js"
      - "components/MerchantAmbientBackdrop.js"
      - "components/NpcForgeEquipmentSummaryDock.js"
      - "components/useNpcForgeController.js"
      - "components/useNpcForgeDerivedModel.js"
      - "utils/playerForgeStartingEquipment.js"
      - "utils/merchantStorefrontMedia.js"
      - "scripts/validate_player_forge_starting_equipment.mjs"
      - "scripts/validate_merchant_market_ui_handoff.mjs"
      - "sql/20260808_49_player_forge_starting_equipment_currency.sql"
      - "styles/player-forge-equipment-market.css"
      - "styles/merchant-storefront.css"
      - "styles/npc-shop-embedded-fill.css"
      - "sql/20261012_02_merchant_stock_distribution.sql"
      - "sql/20261012_03_merchant_recipe_rarity_cap.sql"
      - ".github/workflows/validate-player-forge-starting-equipment.yml"
  pull_request:
    paths:
      - "components/NewNpcModalV3Refined.js"
      - "components/NpcForgeCoreSupport.js"
      - "components/NpcForgeEquipmentStep.js"
      - "components/MerchantPanel.js"
      - "components/MerchantStorefrontView.js"
      - "components/NpcForgeMerchantMarket.js"
      - "components/MerchantAmbientBackdrop.js"
      - "components/NpcForgeEquipmentSummaryDock.js"
      - "components/useNpcForgeController.js"
      - "components/useNpcForgeDerivedModel.js"
      - "utils/playerForgeStartingEquipment.js"
      - "utils/merchantStorefrontMedia.js"
      - "scripts/validate_player_forge_starting_equipment.mjs"
      - "scripts/validate_merchant_market_ui_handoff.mjs"
      - "sql/20260808_49_player_forge_starting_equipment_currency.sql"
      - "styles/player-forge-equipment-market.css"
      - "styles/merchant-storefront.css"
      - "styles/npc-shop-embedded-fill.css"
      - "sql/20261012_02_merchant_stock_distribution.sql"
      - "sql/20261012_03_merchant_recipe_rarity_cap.sql"
      - ".github/workflows/validate-player-forge-starting-equipment.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate starting equipment authority
        run: |
          node scripts/validate_player_forge_starting_equipment.mjs
          node scripts/validate_unified_character_forge.mjs
      - name: Run production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder
        run: npm run build:vercel


  import_item_art_batch_06:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'item-art-foundation-batch1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: item-art-foundation-batch1
          fetch-depth: 0
      - name: Download, normalize, and verify Item Art Batch 06
        env:
          ITEM_ART_MANIFEST: '[["itemart_wondrous_chalice_moonlit_01.png","https://ucad94de6491e7cfcd9522be8337.dl.dropboxusercontent.com/cd/0/get/DKQC3G9jSDuwuHKtDIvoSWqJdM1Q-h6jNRgglZrxUuvnrkfwBlzq6bdYq3B5EGDEYAB6olCxoMpdCUbtLyx6loXwaE3UIbMsX4-YeteCuklsQ6G1ori0zjMQgfaBgBXKIe5FnV-7Otl1uRNqaTFcA4aIhw7fF6Be1MaUkxA0reT-tw/file?c_luid=c335000c","09325c5346409693a2317aec8676bb99893a0a7c9ce8ffe6f1365daaaccfc14e",2497092],["itemart_wondrous_pocket_watch_celestial_01.png","https://uca95e433f4f61f8ad6858b80850.dl.dropboxusercontent.com/cd/0/get/DKQS_1ctZFEs2wMmwpjqtECfvKOQrIDbKTR4wg4TnFtUjAWpOr5e6B_hxZYbso_nHuPHHE9ZHO3_v777_gi_I8l9Xv4yjahJDpINKMqvlzVV18YvyhnkIEHsZCHy3MGp0XVtOHYLhF0-TNZQMu4qqkQm7azhAKychC8oBgPL-EMpgA/file?c_luid=c335000c","881edb73922d101cb865ddd3fa4da3f47187851b1c291be5b1db02d6ab5264cf",2569457],["itemart_wondrous_wand_crystal_01.png","https://uc517e658c0fd1928e551df2dc29.dl.dropboxusercontent.com/cd/0/get/DKROuRfUKlzURy6HfWkQ4eYeIz6yVg0mPk2nb-H2cevdp_0Q5B_GasrgdKGba4SsvOaJGabNwc9R1ahomuXK5hEE5-x8uZYofcYaHWsYJgw_MxDMfaVjUGiJZajVCl1HNW-pFMjMnBac5QAtuzadc3iSCgauXmcMaruRBSorThYhmA/file?c_luid=c335000c","251e2b13036cee80539bb95c53add9641edc8904bc99efe57f2c9c038410dcb6",2164003],["itemart_wondrous_reliquary_radiant_01.png","https://ucde4d5e864c14feb43a6e19af5f.dl.dropboxusercontent.com/cd/0/get/DKTvDHmMUAF693daNQQdL3Up_9saDPYIhS08DkfL3hVPvluNesjb3KibPmnv57up-Qz5-DnvWbf1-x1nNsECR6IWqJ4i_bYOLgB3Rah7CGxACPP_GpKXj8kYLVOkgNeowO7ZstCCxkloYZKbRUOlqxjopbhtG9BhsmfTKuSFCB7htQ/file?c_luid=c335000c","9a6484ffbf88c7559b5de09aa15552b27de709d4f3b28db48560e3a6e026026f",2466694],["itemart_wondrous_moonstone_relic_01.png","https://ucdbb25acabdfda12882175b6a0f.dl.dropboxusercontent.com/cd/0/get/DKR-ALwoltuArxJeeLvq6lQuqjaiOJHB0uP6ErybBXEd52mOL045eD9jWsWDv0wHm-hS69DbgHLX3AFcJKdy0t1LVVP72xT8F4qxeNNELp4cDJD7H8rS8r-qy64jZt4-R48hGnpvqBSVV0wXzlNr7cY4ZU1K8KnVCZbz8cYhZe7tmA/file?c_luid=c335000c","4adc98142ec060c143b8aa7851ffe8a42ff41b16ba38f6272462e72c4f434149",2573296],["itemart_instrume