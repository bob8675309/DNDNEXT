        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          import hashlib, io, json, os, struct, urllib.request
          from pathlib import Path
          from PIL import Image
          manifest=json.loads(os.environ["ITEM_ART_MANIFEST"])
          if len(manifest) != 10:
              raise SystemExit(f"expected 10 images, got {len(manifest)}")
          target=Path("public/item-art/masters/foundation-batch-06")
          target.mkdir(parents=True,exist_ok=True)
          def dbx_hash(data):
              block=4*1024*1024
              parts=b"".join(hashlib.sha256(data[i:i+block]).digest() for i in range(0,len(data),block))
              return hashlib.sha256(parts).hexdigest()
          for name,url,expected_hash,expected_size in manifest:
              req=urllib.request.Request(url,headers={"User-Agent":"DNDNext-Item-Art-Import/6.0"})
              with urllib.request.urlopen(req,timeout=120) as resp:
                  data=resp.read()
              if len(data) != expected_size:
                  raise SystemExit(f"{name}: size mismatch")
              if dbx_hash(data) != expected_hash:
                  raise SystemExit(f"{name}: Dropbox content hash mismatch")
              if data[:8]!=b"\x89PNG\r\n\x1a\n" or data[12:16]!=b"IHDR":
                  raise SystemExit(f"{name}: invalid PNG")
              width,height=struct.unpack(">II",data[16:24])
              if width != height or width < 1024:
                  raise SystemExit(f"{name}: expected square source at least 1024px, got {width}x{height}")
              image=Image.open(io.BytesIO(data)).convert("RGB")
              image=image.resize((1024,1024), Image.Resampling.LANCZOS)
              out=target/name
              image.save(out, format="PNG", optimize=True)
              check=out.read_bytes()
              out_width,out_height=struct.unpack(">II",check[16:24])
              if (out_width,out_height)!=(1024,1024):
                  raise SystemExit(f"{name}: normalized output is {out_width}x{out_height}")
              print(f"OK {name}: source {width}x{height} -> 1024x1024, {len(check)} bytes")
          PY
      - name: Commit verified Item Art Batch 06
        run: |
          set -euo pipefail
          test "$(find public/item-art/masters/foundation-batch-06 -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 10
          git add -f public/item-art/masters/foundation-batch-06
          if git diff --cached --quiet; then
            echo "Batch already imported."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "Add foundational item art batch 06"
          git push origin HEAD:item-art-foundation-batch1
