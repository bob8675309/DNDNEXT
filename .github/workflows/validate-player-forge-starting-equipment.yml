name: Validate Player Forge starting equipment

on:
  push:
    paths:
      - "components/NewNpcModalV3Refined.js"
      - "components/NpcForgeCoreSupport.js"
      - "components/NpcForgeEquipmentStep.js"
      - "components/MerchantPanel.js"
      - "components/MerchantStorefrontView.js"
      - "components/NpcForgeMerchantMarket.js"
      - "components/MerchantAmbientBackdrop.js"
      - "components/NpcForgeEquipmentSummaryDock.js"
      - "components/useNpcForgeController.js"
      - "components/useNpcForgeDerivedModel.js"
      - "utils/playerForgeStartingEquipment.js"
      - "utils/merchantStorefrontMedia.js"
      - "scripts/validate_player_forge_starting_equipment.mjs"
      - "scripts/validate_merchant_market_ui_handoff.mjs"
      - "sql/20260808_49_player_forge_starting_equipment_currency.sql"
      - "styles/player-forge-equipment-market.css"
      - "styles/merchant-storefront.css"
      - "styles/npc-shop-embedded-fill.css"
      - "sql/20261012_02_merchant_stock_distribution.sql"
      - "sql/20261012_03_merchant_recipe_rarity_cap.sql"
      - ".github/workflows/validate-player-forge-starting-equipment.yml"
  pull_request:
    paths:
      - "components/NewNpcModalV3Refined.js"
      - "components/NpcForgeCoreSupport.js"
      - "components/NpcForgeEquipmentStep.js"
      - "components/MerchantPanel.js"
      - "components/MerchantStorefrontView.js"
      - "components/NpcForgeMerchantMarket.js"
      - "components/MerchantAmbientBackdrop.js"
      - "components/NpcForgeEquipmentSummaryDock.js"
      - "components/useNpcForgeController.js"
      - "components/useNpcForgeDerivedModel.js"
      - "utils/playerForgeStartingEquipment.js"
      - "utils/merchantStorefrontMedia.js"
      - "scripts/validate_player_forge_starting_equipment.mjs"
      - "scripts/validate_merchant_market_ui_handoff.mjs"
      - "sql/20260808_49_player_forge_starting_equipment_currency.sql"
      - "styles/player-forge-equipment-market.css"
      - "styles/merchant-storefront.css"
      - "styles/npc-shop-embedded-fill.css"
      - "sql/20261012_02_merchant_stock_distribution.sql"
      - "sql/20261012_03_merchant_recipe_rarity_cap.sql"
      - ".github/workflows/validate-player-forge-starting-equipment.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate starting equipment authority
        run: |
          node scripts/validate_player_forge_starting_equipment.mjs
          node scripts/validate_unified_character_forge.mjs
      - name: Run production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder
        run: npm run build:vercel


  import_item_art_batch_06:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'item-art-foundation-batch1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: item-art-foundation-batch1
          fetch-depth: 0
      - name: Download, normalize, and verify Item Art Batch 06
        env:
          ITEM_ART_MANIFEST: '[["itemart_wondrous_chalice_moonlit_01.png","https://ucd2a6046fa92fec71d098177c6c.dl.dropboxusercontent.com/cd/0/get/DKT9M3_fNt8VHQOiUzelTth9mEXXeyCB5kW0DeXrZsPvScSYucU354GxM6sasjhJ5o61zCnk4lvk34bx_i3wEyttfFrQQBByZukXH3-o9Lb9CttPKCpfSU4icxBmbrV1qvziA8V1isKHW7Uc_BA-eVI4ZgJ5wm0-nZa57G11QPjZLg/file?c_luid=c335000c","09325c5346409693a2317aec8676bb99893a0a7c9ce8ffe6f1365daaaccfc14e",2497092],["itemart_wondrous_pocket_watch_celestial_01.png","https://uc436a05a0f8fcf0ee2e19c05bb2.dl.dropboxusercontent.com/cd/0/get/DKRF7P2wP-FtTrnn2gxQdrstr_w9WY99CnjrcL0znMSmSVsn52GYWhcQOENn8unMaHCHNCyY3YaQWcIZigPpPXwjD2_kbV_OZOI-lta2PKmrRqotQQcX3LIVwUF1XYN9egfoxVwejv-mjMaZofVxEyj1IQmPCJyCCtiRMQkpG2YNNQ/file?c_luid=c335000c","881edb73922d101cb865ddd3fa4da3f47187851b1c291be5b1db02d6ab5264cf",2569457],["itemart_wondrous_wand_crystal_01.png","https://uc8e43028fa4a2177244fa3bd052.dl.dropboxusercontent.com/cd/0/get/DKSWxnBROI2vzK5p9ecOObTy3vYnSvLFwa0Ralea66o4cU4b1oQSyVKLMH0TXTygtL-xldUqXRk_hCmRfvOjvh0O1oegzqVhsNPdf_d7WnazpWqsovRow74QpnbA0KmsG0A5JDappKQHAfHMMQSCFRFrKdahjbRdBYNh_oTtflOYWg/file?c_luid=c335000c","251e2b13036cee80539bb95c53add9641edc8904bc99efe57f2c9c038410dcb6",2164003],["itemart_wondrous_reliquary_radiant_01.png","https://uc13aef682aa58aed41aa224496c.dl.dropboxusercontent.com/cd/0/get/DKRk4ois3k1PQ68V-scwtl8B7nRQ9aAXAZMN63GXchLixfvyCZJSApg099D8FuN91FIsZjSsLwvtppDRCtDQe_VJDZSsbALSCjr5V5hOOMYGGjHdhPfLyOWpRUKwG_PvCRqTcwkapV2TlQo1QCLH6SMl2t9utCiqRxH_lJ8f4zHicg/file?c_luid=c335000c","9a6484ffbf88c7559b5de09aa15552b27de709d4f3b28db48560e3a6e026026f",2466694],["itemart_wondrous_moonstone_relic_01.png","https://uc16e2dc7135bfaa169afeb6778e.dl.dropboxusercontent.com/cd/0/get/DKR40VMTdVHt__1Y18qVOxgxMtUAFQYKsQpHJt9rGw-A0Xhcls8poT9zrjDxMgrSswGGQo31xQJiDZUbbcCk0wZ9lJLJIGEVCZcI7rROBJyrcG_4198jnaBkwUEt4-OrJVuKqYhHWVIcSMYr2Z80O7TyXZJ7xOjGg_Ima0RETSbmeA/file?c_luid=c335000c","4adc98142ec060c143b8aa7851ffe8a42ff41b16ba38f6272462e72c4f434149",2573296],["itemart_instrume