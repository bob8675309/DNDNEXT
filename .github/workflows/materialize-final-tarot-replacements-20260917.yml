name: Finalize subclass Tarot deck 2026-09-17

on:
  push:
    branches:
      - agent/subclass-tarot-final2-materialize-20260917

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/subclass-tarot-approved-batch-20260916
          fetch-depth: 0

      - name: Verify exact artwork branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "01e35ff99c2980891028993358aff38bc93ae611"

      - name: Wire complete approved Tarot deck
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_class_block(text, class_key, lines):
              pattern = rf'(?ms)^  {re.escape(class_key)}: Object\.freeze\(\{{.*?^  \}}\),'
              replacement = '  ' + class_key + ': Object.freeze({\n' + ''.join(f'    {line}\n' for line in lines) + '  }),' 
              new, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{class_key} resolver block: expected 1 match, found {count}')
              return new

          resolver_path = Path('utils/classes/subclassArtwork.js')
          resolver = resolver_path.read_text()
          resolver = replace_class_block(resolver, 'barbarian', [
              '"ancestral-guardian": "ancestral-guardian",',
              'battlerager: "battlerager",',
              'beast: "beast",',
              'berserker: "berserker",',
              'giant: "giant",',
              '"storm-herald": "storm-herald",',
              '"totem-warrior": "totem-warrior",',
              '"wild-heart": "wild-heart",',
              '"wild-magic": "wild-magic",',
              '"world-tree": "world-tree",',
              'zealot: "zealot",',
          ])
          resolver = replace_class_block(resolver, 'bard', [
              'creation: "creation",', 'dance: "dance",', 'eloquence: "eloquence",',
              'glamour: "glamour",', 'lore: "lore",', 'moon: "moon",',
              'spirits: "spirits",', 'swords: "swords",', 'valor: "valor",',
              'whispers: "whispers",',
          ])
          resolver = replace_class_block(resolver, 'fighter', [
              '"arcane-archer": "arcane-archer",', 'banneret: "banneret",',
              '"battle-master": "battle-master",', 'cavalier: "cavalier",',
              'champion: "champion",', '"echo-knight": "echo-knight",',
              '"eldritch-knight": "eldritch-knight",',
              '"purple-dragon-knight-banneret": "purple-dragon-knight-banneret",',
              '"psi-warrior": "psi-warrior",', '"rune-knight": "rune-knight",',
              'samurai: "samurai",',
          ])
          resolver = replace_class_block(resolver, 'monk', [
              '"ascendant-dragon": "ascendant-dragon",', '"astral-self": "astral-self",',
              '"drunken-master": "drunken-master",', 'elements: "elements",',
              '"four-elements": "four-elements",', 'kensei: "kensei",',
              '"long-death": "long-death",', 'mercy: "mercy",',
              '"open-hand": "open-hand",', 'shadow: "shadow",',
              '"sun-soul": "sun-soul",',
          ])
          if '  mystic: Object.freeze({' not in resolver:
              marker = '  paladin: Object.freeze({' 
              if resolver.count(marker) != 1:
                  raise SystemExit('paladin insertion marker missing/ambiguous')
              mystic = '''  mystic: Object.freeze({
            avatar: "avatar",
            awakened: "awakened",
            immortal: "immortal",
            nomad: "nomad",
            "soul-knife": "soul-knife",
            "wu-jen": "wu-jen",
          }),
'''
              # normalize indentation introduced by YAML heredoc
              mystic = '\n'.join(line[10:] if line.startswith('          ') else line for line in mystic.splitlines()) + '\n'
              resolver = resolver.replace(marker, mystic + marker, 1)
          resolver = replace_class_block(resolver, 'paladin', [
              'ancients: "ancients",', 'conquest: "conquest",', 'crown: "crown",',
              'devotion: "devotion",', 'glory: "glory",',
              '"noble-genies": "noble-genies",', 'oathbreaker: "oathbreaker",',
              'redemption: "redemption",', 'vengeance: "vengeance",',
              'watchers: "watchers",',
          ])
          resolver = resolver.replace(
              '// Only Paul-approved normalized tarot cards are mapped here. Subclasses still in\n// production continue to use the class-menu artwork fallback until individually\n// approved, installed, and added to this resolver.',
              '// Paul-approved normalized Tarot cards are mapped here. The current runtime-visible\n// Forge catalogue is fully covered; safe class-menu fallback remains only for truly\n// unknown/future content and image-load failure.'
          )
          resolver_path.write_text(resolver)

          validator_path = Path('scripts/validate_class_subclass_browser.mjs')
          validator = validator_path.read_text()
          line_updates = {
            '  barbarian: ': '  barbarian: ["ancestral-guardian", "battlerager", "beast", "berserker", "giant", "storm-herald", "totem-warrior", "wild-heart", "wild-magic", "world-tree", "zealot"],',
            '  bard: ': '  bard: ["creation", "dance", "eloquence", "glamour", "lore", "moon", "spirits", "swords", "valor", "whispers"],',
            '  fighter: ': '  fighter: ["arcane-archer", "banneret", "battle-master", "cavalier", "champion", "echo-knight", "eldritch-knight", "purple-dragon-knight-banneret", "psi-warrior", "rune-knight", "samurai"],',
            '  monk: ': '  monk: ["ascendant-dragon", "astral-self", "drunken-master", "elements", "four-elements", "kensei", "long-death", "mercy", "open-hand", "shadow", "sun-soul"],',
            '  paladin: ': '  paladin: ["ancients", "conquest", "crown", "devotion", "glory", "noble-genies", "oathbreaker", "redemption", "vengeance", "watchers"],',
          }
          lines = validator.splitlines()
          for prefix, replacement in line_updates.items():
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f'validator {prefix.strip()}: expected 1 match, found {len(matches)}')
              lines[matches[0]] = replacement
          paladin_index = next(i for i, line in enumerate(lines) if line.startswith('  paladin: '))
          if not any(line.startswith('  mystic: ') for line in lines):
              lines.insert(paladin_index, '  mystic: ["avatar", "awakened", "immortal", "nomad", "soul-knife", "wu-jen"],')
          validator = '\n'.join(lines) + '\n'
          old_count = 'assert(approvedTarotCount === 130, `Expected 130 installed approved normalized tarot concepts, found ${approvedTarotCount}.`);'
          new_count = 'assert(approvedTarotCount === 152, `Expected 152 installed approved normalized Tarot concepts, found ${approvedTarotCount}.`);'
          if validator.count(old_count) != 1:
              raise SystemExit('validator 130-count assertion missing/ambiguous')
          validator = validator.replace(old_count, new_count, 1)
          anchor = "for (const token of ['\"ambition-psa\": \"ambition\"'"
          if validator.count(anchor) != 1:
              raise SystemExit('validator alias anchor missing/ambiguous')
          checks = '''const finalCompletionMappings = [
            '"ancestral-guardian": "ancestral-guardian"',
            'battlerager: "battlerager"',
            'beast: "beast"',
            'giant: "giant"',
            '"storm-herald": "storm-herald"',
            '"totem-warrior": "totem-warrior"',
            '"wild-magic": "wild-magic"',
            'swords: "swords"',
            'samurai: "samurai"',
            '"ascendant-dragon": "ascendant-dragon"',
            '"astral-self": "astral-self"',
            '"four-elements": "four-elements"',
            '"long-death": "long-death"',
            '"sun-soul": "sun-soul"',
            'avatar: "avatar"',
            'awakened: "awakened"',
            'immortal: "immortal"',
            'nomad: "nomad"',
            '"soul-knife": "soul-knife"',
            '"wu-jen": "wu-jen"',
            'crown: "crown"',
            'watchers: "watchers"',
          ];
          for (const token of finalCompletionMappings) {
            assert(subclassArtwork.includes(token), `Final runtime-visible Tarot mapping missing ${token}`);
          }
          '''
          checks = '\n'.join(line[10:] if line.startswith('          ') else line for line in checks.splitlines()) + '\n'
          validator = validator.replace(anchor, checks + anchor, 1)
          validator = validator.replace('all 130 approved normalized tarot concepts are installed and mapped', 'all 152 approved normalized Tarot concepts are installed and the runtime-visible deck is fully mapped')
          validator_path.write_text(validator)

          checklist = '''# Character Forge Tarot Subclass Artwork Checklist

          Status date: 2026-09-17

          This checklist tracks the production-visible Tarot deck, not the historical preferred-source concept count.

          ## Completion authority

          - Runtime-visible choices: **149**.
          - Dedicated-card target: **149**.
          - Runtime-visible choices covered by Paul-approved dedicated Tarot art: **149 / 149**.
          - Known current runtime-visible choices resolving to generic/class fallback: **0**.
          - Installed normalized Tarot concept ledger: **152**, because the normalized ledger retains compatibility/alias identities and is not a one-to-one count of visible carousel choices.

          The older **109** preferred-source checkpoint remains provenance only; it is not the production completion definition.

          ## Wizard compatibility note

          Runtime compatibility suppresses four historical duplicate/reprint identities from the visible Wizard carousel: **Abjuration, Divination, Evocation, and Illusion**. Their assets/mappings remain repository history and they are not missing runtime cards.

          ## 2026-09 completion pass — 43 / 43 resolved

          ### Barbarian — 7
          - [x] Ancestral Guardian
          - [x] Battlerager
          - [x] Beast
          - [x] Giant
          - [x] Storm Herald
          - [x] Totem Warrior
          - [x] Wild Magic

          ### Bard — 4
          - [x] Creation
          - [x] Eloquence
          - [x] Swords
          - [x] Whispers

          ### Fighter — 6
          - [x] Arcane Archer
          - [x] Cavalier
          - [x] Echo Knight
          - [x] Purple Dragon Knight (Banneret)
          - [x] Rune Knight
          - [x] Samurai

          ### Monk — 7
          - [x] Ascendant Dragon
          - [x] Astral Self
          - [x] Drunken Master
          - [x] Four Elements
          - [x] Kensei
          - [x] Long Death
          - [x] Sun Soul

          ### Mystic — 6
          - [x] Avatar
          - [x] Awakened
          - [x] Immortal
          - [x] Nomad
          - [x] Soul Knife
          - [x] Wu Jen

          ### Paladin — 5
          - [x] Conquest
          - [x] Crown
          - [x] Oathbreaker
          - [x] Redemption
          - [x] Watchers

          ### Ranger — 4
          - [x] Drakewarden
          - [x] Horizon Walker
          - [x] Monster Slayer
          - [x] Swarmkeeper

          ### Rogue — 4
          - [x] Inquisitive
          - [x] Mastermind
          - [x] Scout
          - [x] Swashbuckler

          **Completion-pass total: 43 / 43.**

          ## Final review notes

          - Giant uses the approved revised weapon composition.
          - Totem Warrior uses the approved composition with the purple emblem fill removed.
          - Watchers uses the approved revised species/composition.
          - Soul Knife uses Paul’s final explicitly selected 2026-09-17 version.
          - Wu Jen uses Paul’s final explicitly selected 2026-09-17 version.
          - Mastermind was already complete and was not regenerated in the final pass.

          ## Current runtime fallback queue — 0

          No known current runtime-visible subclass remains in the generic/class-art fallback queue.

          **Current remaining total: 0.**

          Re-audit the runtime-visible set after future catalogue/import changes; truly new or unknown subclasses may safely use class fallback until approved dedicated artwork is added.

          ## Completion / art contract

          A card counts complete only after exact identity confirmation, Paul approval, anatomy/prop/species QA, canonical 7:12 composition, 840×1440 WebP export, canonical install path, explicit resolver wiring (or an explicitly approved alias), no known generic fallback, and focused validation.

          Canonical art remains full-bleed cinematic fantasy realism with the fixed antique-gold frame/title/emblem geometry, no opaque footer or separate title band, restrained lower readability treatment, deliberate species and scene diversity, and mandatory full-resolution QA.

          ## Protected boundaries

          Subclass artwork is presentation-only. No Supabase mutation is required. Do not touch world-map/town-map behavior, travel/routes/weather/camps/clock, crafting, inventory, merchants, economy, encounter/tactical authority, or unrelated character runtime while maintaining this deck.
          '''
          checklist = '\n'.join(line[10:] if line.startswith('          ') else line for line in checklist.splitlines()) + '\n'
          Path('docs/CHARACTER_FORGE_TAROT_SUBCLASS_ARTWORK_CHECKLIST.md').write_text(checklist)
          PY

      - name: Validate final deck and exact diff
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate_class_subclass_browser.mjs
          expected=$(mktemp)
          actual=$(mktemp)
          printf '%s\n' docs/CHARACTER_FORGE_TAROT_SUBCLASS_ARTWORK_CHECKLIST.md scripts/validate_class_subclass_browser.mjs utils/classes/subclassArtwork.js | sort > "$expected"
          git diff --name-only | sort > "$actual"
          diff -u "$expected" "$actual"
          git diff --check

      - name: Commit completion wiring to artwork branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CHARACTER_FORGE_TAROT_SUBCLASS_ARTWORK_CHECKLIST.md scripts/validate_class_subclass_browser.mjs utils/classes/subclassArtwork.js
          git commit -m 'Complete runtime-visible subclass Tarot deck'
          git push origin HEAD:agent/subclass-tarot-approved-batch-20260916
