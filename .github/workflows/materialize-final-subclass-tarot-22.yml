name: Materialize final approved subclass Tarot batch

on:
  push:
    branches:
      - agent/subclass-tarot-final22-materialize-20260916

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact target artwork branch
        uses: actions/checkout@v4
        with:
          ref: agent/subclass-tarot-approved-batch-20260916
          fetch-depth: 0

      - name: Verify exact target head
        shell: bash
        run: |
          set -euo pipefail
          expected="34cbb57b2541771859e54c29e90687d56a855f2e"
          actual="$(git rev-parse HEAD)"
          echo "Target head: $actual"
          [[ "$actual" == "$expected" ]] || { echo "::error::Target branch moved; expected $expected, found $actual"; exit 1; }

      - name: Download and verify approved artwork archive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            'https://uc7fb3788295253dcc64bee329cd.dl.dropboxusercontent.com/cd/0/get/DISbguWs5ROAphCXQwjLTDKyzcBaGNWJ0z1-uqsbjzhp3rsYtNZqQoC0p5JJBapzt8WBesTmRJehVWt6odsuB2uskbRqrqemGui6p0aeOt69QtHrrj_KPy0I-CLIG2jz0tFGeCyxkz2E_MTzAiQZVr2aKS-1nH73UaiE570AZ20sQA/file?c_luid=c335000c' \
            -o /tmp/final-tarot.zip
          echo '7b29c2730c3f18ce13b1eaee4b8f6a2d9b9bc2374166e02cab3787f7f0e35229  /tmp/final-tarot.zip' | sha256sum -c -
          rm -rf /tmp/final-tarot-stage
          mkdir -p /tmp/final-tarot-stage
          unzip -q /tmp/final-tarot.zip -d /tmp/final-tarot-stage
          jq -e '.target_branch == "agent/subclass-tarot-approved-batch-20260916" and .expected_head == "34cbb57b2541771859e54c29e90687d56a855f2e" and (.files|length) == 22' /tmp/final-tarot-stage/manifest.json >/dev/null

          while IFS=$'\t' read -r path expected_sha; do
            file="/tmp/final-tarot-stage/$path"
            [[ -f "$file" ]] || { echo "::error::Missing archive file $path"; exit 1; }
            actual_sha="$(sha256sum "$file" | awk '{print $1}')"
            [[ "$actual_sha" == "$expected_sha" ]] || { echo "::error::Checksum mismatch for $path"; exit 1; }
          done < <(jq -r '.files[] | [.path,.sha256] | @tsv' /tmp/final-tarot-stage/manifest.json)

      - name: Verify WebP dimensions and canonical paths
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const stage = '/tmp/final-tarot-stage';
          const manifest = JSON.parse(fs.readFileSync(path.join(stage, 'manifest.json'), 'utf8'));
          function read24le(buf, off) { return buf[off] | (buf[off+1] << 8) | (buf[off+2] << 16); }
          function webpSize(buf) {
            if (buf.toString('ascii',0,4) !== 'RIFF' || buf.toString('ascii',8,12) !== 'WEBP') throw new Error('not WebP');
            let off = 12;
            while (off + 8 <= buf.length) {
              const tag = buf.toString('ascii', off, off+4);
              const len = buf.readUInt32LE(off+4);
              const d = off + 8;
              if (tag === 'VP8X') return [1 + read24le(buf,d+4), 1 + read24le(buf,d+7)];
              if (tag === 'VP8 ' && d + 10 <= buf.length) return [buf.readUInt16LE(d+6) & 0x3fff, buf.readUInt16LE(d+8) & 0x3fff];
              if (tag === 'VP8L' && d + 5 <= buf.length) {
                const b1=buf[d+1], b2=buf[d+2], b3=buf[d+3], b4=buf[d+4];
                return [1 + b1 + ((b2 & 0x3f) << 8), 1 + (b2 >> 6) + (b3 << 2) + ((b4 & 0x0f) << 10)];
              }
              off = d + len + (len & 1);
            }
            throw new Error('WebP dimensions unavailable');
          }
          const seen = new Set();
          for (const item of manifest.files) {
            if (!/^public\/media\/subclasses\/[a-z0-9-]+\/[a-z0-9-]+\.webp$/.test(item.path)) throw new Error(`noncanonical path ${item.path}`);
            if (seen.has(item.path)) throw new Error(`duplicate path ${item.path}`);
            seen.add(item.path);
            const size = webpSize(fs.readFileSync(path.join(stage,item.path)));
            if (size[0] !== 840 || size[1] !== 1440) throw new Error(`${item.path} is ${size.join('x')}, expected 840x1440`);
          }
          if (seen.size !== 22) throw new Error(`expected 22 artwork files, found ${seen.size}`);
          console.log('Verified 22 canonical 840x1440 WebP assets.');
          NODE

