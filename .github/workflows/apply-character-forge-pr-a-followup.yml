name: Apply Character Forge PR A follow-up

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/apply_character_forge_pr_a_followup.py"
      - ".github/workflows/apply-character-forge-pr-a-followup.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.head_ref == 'agent/character-forge-resilience-presentation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/character-forge-resilience-presentation
          fetch-depth: 0

      - name: Apply asserted follow-up
        run: python tools/apply_character_forge_pr_a_followup.py

      - name: Remove one-use helpers
        run: |
          rm -f tools/apply_character_forge_pr_a_followup.py
          rm -f .github/workflows/apply-character-forge-pr-a-followup.yml

      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reconcile Character Forge validation coverage"
          git push origin HEAD:agent/character-forge-resilience-presentation
