          handoff = Path('docs/CHARACTER_FORGE_TAROT_SUBCLASS_ART_HANDOFF.md')
          s = handoff.read_text()
          anchor = '## Project / repo context\n'
          startup = '''## START HERE — connector / transfer workflow\n\nBefore doing artwork or repository work in a new conversation, use the connected **GitHub, Supabase, Vercel, and Dropbox** tools. Do not rediscover access from scratch.\n\n- **GitHub:** re-fetch PR #187, `agent/subclass-carousel-selector-20260911`, its exact current head, current files, and Actions/check state.\n- **Supabase:** verify preferred-source subclass catalogue data in `DnDWeb` (`ucggczovhmauhshvhusx`) when names/queue authority matter; artwork work is read-only and requires no DB mutation.\n- **Vercel:** after a push, find the preview deployment whose metadata matches the exact new target-branch Git SHA, wait for `READY`, inspect logs on failure, and use protected-preview fetch/access tools when needed.\n- **Dropbox:** use `/DNDNext-Transfer/` for approved binary ZIP payloads. Temporary download links may be single-use, so the GitHub Actions runner should perform the first real GET.\n\nWhen a real checkout, shell transform, or binary transfer is required, use the proven **scratch/preview branch** pattern: create the scratch branch from the exact PR head, put a one-shot workflow there, have that workflow check out the real PR branch, hard-guard the expected head SHA, modify/validate/commit, and push `HEAD:agent/subclass-carousel-selector-20260911`. The scratch branch itself is a runner surface and is **not merged into PR #187 merely to deliver the result**.\n\nRead `docs/REPO_ACCESS_STANDING_RULE.md`, `docs/CHATGPT_REPO_WRITE_PROCEDURE.md`, and `docs/ARTWORK_BINARY_TRANSFER_RUNBOOK.md` before claiming any access/transfer limitation.\n\n'''
          if '## START HERE — connector / transfer workflow' not in s:
              s = s.replace(anchor, startup + anchor, 1)
          s = s.replace(
              'The checklist was reset to zero installed normalized tarot cards after the art purge. It is based on the current preferred Supabase class catalogue and groups only explicitly equivalent alias names where one art concept is intentionally shared.',
              'The checklist now records the first 34 approved normalized tarot concepts as installed, wired, and validated, with 75 concepts remaining. It is based on the current preferred Supabase class catalogue and groups only explicitly equivalent alias names where one art concept is intentionally shared.'
          )
          old_material = '''A working binary-transfer path already exists in repository history and should be reused as a **pattern**, not by restoring its old deleted art.\n\nReference commit:\n\n`30d05db301638d998d7ebbd053750330547ab7d5` — `Materialize reviewed tarot subclass artwork batch`\n'''
          new_material = '''The binary-transfer path is now both historical and **currently proven**. Reuse the guarded Dropbox -> scratch/preview GitHub Actions -> real PR branch pattern; do not restore reset-era art.\n\nCurrent normalized install reference:\n\n`f95aea3d05cb7d5c4cecd1d5f4ed049b07ebd3c5` — `Install approved normalized tarot subclass artwork` (34 approved 840 × 1440 WebP concepts).\n\nCurrent wiring reference:\n\n`40fa46f2710ffadce2962b0bd66e21acefe0bcb5` — `Wire approved normalized tarot subclass artwork`.\n\nHistorical materializer reference:\n\n`30d05db301638d998d7ebbd053750330547ab7d5` — `Materialize reviewed tarot subclass artwork batch`\n'''
          if old_material in s:
              s = s.replace(old_material, new_material, 1)
          handoff.write_text(s)

          readme = Path('docs/README.md')
          r = readme.read_text()
          r = r.replace('Updated: 2026-08-30', 'Updated: 2026-09-13', 1)
          start_marker = '## Start here\n\n'
          start_text = '''## Start here\n\n**New conversations: read the connector/access documents before diagnosing access. GitHub, Supabase, Vercel, and Dropbox are established parts of the DNDNext workflow.**\n\n1. `DNDNext_Current_Handoff_Prompt.md` — current copy-ready takeover brief, active PR/checkpoint, mandatory connector startup, scratch/preview branch push pattern, protected boundaries, and immediate work.\n2. `REPO_ACCESS_STANDING_RULE.md` — standing rule that GitHub/Supabase/Vercel/Dropbox must be checked before claiming access is unavailable.\n3. `CHATGPT_REPO_WRITE_PROCEDURE.md` — ordinary GitHub writes, exact-head discipline, and the bounded scratch/preview Actions runner pattern that can push verified results to the real PR branch.\n4. `ARTWORK_BINARY_TRANSFER_RUNBOOK.md` — Dropbox `/DNDNext-Transfer/` -> guarded GitHub Actions materializer -> target PR branch -> Vercel exact-head verification.\n5. The dedicated active subsystem handoff/ledger. For current subclass artwork: `CHARACTER_FORGE_TAROT_SUBCLASS_ART_HANDOFF.md`, `CHARACTER_FORGE_TAROT_SUBCLASS_CARD_STANDARD.md`, and `CHARACTER_FORGE_TAROT_SUBCLASS_ARTWORK_CHECKLIST.md`.\n6. `Documentation_Refresh_Manifest.md` and other historical architecture/status ledgers as needed.\n\nCurrent handoff-time state: `main` is `02854698298f357d2dfde21dd292ba7caf73e1c1`; active work is PR #187 on `agent/subclass-carousel-selector-20260911`. Always re-fetch both rather than trusting these recorded SHAs. The normalized subclass tarot checklist currently records 34 installed/wired/validated concepts and 75 remaining; next normal batch is Druid Dreams, Land, Moon, Sea.\n\n'''
          first_after = r.find('## Current code checkpoint')
          if first_after == -1:
              raise SystemExit('README current checkpoint marker missing')
          start_at = r.find(start_marker)
          if start_at == -1:
              raise SystemExit('README start marker missing')
          r = r[:start_at] + start_text + r[first_after:]
          # Make the stale checkpoint explicitly historical so it cannot override the new top checkpoint.
          r = r.replace('## Current code checkpoint\n', '## Historical code checkpoint retained for context\n\n> This section predates the 2026-09-13 current handoff above. Re-fetch GitHub before using any PR/SHA named below.\n\n', 1)
          readme.write_text(r)
          PY
