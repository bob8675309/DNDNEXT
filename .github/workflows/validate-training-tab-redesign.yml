name: Validate Training tab redesign

on:
  pull_request:
    branches:
      - main
    paths:
      - "components/NpcForgeTrainingStep.js"
      - "components/NpcForgeTrainingStepBase.js"
      - "components/NpcForgeTrainingStepPlayer.js"
      - "components/NpcForgeTrainingStepPlayerTabbed.js"
      - "components/NpcForgeTrainingContextCard.js"
      - "components/NpcForgeSourceChoiceContext.js"
      - "components/NpcForgeSourceChoiceFields.js"
      - "components/NpcForgeContextPanel.js"
      - "components/NpcForgeContextPanelRefined.js"
      - "components/useNpcForgeTrainingRoutedController.js"
      - "styles/character-forge-responsive.css"
      - "public/ui/forge/training/**"
      - "scripts/validate_training_tab_redesign.mjs"
      - "scripts/validate_training_browser_acceptance.mjs"
      - ".github/workflows/validate-training-tab-redesign.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Training tab redesign
        run: node scripts/validate_training_tab_redesign.mjs

      - name: Validate Training browser acceptance
        run: node scripts/validate_training_browser_acceptance.mjs
