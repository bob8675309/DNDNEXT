jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate progression v5 contracts
        run: |
          node scripts/validate_character_progression_v3.mjs
          node scripts/validate_tough_progression.mjs
          node scripts/validate_source_owned_origin_feat_schema.mjs
