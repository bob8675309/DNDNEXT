name: Temporary NPC Forge Validation

on:
  push:
    branches:
      - feature/npc-forge-background-ability-refinement-20260724
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone branch quietly
        run: git clone -q --depth 1 --branch feature/npc-forge-background-ability-refinement-20260724 https://github.com/bob8675309/DNDNEXT.git repo
      - name: Install dependencies quietly
        working-directory: repo
        run: npm ci --silent
      - name: Run complete build and print diagnostic tail
        working-directory: repo
        shell: bash
        run: |
          set +e
          npm run build:vercel > build.log 2>&1
          status=$?
          tail -n 70 build.log
          exit $status
