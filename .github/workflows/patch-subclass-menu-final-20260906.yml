name: Patch final compact subclass menu 2026-09-06

on:
  push:
    branches:
      - agent/subclass-menu-final-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/subclass-menu-final-20260906
          fetch-depth: 2

      - name: Guard exact starting head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "dc41db591cf53779259d87f9f72c51b5859bcecf"

      - name: Apply final subclass menu proportions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/ClassSubclassSection.js')
          s = path.read_text()

          def repl(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'missing expected token: {old[:160]}')
              s = s.replace(old, new)

          repl('import { classFeatureInline } from "./ClassFeatureText";\n', '')
          repl('''function sourceLabel(source = "") {\n  if (source === "XPHB") return "2024";\n  if (source === "PHB") return "2014";\n  return source || "Campaign";\n}\n\n''', '')
          repl('''function optionSummary(option = {}) {\n  const features = Array.isArray(option?.features) ? option.features : [];\n  const intro = features.find((feature) => feature?.isIntroduction) || features[0] || null;\n  return classFeatureInline(\n    intro?.description,\n    `Explore the defining features and play style of ${option?.name || "this subclass"}.`,\n  );\n}\n\n''', '')

          repl('''            <span className="class-subclass-selected-row__copy">\n              <small>Selected subclass · {sourceLabel(selected.source)} · Level {optionEntryLevel(selected)}</small>\n              <strong>{selected.name}</strong>\n              <em>{optionSummary(selected)}</em>\n            </span>\n            <span className="class-subclass-selected-row__mark" aria-hidden="true">✓</span>''', '''            <span className="class-subclass-selected-row__copy">\n              <strong>{selected.name}</strong>\n            </span>''')

          repl('''                <span className="class-subclass-two-column__copy">\n                  <strong>{text(option.name) || "Subclass"}</strong>\n                  <small>{optionSummary(option)}</small>\n                </span>\n                <span className="class-subclass-two-column__source">{sourceLabel(option.source)}</span>\n                <span className={`class-subclass-two-column__status${isSelected ? " is-selected" : ""}`} aria-hidden="true">{isSelected ? "✓" : eligible ? "" : `L${optionEntryLevel(option)}`}</span>''', '''                <strong className="class-subclass-two-column__name">{text(option.name) || "Subclass"}</strong>''')

          # Yellow-box target: roughly one-third of the desktop Class workspace.
          repl('width:min(54%,620px);max-width:620px', 'width:min(35%,430px);max-width:430px')
          repl('grid-template-columns:70px minmax(0,1fr) 20px', 'grid-template-columns:64px minmax(0,1fr)')
          repl('width:70px;height:36px', 'width:64px;height:32px')
          repl('.class-subclass-selected-row__mark{display:grid;place-items:center;width:21px;height:21px;border:1px solid rgba(var(--class-secondary),.62);border-radius:50%;color:#d8fff9;background:rgba(var(--class-secondary),.11);font-size:.56rem}\n', '')
          repl('.class-subclass-selected-row__copy{display:grid;gap:1px;min-width:0}.class-subclass-selected-row__copy small{color:rgba(255,255,255,.43);font-size:.4rem;font-weight:800;letter-spacing:.035em;text-transform:uppercase}.class-subclass-selected-row__copy strong{color:#f4ebfa;font-family:Georgia,"Times New Roman",serif;font-size:.7rem;font-weight:650;line-height:1.18}.class-subclass-selected-row__copy em{overflow:hidden;color:rgba(255,255,255,.6);font-size:.46rem;font-style:normal;line-height:1.22;text-overflow:ellipsis;white-space:nowrap}', '.class-subclass-selected-row__copy{display:grid;min-width:0}.class-subclass-selected-row__copy strong{overflow:hidden;color:#f4ebfa;font-family:Georgia,"Times New Roman",serif;font-size:.68rem;font-weight:650;line-height:1.18;text-overflow:ellipsis;white-space:nowrap}')

          repl('grid-template-columns:74px minmax(0,1fr) auto 20px', 'grid-template-columns:64px minmax(0,1fr)')
          repl('min-height:44px;padding:4px 6px', 'min-height:42px;padding:3px 5px')
          repl('width:74px;height:36px', 'width:64px;height:32px')
          repl('.class-subclass-two-column__copy{display:grid;gap:1px;min-width:0}.class-subclass-two-column__copy strong{overflow:hidden;color:#f2eaf9;font-family:Georgia,"Times New Roman",serif;font-size:.66rem;font-weight:650;line-height:1.14;text-overflow:ellipsis;white-space:nowrap}.class-subclass-two-column__copy small{overflow:hidden;color:rgba(255,255,255,.5);font-size:.45rem;line-height:1.22;text-overflow:ellipsis;white-space:nowrap}.class-subclass-two-column__source{padding:2px 5px;border:1px solid rgba(var(--class-secondary),.2);border-radius:999px;color:rgba(215,255,249,.72);background:rgba(var(--class-secondary),.05);font-size:.37rem;font-weight:900;white-space:nowrap}.class-subclass-two-column__status{display:grid;place-items:center;min-width:20px;height:20px;color:rgba(255,255,255,.38);font-size:.37rem;font-weight:900}.class-subclass-two-column__status.is-selected{border:1px solid rgba(var(--class-secondary),.64);border-radius:50%;color:#d8fff9;background:rgba(var(--class-secondary),.12);font-size:.52rem}', '.class-subclass-two-column__name{overflow:hidden;min-width:0;color:#f2eaf9;font-family:Georgia,"Times New Roman",serif;font-size:.64rem;font-weight:650;line-height:1.16;text-overflow:ellipsis;white-space:nowrap}')
          repl('@media(max-width:1100px){.class-subclass-section.is-two-column:not(.is-detailed){width:min(60%,620px)}}', '@media(max-width:1100px){.class-subclass-section.is-two-column:not(.is-detailed){width:min(42%,430px)}}')

          path.write_text(s)

          # Update focused validators to protect the final compact art+name contract.
          for validator in ['scripts/validate_class_browser_polish.mjs', 'scripts/validate_class_subclass_browser.mjs']:
              p = Path(validator)
              v = p.read_text()
              replacements = [
                  ('width:min(54%,620px)', 'width:min(35%,430px)'),
                  ('grid-template-columns:74px minmax(0,1fr) auto 20px', 'grid-template-columns:64px minmax(0,1fr)'),
                  ('min-height:44px', 'min-height:42px'),
              ]
              for old, new in replacements:
                  if old not in v:
                      raise SystemExit(f'{validator}: missing {old}')
                  v = v.replace(old, new)
              marker = "for (const forbidden of ["
              if marker not in v:
                  raise SystemExit(f'{validator}: missing forbidden marker')
              v = v.replace(marker, marker + "\n  'class-subclass-two-column__source',\n  'class-subclass-two-column__status',\n  'optionSummary(option)',", 1)
              p.write_text(v)

          selector = Path('components/ClassSubclassSection.js').read_text()
          assert 'width:min(35%,430px)' in selector
          assert 'grid-template-columns:64px minmax(0,1fr)' in selector
          assert 'class-subclass-two-column__name' in selector
          assert 'class-subclass-two-column__source' not in selector
          assert 'class-subclass-two-column__status' not in selector
          assert 'optionSummary' not in selector
          assert 'sourceLabel' not in selector
          assert 'classFeatureInline' not in selector
          assert 'model.selectSubclass(option)' in selector
          assert 'model.setPreviewKey(option.key)' in selector
          assert 'onInspectSubclass?.(option)' in selector
          PY

          node scripts/validate_class_browser_polish.mjs
          node scripts/validate_class_subclass_browser.mjs
          node scripts/validate_class_hero_framing.mjs
          git diff --check

          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$(printf '%s\n' components/ClassSubclassSection.js scripts/validate_class_browser_polish.mjs scripts/validate_class_subclass_browser.mjs | sort)"

      - name: Commit focused final subclass menu
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ClassSubclassSection.js scripts/validate_class_browser_polish.mjs scripts/validate_class_subclass_browser.mjs
          git diff --cached --check
          git commit -m "Finalize compact subclass art menu"
          git push origin HEAD:agent/subclass-menu-final-20260906
