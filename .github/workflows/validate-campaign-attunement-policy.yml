name: Validate Campaign Attunement Policy
on:
  pull_request:
    paths:
      - "sql/20261024_02_campaign_attunement_policy.sql"
      - "pages/admin.js"
      - "components/CharacterAttunementPanel.js"
      - "components/CharacterSheetPanel.js"
      - "scripts/fixtures/campaign_attunement_policy_behavior.sql"
      - "scripts/validate_campaign_attunement_policy.mjs"
      - "sql/20261024_03_passive_equipment_effect_gate_readonly.sql"
      - "sql/20261024_04_verified_attunement_source_rules.sql"
      - "sql/20261024_05_attunement_rest_class_evidence_readonly.sql"
      - "sql/20261024_06_attunement_world_focus_session_foundation.sql"
      - "sql/20261024_07_attunement_canonical_rest_log_bridge.sql"
      - "scripts/fixtures/attunement_canonical_rest_log_bridge_behavior.sql"
      - "scripts/validate_attunement_rest_log_bridge.mjs"
      - "scripts/fixtures/attunement_world_focus_session_behavior.sql"
      - "scripts/validate_attunement_world_focus_session.mjs"
      - "scripts/fixtures/attunement_rest_class_evidence_behavior.sql"
      - "scripts/validate_attunement_rest_class_evidence.mjs"
      - "scripts/fixtures/verified_item_attunement_2024.json"
      - "scripts/fixtures/verified_attunement_source_rules_behavior.sql"
      - "scripts/validate_verified_attunement_sources.mjs"
      - "scripts/fixtures/passive_equipment_source_gate_behavior.sql"
      - "scripts/validate_passive_equipment_source_gate.mjs"
      - ".github/workflows/validate-campaign-attunement-policy.yml"
  push:
    branches: [main]
    paths:
      - "sql/20261024_02_campaign_attunement_policy.sql"
      - "pages/admin.js"
      - "components/CharacterAttunementPanel.js"
      - "components/CharacterSheetPanel.js"
      - "scripts/fixtures/campaign_attunement_policy_behavior.sql"
      - "scripts/validate_campaign_attunement_policy.mjs"
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate_campaign_attunement_policy.mjs
      - run: node scripts/validate_passive_equipment_source_gate.mjs
      - run: node scripts/validate_verified_attunement_sources.mjs
      - run: node scripts/validate_attunement_rest_class_evidence.mjs
      - run: node scripts/validate_attunement_world_focus_session.mjs
      - run: node scripts/validate_attunement_rest_log_bridge.mjs
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: attunement_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d attunement_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: attunement_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/campaign_attunement_policy_behavior.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f sql/20261024_04_verified_attunement_source_rules.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f sql/20261024_03_passive_equipment_effect_gate_readonly.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/passive_equipment_source_gate_behavior.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/verified_attunement_source_rules_behavior.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f sql/20261024_05_attunement_rest_class_evidence_readonly.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/attunement_rest_class_evidence_behavior.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f sql/20261024_06_attunement_world_focus_session_foundation.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/attunement_world_focus_session_behavior.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f sql/20261024_07_attunement_canonical_rest_log_bridge.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/attunement_canonical_rest_log_bridge_behavior.sql
