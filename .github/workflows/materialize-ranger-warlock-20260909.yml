name: Materialize Ranger Warlock 20260909

on:
  push:
    branches:
      - agent/class-cinematic-ranger-warlock-20260909
    paths:
      - .github/workflows/materialize-ranger-warlock-20260909.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/realistic-dice-core
      EXPECTED_TARGET_HEAD: a06489a77e8f8c0476b82d09334cb15b30fd843e
      RANGER_URL: https://uc6d4a2b0837d59505334f3cceb2.dl.dropboxusercontent.com/cd/0/get/DH3NO81GVws0ZW5gVB8ssFb6PFaH91_L2thE6NUuXCxbs7G2ZgzQyjj1wrE-8isOyRnUMPiiqyc4Gz7X3uYN_inrZ_g2xeSMs-IltwGwtDDRpE70hPMnSMAUk1V_kJ2tysDCjzQzBBS255OMGhMuonRQmWrjG9FWiLne1yA0SS5kfg/file?c_luid=c335000c
      WARLOCK_URL: https://uca6770ed1007b45024fcbab6ba6.dl.dropboxusercontent.com/cd/0/get/DH0aLgqPOqcuQKenHbeCr2YCFATRRGZMucqIT3Jc6BvCQ6i9DMJZw82iDISL_QmN_3dgOLiQqZ5K84-QK0SjRsg-mE121sDhHlyfcm8V0Ihrb1EHdQzArjY5fOZZwTK2rAdxtCQwv5OaeagIM2HYUPkn-W0vSTObE49XDLmL34mCeg/file?c_luid=c335000c
      RANGER_SHA256: 912b672a5cab22c9197902741cc8cf4a041799e1f319dd522ab551b649fbbd6c
      WARLOCK_SHA256: bd5387da040af3cf1d570a6b1d3d7ecc216d2923b583ad3d1f2bc76c2b3f96f8
    steps:
      - name: Check out exact working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          clean: true

      - name: Guard exact target head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"

      - name: Download approved artwork
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$RANGER_URL" -o /tmp/cinematic-ranger.webp
          curl --fail --location --silent --show-error "$WARLOCK_URL" -o /tmp/cinematic-warlock.webp
          echo "$RANGER_SHA256  /tmp/cinematic-ranger.webp" | sha256sum -c -
          echo "$WARLOCK_SHA256  /tmp/cinematic-warlock.webp" | sha256sum -c -

      - name: Verify artwork dimensions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python - <<'PY'
          from PIL import Image
          for path in ['/tmp/cinematic-ranger.webp','/tmp/cinematic-warlock.webp']:
              with Image.open(path) as image:
                  assert image.format == 'WEBP', (path, image.format)
                  assert image.size == (1600, 900), (path, image.size)
          PY

      - name: Apply bounded hero replacements
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 /tmp/cinematic-ranger.webp public/media/classes/cinematic-ranger.webp
          install -m 0644 /tmp/cinematic-warlock.webp public/media/classes/cinematic-warlock.webp
          cat > /tmp/expected.txt <<'EOF'
          public/media/classes/cinematic-ranger.webp
          public/media/classes/cinematic-warlock.webp
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          git diff --name-only | sort > /tmp/actual.txt
          sort /tmp/expected.txt -o /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --check

      - name: Run focused Class regressions
        run: |
          node scripts/validate_class_browser_polish.mjs
          node scripts/validate_class_hero_framing.mjs
          node scripts/validate_class_subclass_browser.mjs
          node scripts/validate_class_final_browser_fix.mjs
          node scripts/validate_species_class_review_fix.mjs
          node scripts/validate_player_forge_source_magic_routing.mjs

      - name: Commit and push validated hero replacements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --pathspec-from-file=/tmp/expected.txt
          git commit -m "Replace Ranger and Warlock cinematic heroes"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_TARGET_HEAD"
          git push origin "HEAD:$TARGET_BRANCH"
