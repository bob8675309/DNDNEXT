name: C34 B14 original inventory authorization crosswalk (research only)
on:
  push:
    branches:
      - research/c34-clean-main-privacy-forge-joint-source-20261112
    paths:
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_inventory_roles_source.mjs'
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_p2_forge_town_bridge_source.mjs'
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_p5_quest_item_intent_contract.mjs'
      - 'scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p5_quest_item_intent_contract.mjs'
      - 'scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p6_npc_tier_ui_presets.mjs'
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_p6_npc_tier_ui_presets.mjs'
      - 'scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p7_npc_backpack_client_pager.mjs'
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_p7_npc_backpack_client_pager.mjs'
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_p8_npc_consent_cutover_red_source.mjs'
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_p9_npc_interaction_client.mjs'
      - 'scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p9_npc_interaction_client.mjs'
      - '.github/workflows/validate-c34-c2b14-inventory-source.yml'
  pull_request:
    paths:
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_inventory_roles_source.mjs'
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_p2_forge_town_bridge_source.mjs'
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_p5_quest_item_intent_contract.mjs'
      - 'scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p5_quest_item_intent_contract.mjs'
      - 'scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p6_npc_tier_ui_presets.mjs'
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_p6_npc_tier_ui_presets.mjs'
      - 'scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p7_npc_backpack_client_pager.mjs'
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_p7_npc_backpack_client_pager.mjs'
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_p8_npc_consent_cutover_red_source.mjs'
      - 'scripts/integration/c34/test_t46_p3_p4b_c2b14_p9_npc_interaction_client.mjs'
      - 'scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p9_npc_interaction_client.mjs'
      - '.github/workflows/validate-c34-c2b14-inventory-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read-only checkout with no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source test syntax
        run: node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_inventory_roles_source.mjs
      - name: B14-P2-C2 Forge/Town original ownership and hidden-target source contract
        run: |
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p2_forge_town_bridge_source.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p2_forge_town_bridge_source.mjs
      - name: Future NPC quest item-send/request side-effect-free intent and unchanged trade sources
        run: |
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p5_quest_item_intent_contract.mjs
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p5_quest_item_intent_contract.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p5_quest_item_intent_contract.mjs
      - name: B14-P6 GM tier presets and encounter-only UI authority model
        run: |
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p6_npc_tier_ui_presets.mjs
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p6_npc_tier_ui_presets.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p6_npc_tier_ui_presets.mjs
      - name: P7 lazy redacted NPC backpack adapter and original UI/equip source locks
        run: |
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p7_npc_backpack_client_pager.mjs
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p7_npc_backpack_client_pager.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p7_npc_backpack_client_pager.mjs
      - name: P9 slim NPC context plus P7 paged backpack and independent equipment source-only adapter
        run: |
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p9_npc_interaction_client.mjs
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p9_npc_interaction_client.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p9_npc_interaction_client.mjs
      - name: P8 original NPC-consent-bypass crosswalk and original player trade source RED
        run: |
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p8_npc_consent_cutover_red_source.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p8_npc_consent_cutover_red_source.mjs
      - name: Full checked-in SQL role override scan and exact original RED preservation
        run: node scripts/integration/c34/test_t46_p3_p4b_c2b14_inventory_roles_source.mjs
      - name: No merchant panel or protected world map edits
        run: |
          git diff --exit-code -- components/MapPageClient.js components/MerchantPanel.js components/c34/MerchantPanelT28P2Research.jsx pages/inventory.js components/AssignItemButton.js
