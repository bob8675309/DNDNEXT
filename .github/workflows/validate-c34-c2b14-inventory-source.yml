permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read-only checkout with no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source test syntax
        run: node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_inventory_roles_source.mjs
      - name: B14-P2-C2 Forge/Town original ownership and hidden-target source contract
        run: |
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p2_forge_town_bridge_source.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p2_forge_town_bridge_source.mjs
      - name: Future NPC quest item-send/request side-effect-free intent and unchanged trade sources
        run: |
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p5_quest_item_intent_contract.mjs
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p5_quest_item_intent_contract.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p5_quest_item_intent_contract.mjs
      - name: B14-P6 GM tier presets and encounter-only UI authority model
        run: |
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p6_npc_tier_ui_presets.mjs
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p6_npc_tier_ui_presets.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p6_npc_tier_ui_presets.mjs
      - name: P7 lazy redacted NPC backpack adapter and original UI/equip source locks
        run: |
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p7_npc_backpack_client_pager.mjs
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p7_npc_backpack_client_pager.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p7_npc_backpack_client_pager.mjs
      - name: P9 slim NPC context plus P7 paged backpack and independent equipment source-only adapter
        run: |
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p9_npc_interaction_client.mjs
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p9_npc_interaction_client.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p9_npc_interaction_client.mjs
      - name: P10 isolated React non-map NPC inventory and disposable browser source contract
        run: |
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b14_p10_npc_inventory_browser_signed.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p10_npc_inventory_shell_source.mjs
      - name: P11 original hidden profile and NPC reader/source transfer preservation graph
        run: |
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p11_legacy_reader_origin_source.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p11_legacy_reader_origin_source.mjs
      - name: P8 typed client-intent research contract (NOT backend consent cutover)
        run: |
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b14_p8_intent_dispatch_client.mjs
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p8_intent_dispatch_client.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p8_intent_dispatch_client.mjs
      - name: P8 original NPC-consent-bypass crosswalk and original player trade source RED
        run: |
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p8_npc_consent_cutover_red_source.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p8_npc_consent_cutover_red_source.mjs
      - name: P12 source-original NPC and GM consent caller graph expected RED (no hosted SQL)
        run: |
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p12_original_inventory_consent_caller_graph_source.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p12_original_inventory_consent_caller_graph_source.mjs
      - name: P13 full runtime code inventory, old RPC callers and merchant/Forge/Town role separation
        run: |
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p13_runtime_consent_entrypoints_source.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p13_runtime_consent_entrypoints_source.mjs
      - name: Full checked-in SQL role override scan and exact original RED preservation
        run: node scripts/integration/c34/test_t46_p3_p4b_c2b14_inventory_roles_source.mjs
      - name: P14 expected-RED current-offer, private bulk mapping and owner-release crosswalk (source only)
        run: |
          node --check scripts/research/c34_b14_p14_cutover_source_witness.mjs
          node --test scripts/research/c34_b14_p14_cutover_source_witness.mjs
      - name: P15 controller source vs held PR312 and old NPC consent bypass preservation expected RED
        run: |
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p15_controller_and_legacy_cutover_source.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p15_controller_and_legacy_cutover_source.mjs
      - name: P16 isolated signed legacy NPC bypass and grant-restoration source witness (not hosted)
        run: |
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b14_p16_consent_cutover_signed.mjs
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p16_signed_cutover_source.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p16_signed_cutover_source.mjs
      - name: P17 source-pinned direct inventory writers and character-owner spoof expected RED (research only)
        run: |
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b14_p17_character_owner_spoof_red_signed.mjs
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b14_p17_inventory_writer_and_character_spoof_source.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b14_p17_inventory_writer_and_character_spoof_source.mjs
      - name: No merchant panel or protected world map edits
        run: |
          git diff --exit-code -- components/MapPageClient.js components/MerchantPanel.js components/c34/MerchantPanelT28P2Research.jsx pages/inventory.js components/AssignItemButton.js
