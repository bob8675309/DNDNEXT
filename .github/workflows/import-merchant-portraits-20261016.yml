agonborn-jeweler-20261016.png","url":"https://ucd5dbc1f440219636fe3669dab9.dl.dropboxusercontent.com/cd/0/get/DKJ1V7eGkLW5AySEbCsLYJoP19nrpAc30PW990U6QLAI19DZcgNqCkzwzNXNMt0pLaCp4QPnx7i1gmHEKwTD2Z4Xx93JR2c4TEpOswMTY2FxpbwS3vf2xHThreV8NIhQsY2f1LY98kq-7Beap2wpqaWVijj7l4DtvMRskmJPzoJd7Q/file?c_luid=c335000c","hash":"81c5c1138f43a54e5de66447cd61bb495cea522574e3a6ad2d5eebccb863404a","size":3339514}]'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, struct, urllib.request
          from pathlib import Path
          manifest = json.loads(os.environ["PORTRAIT_MANIFEST"])
          target = Path("public/npc-portraits/library/merchant-batch-20261016")
          target.mkdir(parents=True, exist_ok=True)
          def dropbox_hash(data: bytes) -> str:
              block = 4 * 1024 * 1024
              digests = b"".join(hashlib.sha256(data[i:i+block]).digest() for i in range(0, len(data), block))
              return hashlib.sha256(digests).hexdigest()
          for item in manifest:
              req = urllib.request.Request(item["url"], headers={"User-Agent":"DNDNext-Portrait-Import/1.0"})
              with urllib.request.urlopen(req, timeout=120) as resp:
                  data = resp.read()
              if len(data) != int(item["size"]):
                  raise SystemExit(f'{item["name"]}: size mismatch')
              if dropbox_hash(data) != item["hash"]:
                  raise SystemExit(f'{item["name"]}: Dropbox content hash mismatch')
              if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise SystemExit(f'{item["name"]}: not a valid PNG')
              width, height = struct.unpack(">II", data[16:24])
              if width < 768 or height < 1024:
                  raise SystemExit(f'{item["name"]}: portrait too small: {width}x{height}')
              if abs((width / height) - 0.75) > 0.002:
                  raise SystemExit(f'{item["name"]}: expected 3:4 portrait, got {width}x{height}')
              (target / item["name"]).write_bytes(data)
              print(f'OK {item["name"]}: {width}x{height} {len(data)} bytes')
          PY
      - name: Guard and commit only portrait assets
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | awk '$2 !~ /^public\/npc-portraits\/library\/merchant-batch-20261016\// {print}')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected working tree changes:"
            echo "$unexpected"
            exit 1
          fi
          git add public/npc-portraits/library/merchant-batch-20261016
