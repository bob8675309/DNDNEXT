name: C34 T46-GLOBAL-G2 actual global player Profile signed browser (disposable)
on:
  push:
    branches:
      - research/c34-clean-main-privacy-forge-joint-source-20261112
    paths:
      - 'scripts/integration/c34/test_t46_global_g2_player_profile_signed_browser.mjs'
      - 'scripts/integration/c34/test_t46_global_g2_overlay_source.mjs'
      - 'scripts/integration/c34/candidates/t46_global_g2_player_profile_overlay.mjs'
      - '.github/workflows/validate-c34-t46-global-g2-player-profile-browser.yml'
      - 'components/PlayerCharacterProfilePanelUnified.js'
      - 'scripts/integration/c34/sources/02_npc_profile_stage1.sql'
      - 'scripts/integration/c34/sources/03_npc_dossier_stage2.sql'
  pull_request:
    paths:
      - 'scripts/integration/c34/test_t46_global_g2_player_profile_signed_browser.mjs'
      - 'scripts/integration/c34/test_t46_global_g2_overlay_source.mjs'
      - 'scripts/integration/c34/candidates/t46_global_g2_player_profile_overlay.mjs'
      - '.github/workflows/validate-c34-t46-global-g2-player-profile-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-global-source-and-safe-candidate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/research/c34-clean-main-privacy-forge-joint-source-20261112')
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      CI: 'true'
      PGHOST: '127.0.0.1'
      PGPORT: '54322'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      DNDNEXT_C34_LOCAL_CONFIRM: DISPOSABLE_LOCAL_GOTRUE_PG17_ONLY
    steps:
      - name: Checkout research code, no retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Source-exact static preservation and G2 candidate syntax
        run: |
          node --check scripts/integration/c34/test_t46_global_g2_player_profile_signed_browser.mjs
          node --check scripts/integration/c34/candidates/t46_global_g2_player_profile_overlay.mjs
          node --test scripts/integration/c34/test_t46_global_g2_overlay_source.mjs
          node --test scripts/integration/c34/test_t46_p2_profile_source.mjs
      - name: Install current lockfile Next and local Chromium controller
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/t46-g2-browser-tools"
          npm install --prefix "$RUNNER_TEMP/t46-g2-browser-tools" --no-save --package-lock=false --no-audit --no-fund --no-progress playwright-core@1.56.1 esbuild@0.25.12
      - name: Start disposable PostgreSQL17 and local GoTrue/PostgREST
        run: |
          mkdir -p "$RUNNER_TEMP/t46-global-g2/supabase"
          cat > "$RUNNER_TEMP/t46-global-g2/supabase/config.toml" <<'TOML'
          project_id = "t46-global-g2-original-profile"
          [db]
          port = 54322
          major_version = 17
          [auth.email]
          enable_confirmations = false
          TOML
          cd "$RUNNER_TEMP/t46-global-g2"
          npx --yes supabase@2.120.0 start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Source-original Forge and exact held 345 Stage1/2/3 in LOCAL PostgreSQL17
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGPORT" = 54322
          test "$PGDATABASE" = postgres
          test "$GITHUB_ACTIONS" = true
          (cd "$RUNNER_TEMP/t46-global-g2" && npx --yes supabase@2.120.0 status -o env) > "$RUNNER_TEMP/t46-global-g2-env"
          psql -X -v ON_ERROR_STOP=1 -v DNDNEXT_C33_PRIVACY_STAGE3_CREATOR=1 -f scripts/integration/c34/fixtures/forge_creation_replay_local_auth_pr351_pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/c33_forge_privacy_original_policy_join_pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/integration/c34/sources/02_npc_profile_stage1.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/integration/c34/sources/03_npc_dossier_stage2.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/integration/c34/sources/04_private_story_stage3.sql
          echo 'PASS T46-GLOBAL-G2-SOURCE: original #345 Stage1/2/3 on isolated PG17'
      - name: Actual Next16 browser, original global fallback RED and local candidate actor/revoke
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/t46-global-g2-env"
          export DNDNEXT_C34_LOCAL_URL=http://127.0.0.1:54321
          export DNDNEXT_C34_LOCAL_ANON_KEY="$ANON_KEY"
          export C33_BROWSER_TOOL_ROOT="$RUNNER_TEMP/t46-g2-browser-tools"
          export C33_BROWSER_CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$C33_BROWSER_CHROME" || { echo 'No local Chromium; no remote fallback' >&2; exit 1; }
          test ! -e pages/__c34_t46_global_g2_probe.jsx
          node scripts/integration/c34/test_t46_global_g2_player_profile_signed_browser.mjs
          test ! -e pages/__c34_t46_global_g2_probe.jsx
          echo 'PASS T46-GLOBAL-G2 research-only original RED to candidate browser, source restored'
      - name: Stop disposable local signed database and remove temporary identity data
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/t46-global-g2" ]; then
            cd "$RUNNER_TEMP/t46-global-g2"
            npx --yes supabase@2.120.0 stop --no-backup || true
          fi
