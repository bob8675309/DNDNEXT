name: Validate NPC sheet cache once
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/npc-sheet-snapshot-cache
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate_npc_sheet_selection_reconciliation.mjs
      - run: npm run build
