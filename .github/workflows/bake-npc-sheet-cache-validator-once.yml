name: Bake NPC sheet cache validator once
on:
  push:
    branches: [agent/npc-sheet-snapshot-cache]
    paths:
      - scripts/bake_npc_sheet_cache_validator_once.mjs
      - .github/workflows/bake-npc-sheet-cache-validator-once.yml
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/npc-sheet-snapshot-cache
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/bake_npc_sheet_cache_validator_once.mjs
