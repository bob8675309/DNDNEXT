name: T28-P0 pure non-map actor/merchant stock-wallet request epoch source guards

on:
  pull_request:
    paths:
      - 'utils/c34/actorRequestEpochCandidate.mjs'
      - 'scripts/integration/c34/test_t28_actor_epoch_candidate.mjs'
      - '.github/workflows/validate-t28-p0-epoch-source.yml'
  push:
    branches: [main]
    paths:
      - 'utils/c34/actorRequestEpochCandidate.mjs'
      - 'scripts/integration/c34/test_t28_actor_epoch_candidate.mjs'
      - '.github/workflows/validate-t28-p0-epoch-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-original-source-and-epoch-negatives:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact checked source SHA (no deploy credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22 (no service or app dependencies)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original merchant/wallet/map source pins and model RED-to-GREEN cases
        run: |
          set -euo pipefail
          test ! -e pages/__c34_t28_persistent_probe.jsx
          node --check utils/c34/actorRequestEpochCandidate.mjs
          node --check scripts/integration/c34/test_t28_actor_epoch_candidate.mjs
          node --test scripts/integration/c34/test_t28_actor_epoch_candidate.mjs
          test ! -e pages/__c34_t28_persistent_probe.jsx
          echo 'PASS T28-P0 exact-source original risk locks and 7 model RED/GREEN cases; nonmap guard NOT mounted, no production authority'
