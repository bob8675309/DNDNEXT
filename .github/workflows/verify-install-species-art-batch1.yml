name: Install Species Art - Human

on:
  push:
    branches:
      - agent/species-art-batch1-install
    paths:
      - ".github/workflows/verify-install-species-art-batch1.yml"
      - ".art-transfer/human/ready.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-human:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard PR head
        shell: bash
        run: |
          set -euo pipefail
          BASE='4388295b6760d26c2fb34b27da794d5b83b61bb7'
          git fetch origin agent/realistic-dice-core
          test "$(git rev-parse origin/agent/realistic-dice-core)" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD

      - name: Reconstruct transfer prefix and extract Human WebP
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .art-transfer/human/part000.b64 \
            .art-transfer/human/part001.b64 \
            .art-transfer/human/part002.b64 \
            .art-transfer/human/part003.b64 \
            .art-transfer/human/part004.b64 \
            > /tmp/species-prefix.b64
          base64 --decode /tmp/species-prefix.b64 > /tmp/species-prefix.zip
          python - <<'PY'
          import struct
          from pathlib import Path
          src = Path('/tmp/species-prefix.zip').read_bytes()
          assert src[:4] == b'PK\x03\x04'
          method = struct.unpack_from('<H', src, 8)[0]
          comp_size = struct.unpack_from('<I', src, 18)[0]
          uncomp_size = struct.unpack_from('<I', src, 22)[0]
          name_len = struct.unpack_from('<H', src, 26)[0]
          extra_len = struct.unpack_from('<H', src, 28)[0]
          assert method == 0
          name = src[30:30+name_len].decode('utf-8')
          assert name == 'cinematic-human.webp'
          start = 30 + name_len + extra_len
          end = start + comp_size
          assert end <= len(src)
          data = src[start:end]
          assert len(data) == uncomp_size
          Path('public/media/species/cinematic-human.webp').write_bytes(data)
          PY
          test "$(git hash-object public/media/species/cinematic-human.webp)" = '4a6988cd7bd955362fbbffecb42e2dd315556523'
          test "$(head -c 4 public/media/species/cinematic-human.webp)" = 'RIFF'
          test "$(dd if=public/media/species/cinematic-human.webp bs=1 skip=8 count=4 status=none)" = 'WEBP'

      - name: Enforce diff boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE='4388295b6760d26c2fb34b27da794d5b83b61bb7'
          git diff --name-only "$BASE"...HEAD | sort > /tmp/pre.txt
          ! grep -Eiq '(^|/)(world.?map|town.?map|city.?map)(/|\.|$)' /tmp/pre.txt
          git diff --name-only | grep -Fx 'public/media/species/cinematic-human.webp'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Create clean Human-only commit and promote
        shell: bash
        run: |
          set -euo pipefail
          BASE='4388295b6760d26c2fb34b27da794d5b83b61bb7'
          TARGET='public/media/species/cinematic-human.webp'
          cp "$TARGET" /tmp/cinematic-human.webp
          git reset --hard "$BASE"
          cp /tmp/cinematic-human.webp "$TARGET"
          git add -- "$TARGET"
          test "$(git diff --cached --name-only)" = "$TARGET"
          test "$(git hash-object "$TARGET")" = '4a6988cd7bd955362fbbffecb42e2dd315556523'
          git config user.name 'DNDNext Automation'
          git config user.email 'automation@dndnext.local'
          git commit -m 'Add cinematic Human species artwork'
          git fetch origin agent/realistic-dice-core
          test "$(git rev-parse origin/agent/realistic-dice-core)" = "$BASE"
          git push --force-with-lease origin HEAD:agent/species-art-batch1-install
          git push origin HEAD:agent/realistic-dice-core
