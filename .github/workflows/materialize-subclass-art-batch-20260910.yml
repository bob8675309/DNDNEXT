          public/media/subclasses/rogue/rogue-soulknife.webp
          public/media/subclasses/rogue/rogue-swashbuckler.webp
          public/media/subclasses/rogue/rogue-thief.webp
          EOF
          sed -i 's/^          //' /tmp/expected-files
          sort -o /tmp/expected-files /tmp/expected-files
          git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Validate image dimensions and focused Class regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          families = {'artificer','barbarian','bard','cleric','druid','monk','monster-hunter','mystic','rogue'}
          for path in Path('public/media/subclasses').glob('*/*.webp'):
              if path.parts[-2] in families:
                  with Image.open(path) as im:
                      if im.size != (456, 240) or im.format != 'WEBP':
                          raise SystemExit(f'bad selector asset {path}: {im.size} {im.format}')
          with Image.open('public/media/classes/cinematic-warlock.webp') as im:
              if im.size != (1600, 900) or im.format != 'WEBP':
                  raise SystemExit(f'bad Warlock hero: {im.size} {im.format}')
          PY
          node scripts/validate_class_subclass_browser.mjs
          node scripts/validate_class_hero_framing.mjs

      - name: Recheck remote head and publish bounded binary commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/realistic-dice-core
          test "$(git rev-parse origin/agent/realistic-dice-core)" = "22bf0c306ef7ce0b6f7ac73e38d49375d2e4897a"
          git config user.name 'bob8675309'
          git config user.email '69051502+bob8675309@users.noreply.github.com'
          git add public/media/classes/cinematic-warlock.webp public/media/subclasses/artificer public/media/subclasses/barbarian public/media/subclasses/bard public/media/subclasses/cleric public/media/subclasses/druid public/media/subclasses/monk public/media/subclasses/monster-hunter public/media/subclasses/mystic public/media/subclasses/rogue
          git commit -m 'Install approved subclass artwork continuation batch'
          git push origin HEAD:agent/realistic-dice-core
