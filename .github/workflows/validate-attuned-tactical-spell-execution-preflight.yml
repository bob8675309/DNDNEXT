name: Validate Attuned Tactical Spell Execution Preflight
on:
  pull_request:
    paths:
      - "sql/20261026_02_attuned_spell_execution_preflight_shadow.sql"
      - "scripts/fixtures/attuned_tactical_spell_execution_preflight_shadow.sql"
      - "scripts/validate_attuned_tactical_spell_execution_preflight.mjs"
      - ".github/workflows/validate-attuned-tactical-spell-execution-preflight.yml"
  workflow_dispatch:
jobs:
  exact-source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate_player_sheet_actions.mjs
      - run: node scripts/validate_attuned_player_sheet_spells_shadow.mjs
      - run: node scripts/validate_attuned_tactical_spellcasting_shadow.mjs
      - run: node scripts/validate_attuned_tactical_spell_execution_preflight.mjs
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: spell_execution_preflight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d spell_execution_preflight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: spell_execution_preflight
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/attuned_tactical_spell_execution_preflight_shadow.sql
