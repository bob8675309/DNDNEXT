name: Materialize final Tarot 22 simple

on:
  push:
    branches:
      - agent/subclass-tarot-final22-materialize-20260916

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/subclass-tarot-approved-batch-20260916
          fetch-depth: 0

      - name: Verify exact target head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "34cbb57b2541771859e54c29e90687d56a855f2e"

      - name: Download verified archive
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error 'https://uca6f4f5e2231da6e0ed84e48ac6.dl.dropboxusercontent.com/cd/0/get/DIQk_USfsv-KfvbAAxcCK83vtRTmW914CIV0FOpcdlr7V7K5JOojb6AWaWYYtAFHP1fbyyR_71eDG2Z2I6JKxJ9xYR1airTgJsQXZQDmcsQl8UE5-cix-OMkhqbaYeX72iUutqGyTDRytdo6vKToANcKfXczFWLOqTJ-I0TdgyRRug/file?c_luid=c335000c' -o /tmp/final-tarot.zip
          echo '7b29c2730c3f18ce13b1eaee4b8f6a2d9b9bc2374166e02cab3787f7f0e35229  /tmp/final-tarot.zip' | sha256sum -c -
          rm -rf /tmp/final-tarot-stage
          mkdir -p /tmp/final-tarot-stage
          unzip -q /tmp/final-tarot.zip -d /tmp/final-tarot-stage
          test "$(jq '.files | length' /tmp/final-tarot-stage/manifest.json)" = "22"
          while IFS=$'\t' read -r path expected; do
            test -f "/tmp/final-tarot-stage/$path"
            actual="$(sha256sum "/tmp/final-tarot-stage/$path" | awk '{print $1}')"
            test "$actual" = "$expected"
          done < <(jq -r '.files[] | [.path,.sha256] | @tsv' /tmp/final-tarot-stage/manifest.json)

      - name: Materialize exact 22 artwork files
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            cp "/tmp/final-tarot-stage/$path" "$path"
          done < <(jq -r '.files[].path' /tmp/final-tarot-stage/manifest.json)
          jq -r '.files[].path' /tmp/final-tarot-stage/manifest.json | sort > /tmp/expected.txt
          git ls-files --others --modified --exclude-standard | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test "$(wc -l < /tmp/actual.txt)" -eq 22

      - name: Commit artwork to target branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/expected.txt
          git diff --cached --check
          git commit -m 'Install final approved subclass Tarot artwork'
          git push origin HEAD:agent/subclass-tarot-approved-batch-20260916
