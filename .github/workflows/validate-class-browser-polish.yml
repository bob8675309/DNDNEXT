name: Validate Class browser polish

on:
  push:
    branches:
      - agent/subclass-carousel-runic-modal-20260918

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/subclass-tarot-approved-batch-20260916
          fetch-depth: 0

      - name: Guard exact accepted head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "86a954acc16437a95a30415320682a530f818cdc"
          test -z "$(git status --porcelain)"

      - name: Download approved assets
        shell: bash
        env:
          BG_URL: "https://ucea85b48389ebfb08c23dbecdd5.dl.dropboxusercontent.com/cd/0/get/DIWyyvCljugmy4G8OTtzUWlwwFdkSaqyi7n8OrmFXX8CiSPVnIvlKQrmlzpIy8Kelvx3JuvRBT1MlCcigvprc-K_4VRuoqdIiLVaLoN410L-G87z8wNI1Q7HOuNvDgnZ7icX7B-DD4jBaAY0ig6pSgJfA-bFRExMsjPGx1s14txxgQ/file?c_luid=c335000c"
          TABLE_URL: "https://uc97df99b152934adb6c134a3dcd.dl.dropboxusercontent.com/cd/0/get/DIXJhs39cU10BxSXJSInmmrOBYidSQIHmpWsA06WW2mLngA1IAFywQ7zkMRItE4Mbcvq7eEMyCGYMob5CTzM2XAO6kyqdOFdu7VC_hVuCv6X5DxJuLVaSxVfWkv5IRLm6ui1lAmxe2hgCdeQAMTvW4TDmr0EtF0wlXCCg-5GUwqEvA/file?c_luid=c335000c"
          FRONT_URL: "https://ucd12bb0894cb11d018d39832ed6.dl.dropboxusercontent.com/cd/0/get/DIVOBWAdvNYBOlNU1pQ8sK328a9WIToZauIZPPFqTTSuZ6QB9WvWtbKm7MdlYadxoYu7S0kE1XcPm0qVasRTZ7qVw86TW8kPEjjHQOeLUPbYnzYuqEb8moxMmngzB_HCeKspVrtGah-G_kprMln1-8_TWbT2TGw54WFvdNgtBOliTg/file?c_luid=c335000c"
          BACK_URL: "https://uc94b67f66b62d79a638ea0dff96.dl.dropboxusercontent.com/cd/0/get/DIVtwSO-RqsEKRWvT0-1G78or5_VnsMKYym29rio_glXF2Bhe9GPJ3ribmjOYLiw2MPzYRGk4NR6AJLH6-AYeqFzNHNBLIOHEvSDEKKoAesESZB-6t-E7q5PlEruWBUEG3faoW0gBzxHFAxzqaW05Z7OGSvShkT_Cd2u_JTjMiHx1A/file?c_luid=c335000c"
        run: |
          set -euo pipefail
          mkdir -p /tmp/subclass-carousel
          curl -fsSL "$BG_URL" -o /tmp/subclass-carousel/bg.png
          curl -fsSL "$TABLE_URL" -o /tmp/subclass-carousel/table.png
          curl -fsSL "$FRONT_URL" -o /tmp/subclass-carousel/front.png
          curl -fsSL "$BACK_URL" -o /tmp/subclass-carousel/back.png
          echo "3e070ad601a6bbef20a2e1f94ac50bc580ab2b4c05d4aa1a5ccfa5adf225f943  /tmp/subclass-carousel/bg.png" | sha256sum -c -
          echo "5bdd4da1dea5c16b4e634ea6854e2a1b8eb0400789ef98c50a5f448b32031d2f  /tmp/subclass-carousel/table.png" | sha256sum -c -
          echo "d3c4d699f165910597e48e36c6a02fa9d9f8e16b670c2444436b61471e0392b2  /tmp/subclass-carousel/front.png" | sha256sum -c -
          echo "b14f4d9a31763c2af62b251208a59cd999a18ac96ae2acab8c709e4e82dbd97c  /tmp/subclass-carousel/back.png" | sha256sum -c -

      - name: Verify images
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow==11.3.0
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root = Path("/tmp/subclass-carousel")
          for name in ("bg.png", "table.png", "front.png", "back.png"):
              with Image.open(root / name) as im:
                  assert im.format == "PNG"
                  assert im.size == (1672, 941)
          assert "A" in Image.open(root / "table.png").mode
          assert "A" in Image.open(root / "front.png").mode
          assert "A" in Image.open(root / "back.png").mode
          PY

      - name: Install exact assets
        shell: bash
        run: |
          set -euo pipefail
          root="public/media/forge/subclass-carousel"
          mkdir -p "$root"
          cp /tmp/subclass-carousel/bg.png "$root/subclass-selector-cathedral-bg.png"
          cp /tmp/subclass-carousel/table.png "$root/subclass-selector-runic-table.png"
          cp /tmp/subclass-carousel/front.png "$root/subclass-selector-smoke-front.png"
          cp /tmp/subclass-carousel/back.png "$root/subclass-selector-smoke-back.png"
          git add "$root"
          printf '%s\n' \
            "public/media/forge/subclass-carousel/subclass-selector-cathedral-bg.png" \
            "public/media/forge/subclass-carousel/subclass-selector-runic-table.png" \
            "public/media/forge/subclass-carousel/subclass-selector-smoke-back.png" \
            "public/media/forge/subclass-carousel/subclass-selector-smoke-front.png" \
            | sort > /tmp/expected
          git diff --cached --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Commit and push approved assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add runic subclass carousel UI assets"
          git push origin HEAD:agent/subclass-tarot-approved-batch-20260916
