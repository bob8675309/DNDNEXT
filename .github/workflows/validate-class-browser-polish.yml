name: Validate Class browser polish

on:
  pull_request:
  push:
    branches:
      - agent/training-tab-redesign

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Class browser polish
        run: node scripts/validate_class_browser_polish.mjs
