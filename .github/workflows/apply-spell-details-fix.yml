name: Apply spell details and pinned description fix

on:
  push:
    branches:
      - agent/fix-spell-details-and-leso-autognome
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-spell-details-and-leso-autognome
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact source updates
        run: python3 scripts/apply_spell_details_fix.py

      - name: Validate focused contracts
        run: |
          npm run check:player-sheet-actions
          npm run check:npc-sheet-action-parity
          node scripts/validate_npc_sheet_selection_reconciliation.mjs

      - name: Run complete production gate
        run: npm run build:vercel

      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/characterSheetActions.js components/CharacterSheet5e.js components/CharacterSheetPanel.js components/CharacterSheetEnhancements.js scripts/validate_player_sheet_actions.mjs docs/Deferred_UI_Polish_Backlog.md
          git commit -m "Fix spell detail formatting and pinned descriptions"
          git push origin HEAD:agent/fix-spell-details-and-leso-autognome
