name: Phase 1T Server Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "sql/20260729_03_tactical_attack_roll_modifiers.sql"
      - "sql/20260729_04_tactical_guiding_bolt.sql"
      - "scripts/validate_tactical_*.mjs"
      - "package.json"
      - ".github/workflows/phase1t-server-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Tactical spell suite
        run: npm run check:tactical-spell-suite
      - name: Next build
        run: npx next build
