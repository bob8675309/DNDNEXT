name: Validate DNDNext supervised research agent (no API cost)
on:
  pull_request:
    paths:
      - '.github/workflows/dndnext-research-agent.yml'
      - '.github/workflows/validate-dndnext-research-agent.yml'
      - '.github/codex/prompts/dndnext-research-agent.md'
      - 'scripts/agents/**'
      - 'docs/DNDNext_Research_Agent_Setup.md'
      - 'docs/AGENT_TOUCHSTONE.md'
      - 'docs/README.md'
      - 'docs/START_HERE_ACTIVE_HANDOFF.md'
      - 'docs/DNDNext_Agent_Opportunities_Audit_2026-11-05.md'
      - 'vercel.json'
      - '.github/workflows/research-docs-maintenance.yml'
      - 'docs/Research_Docs_Maintenance_2026-11-06.md'
      - 'docs/Legacy_PHB_Optional_Content_Design_2026-11-06.md'
permissions:
  contents: read
jobs:
  policy:
    name: Scope, permissions, artifact, and Vercel protection audit
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check scripts/agents/research_agent.mjs
      - run: node --check scripts/agents/validate_research_agent.mjs
      - run: node scripts/agents/validate_research_agent.mjs
      - run: node --check scripts/agents/research_docs_maintainer.mjs
      - run: node scripts/agents/validate_research_docs_maintainer.mjs
      - name: Assert agent/research previews are opted out by configuration
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const c=JSON.parse(readFileSync('vercel.json','utf8')); for (const p of ['agent/**','research/**']) assert.equal(c.git?.deploymentEnabled?.[p], false, p); assert.equal(c.ignoreCommand, 'node scripts/vercel_ignore_build.mjs'); console.log('PASS agent/research Vercel git auto-deploy opt-out (config only)')"

  forge-trigger-census:
    name: Offline original Forge trigger coverage on held PR #324
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout review-only bot controller from this PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout held Forge research without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/forge-immutable-creation-replay-20261105
          path: target
          persist-credentials: false
      - name: Verify source revisions, then produce free trigger report
        shell: bash
        run: |
          set -euo pipefail
          echo "Agent controller SHA: $(git rev-parse HEAD)"
          echo "Held Forge PR #324 SHA: $(git -C target rev-parse HEAD)"
          node --check scripts/agents/forge_trigger_audit.mjs
          node scripts/agents/forge_trigger_audit.mjs target
          node target/scripts/agents/forge_trigger_acceptance_ledger.mjs target research-agent-artifact
      - name: Upload read-only coverage report (no API/model invocation)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-original-trigger-coverage-${{ github.run_id }}
          path: |
            research-agent-artifact/FORGE_TRIGGER_COVERAGE.md
            research-agent-artifact/FORGE_TRIGGER_COVERAGE.json
          if-no-files-found: warn
          retention-days: 7
