name: Patch Class mockup proportions 2026-09-06

on:
  push:
    branches:
      - agent/class-mockup-proportions-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/class-mockup-proportions-20260906
          fetch-depth: 2

      - name: Guard exact starting head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "76c32ebfc69afd5af83f159271d28a078a5bef41"

      - name: Restore readable progression proportions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/NpcForgeClassGuide.js')
          source = path.read_text()
          replacements = [
            (
              'gap:.36rem!important;min-height:39px!important;padding:.28rem .45rem!important',
              'gap:.34rem!important;min-height:42px!important;padding:.31rem .46rem!important'
            ),
            (
              '.npc-forge-class-guide__table-card .class-level-guide__row>div{padding:3px 4px!important;font-size:.58rem!important;line-height:1.28!important}',
              '.npc-forge-class-guide__table-card .class-level-guide__row>div{padding:3px 4px!important;font-size:.61rem!important;line-height:1.3!important}'
            ),
            (
              '.npc-forge-class-guide__table-card .class-level-guide__row.is-head{min-height:32px!important}',
              '.npc-forge-class-guide__table-card .class-level-guide__row.is-head{min-height:34px!important}'
            ),
            (
              '.class-level-guide__features button{appearance:none!important;padding:.18rem .4rem!important',
              '.class-level-guide__features button{appearance:none!important;padding:.2rem .42rem!important'
            ),
            (
              'font-size:.58rem!important;font-weight:650!important;line-height:1.2!important',
              'font-size:.6rem!important;font-weight:650!important;line-height:1.2!important'
            ),
            (
              '.class-level-guide__slot-head{color:rgba(255,255,255,.56)!important;font-size:.48rem!important}',
              '.class-level-guide__slot-head{color:rgba(255,255,255,.56)!important;font-size:.5rem!important}'
            ),
            (
              '.class-level-guide__slot-cell{color:rgba(255,255,255,.76)!important;font-size:.54rem!important}',
              '.class-level-guide__slot-cell{color:rgba(255,255,255,.76)!important;font-size:.57rem!important}'
            ),
          ]

          for old, new in replacements:
            count = source.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, got {count}: {old[:110]}')
            source = source.replace(old, new, 1)

          path.write_text(source)
          PY

          git diff --check
          grep -q 'min-height:42px!important' components/NpcForgeClassGuide.js
          grep -q 'font-size:.61rem!important' components/NpcForgeClassGuide.js
          grep -q 'padding:.2rem .42rem!important' components/NpcForgeClassGuide.js
          test "$(git diff --name-only)" = "components/NpcForgeClassGuide.js"

      - name: Commit progression proportion patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/NpcForgeClassGuide.js
          git diff --cached --check
          git commit -m "Balance Class progression readability"
          git push origin HEAD:agent/class-mockup-proportions-20260906
