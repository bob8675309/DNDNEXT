name: Vercel maintenance cleanup smoke

on:
  push:
    branches:
      - agent/vercel-storage-guard-20260914
    paths:
      - ".github/workflows/vercel-maintenance-smoke.yml"

permissions:
  contents: read

jobs:
  cleanup:
    name: Execute approved Vercel cleanup
    uses: ./.github/workflows/vercel-deployment-maintenance.yml
    with:
      mode: delete-error-canceled
      confirmation: "DELETE"
    secrets: inherit
