name: Vercel maintenance audit 2026-09-15

on:
  push:
    branches:
      - agent/vercel-maintenance-audit-20260915

permissions:
  contents: read

jobs:
  cleanup:
    uses: ./.github/workflows/vercel-deployment-maintenance.yml
    with:
      action: delete
      scope: stale-agent-ready
      stale_days: "7"
      branch_prefix: "agent/"
      confirmation: "DELETE STALE PREVIEWS"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
