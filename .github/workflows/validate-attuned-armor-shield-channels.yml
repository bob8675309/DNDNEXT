name: Validate Attuned Armor and Shield Source Channels
on:
  pull_request:
    paths:
      - "sql/20261025_08_attuned_armor_shield_source_audit.sql"
      - "scripts/fixtures/attuned_armor_shield_channel_audit.sql"
      - "scripts/validate_attuned_armor_shield_channels.mjs"
      - ".github/workflows/validate-attuned-armor-shield-channels.yml"
  workflow_dispatch:
jobs:
  legacy-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate_shared_equipment_effects_pipeline.mjs
      - run: node scripts/validate_attuned_ac_saves_shadow.mjs
      - run: node scripts/validate_attuned_ability_shadow.mjs
      - run: node scripts/validate_attuned_armor_shield_channels.mjs
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: armor_channel_audit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d armor_channel_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: armor_channel_audit
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/attuned_armor_shield_channel_audit.sql
