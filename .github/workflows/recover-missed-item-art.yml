foundation-batch-09":{"sha256":"cb227e32e77b765c10c6d9184b61291e7f63eb4a22f907776580e8a6fc6f352f","count":10}}}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, struct, urllib.request, zipfile
          from pathlib import Path

          cfg=json.loads(os.environ["RECOVERY_MANIFEST"])
          root=Path("public/item-art/masters")
          expected_paths=[]
          for batch in ("foundation-batch-07","foundation-batch-08","foundation-batch-09"):
              url=cfg["urls"][batch]
              req=urllib.request.Request(url,headers={"User-Agent":"DNDNext-Item-Art-Recovery/1.0"})
              with urllib.request.urlopen(req,timeout=180) as resp:
                  data=resp.read()
              got_zip=hashlib.sha256(data).hexdigest()
              if got_zip != cfg["zipMeta"][batch]["sha256"]:
                  raise SystemExit(f"{batch}: ZIP sha256 mismatch {got_zip}")
              zpath=Path(f"/tmp/{batch}.zip")
              zpath.write_bytes(data)
              target=root/batch
              target.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(zpath) as z:
                  names=sorted(n for n in z.namelist() if not n.endswith("/"))
                  expected=sorted(cfg["fileHashes"][batch])
                  if names != expected:
                      raise SystemExit(f"{batch}: filename manifest mismatch")
                  if len(names) != cfg["zipMeta"][batch]["count"]:
                      raise SystemExit(f"{batch}: expected {cfg['zipMeta'][batch]['count']} files, got {len(names)}")
                  for name in names:
                      blob=z.read(name)
                      got=hashlib.sha256(blob).hexdigest()
                      if got != cfg["fileHashes"][batch][name]:
                          raise SystemExit(f"{batch}/{name}: sha256 mismatch")
                      if blob[:8] != b"\x89PNG\r\n\x1a\n" or blob[12:16] != b"IHDR":
                          raise SystemExit(f"{batch}/{name}: invalid PNG")
                      width,height=struct.unpack(">II",blob[16:24])
                      if (width,height) != (1024,1024):
                          raise SystemExit(f"{batch}/{name}: expected 1024x1024, got {width}x{height}")
                      out=target/name
                      out.write_bytes(blob)
                      expected_paths.append(str(out))
                      print("OK",out)
          if len(expected_paths) != 60:
              raise SystemExit(f"expected 60 output files, got {len(expected_paths)}")
          PY
      - name: Guard exact diff and commit recovery
        run: |
          set -euo pipefail
          git add -f public/item-art/masters/foundation-batch-07 public/item-art/masters/foundation-batch-08 public/item-art/masters/foundation-batch-09
          test "$(git diff --cached --name-only | wc -l)" -eq 60
          test "$(git diff --cached --name-only | grep -vc '^public/item-art/masters/foundation-batch-0[789]/.*\.png$' || true)" -eq 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "Recover missed ItemCard art masters"
