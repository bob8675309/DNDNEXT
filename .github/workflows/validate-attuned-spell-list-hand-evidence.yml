name: Validate Attuned Spell List and Hand Evidence
on:
  pull_request:
    paths:
      - "sql/20261026_04_attuned_spell_list_hand_evidence.sql"
      - "scripts/fixtures/attuned_spell_list_hand_evidence.sql"
      - "scripts/validate_attuned_spell_list_hand_evidence.mjs"
      - ".github/workflows/validate-attuned-spell-list-hand-evidence.yml"
      - "docs/**"
  workflow_dispatch:
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate_attuned_focus_provenance_shadow.mjs
      - run: node scripts/validate_attuned_spell_list_hand_evidence.mjs
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: attuned_spell_list_hand
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d attuned_spell_list_hand"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: attuned_spell_list_hand
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/attuned_spell_list_hand_evidence.sql
