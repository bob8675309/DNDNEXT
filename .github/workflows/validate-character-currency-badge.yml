name: Validate character currency presentation

on:
  push:
    paths:
      - "components/CharacterCurrencyBadge.js"
      - "components/CharacterCircleLandPanel.js"
      - "scripts/validate_character_currency_badge.mjs"
      - ".github/workflows/validate-character-currency-badge.yml"
  pull_request:
    paths:
      - "components/CharacterCurrencyBadge.js"
      - "components/CharacterCircleLandPanel.js"
      - "scripts/validate_character_currency_badge.mjs"
      - ".github/workflows/validate-character-currency-badge.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate character currency presentation
        run: |
          node scripts/validate_character_currency_badge.mjs
          node scripts/validate_unified_character_forge.mjs
      - name: Run production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder
        run: npm run build:vercel
