name: Materialize approved class menu and civilian artwork 2026-09-10

on:
  push:
    branches:
      - agent/class-menu-civilian-warlock-transfer-20260910

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: agent/realistic-dice-core
          fetch-depth: 0

      - name: Guard exact target head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b418702326a612365205727f8363352513f72280"

      - name: Download and verify payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://uc841e73fbf68579d6a705b256e7.dl.dropboxusercontent.com/cd/0/get/DH5ONYscujZbiOQPYc2c94983RfojP9fKXW83ZYQgdjtwYFxf87j-YdBFsL_ZNegtBMlEBkEp7Hg-saySA5kYKToRT98pyxb9R_fwEgxnAeZhqBrqNcMnHXEhYhZqmWiRUbYEFL4scC9TBHeGp59VspAaYHe7XeBAhifWcY3X4cAzw/file?c_luid=c335000c' -o /tmp/class-menu.zip
          echo 'fa07bd055fed6b9263920f44a8271e50d01262dbc1b3567dae0c8c84cec0ee06  /tmp/class-menu.zip' | sha256sum -c -
          rm -rf /tmp/class-menu
          mkdir -p /tmp/class-menu
          unzip -q /tmp/class-menu.zip -d /tmp/class-menu
          cd /tmp/class-menu
          sha256sum -c SHA256SUMS
          test "$(python3 -c "import json; print(json.load(open('MANIFEST.json'))['count'])")" = "19"

      - name: Apply bounded artwork payload
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/class-menu/public/. public/

      - name: Guard exact changed-file scope including untracked binaries
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'public/media/classes/cinematic-civilian.webp' \
            'public/media/classes/cinematic-warlock.webp' \
            'public/media/classes/menu-artificer.webp' \
            'public/media/classes/menu-barbarian.webp' \
            'public/media/classes/menu-bard.webp' \
            'public/media/classes/menu-civilian.webp' \
            'public/media/classes/menu-cleric.webp' \
            'public/media/classes/menu-druid.webp' \
            'public/media/classes/menu-fighter.webp' \
            'public/media/classes/menu-monk.webp' \
            'public/media/classes/menu-monster-hunter.webp' \
            'public/media/classes/menu-mystic.webp' \
            'public/media/classes/menu-paladin.webp' \
            'public/media/classes/menu-ranger.webp' \
            'public/media/classes/menu-rogue.webp' \
            'public/media/classes/menu-sidekick.webp' \
            'public/media/classes/menu-sorcerer.webp' \
            'public/media/classes/menu-warlock.webp' \
            'public/media/classes/menu-wizard.webp' | sort > /tmp/expected-files
          git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Validate image dimensions and focused Class regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 -c "from pathlib import Path; from PIL import Image; root=Path('public/media/classes'); files=list(root.glob('menu-*.webp')); assert all((Image.open(p).size==(600,800) and Image.open(p).format=='WEBP') for p in files); assert all((Image.open(root/n).size==(1600,900) and Image.open(root/n).format=='WEBP') for n in ('cinematic-warlock.webp','cinematic-civilian.webp'))"
          node scripts/validate_class_subclass_browser.mjs
          node scripts/validate_class_hero_framing.mjs

      - name: Recheck remote head and publish bounded binary commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/realistic-dice-core
          test "$(git rev-parse origin/agent/realistic-dice-core)" = "b418702326a612365205727f8363352513f72280"
          git config user.name 'bob8675309'
          git config user.email '69051502+bob8675309@users.noreply.github.com'
          git add public/media/classes/cinematic-civilian.webp public/media/classes/cinematic-warlock.webp public/media/classes/menu-artificer.webp public/media/classes/menu-barbarian.webp public/media/classes/menu-bard.webp public/media/classes/menu-civilian.webp public/media/classes/menu-cleric.webp public/media/classes/menu-druid.webp public/media/classes/menu-fighter.webp public/media/classes/menu-monk.webp public/media/classes/menu-monster-hunter.webp public/media/classes/menu-mystic.webp public/media/classes/menu-paladin.webp public/media/classes/menu-ranger.webp public/media/classes/menu-rogue.webp public/media/classes/menu-sidekick.webp public/media/classes/menu-sorcerer.webp public/media/classes/menu-warlock.webp public/media/classes/menu-wizard.webp
          git commit -m 'Install approved Class menu and civilian artwork'
          git push origin HEAD:agent/realistic-dice-core
