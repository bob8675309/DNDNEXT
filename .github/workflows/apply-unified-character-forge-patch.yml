name: Apply unified character forge source patch

on:
  push:
    branches:
      - fix/unified-character-forge-player-testing
    paths:
      - scripts/apply_unified_character_forge_patch.mjs
      - .github/workflows/apply-unified-character-forge-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-character-forge-player-testing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply source patch
        run: node scripts/apply_unified_character_forge_patch.mjs
      - name: Remove one-time patch machinery
        run: rm scripts/apply_unified_character_forge_patch.mjs .github/workflows/apply-unified-character-forge-patch.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify NPC and player character Forge modes"
          git push origin HEAD:fix/unified-character-forge-player-testing
