name: Validate Circle of the Land runtime

on:
  push:
    paths:
      - "sql/20260808_58_circle_land_runtime.sql"
      - "sql/20260808_59_circle_land_source_matrix_correction.sql"
      - "components/CharacterCircleLandPanel.js"
      - "components/CharacterFiendishResiliencePanel.js"
      - "scripts/validate_circle_land_runtime.mjs"
      - ".github/workflows/validate-circle-land-runtime.yml"
  pull_request:
    paths:
      - "sql/20260808_58_circle_land_runtime.sql"
      - "sql/20260808_59_circle_land_source_matrix_correction.sql"
      - "components/CharacterCircleLandPanel.js"
      - "components/CharacterFiendishResiliencePanel.js"
      - "scripts/validate_circle_land_runtime.mjs"
      - ".github/workflows/validate-circle-land-runtime.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Circle of the Land runtime authority
        run: |
          node scripts/validate_circle_land_runtime.mjs
          node scripts/validate_unified_character_forge.mjs
      - name: Run production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder
        run: npm run build:vercel
