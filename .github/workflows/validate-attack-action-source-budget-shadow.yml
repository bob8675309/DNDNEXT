name: Validate Source-Derived Attack Action Sequence Shadow
on:
  pull_request:
    paths:
      - "sql/20261027_01_attack_action_source_budget_shadow.sql"
      - "scripts/fixtures/attack_action_source_budget_shadow.sql"
      - "scripts/validate_attack_action_source_budget_shadow.mjs"
      - ".github/workflows/validate-attack-action-source-budget-shadow.yml"
      - "docs/**"
  workflow_dispatch:
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate_attack_action_sequence_audit_shadow.mjs
      - run: node scripts/validate_attack_action_source_budget_shadow.mjs
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: attack_action_source_shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d attack_action_source_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: attack_action_source_shadow
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/attack_action_source_budget_shadow.sql
