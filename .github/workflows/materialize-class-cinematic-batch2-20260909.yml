name: Materialize Class cinematic batch 2 20260909

on:
  push:
    branches:
      - agent/class-cinematic-batch2-transfer-20260909
    paths:
      - .github/workflows/materialize-class-cinematic-batch2-20260909.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/realistic-dice-core
      EXPECTED_TARGET_HEAD: ed902f31cbea2b82435e9cc6db33743a0b4897e4
      PATCH_ZIP_SHA256: a557dfe250a6ab813f846c92a2aab92edb72ece50e3a366fab54255df4b984d1
      PATCH_URL: https://uc431137f0d22c53fb593132bfb7.dl.dropboxusercontent.com/cd/0/get/DHz0P_9GSUQltHSpG_IL8UuG9YxYLcD3OlHXVPeSTk7JQ6SFXNnhJKH2KgYp6Gr6uguHNibAknGE5sUwakGj7S2TvYe36U68OrX9C8L2JYDJwRFy38xyQ5p1PAQi83IZidljjjvw8vv-ySlMcxG0CctrQBt1DeuYVmBMZBlGs1XJqA/file?c_luid=c335000c
    steps:
      - name: Check out exact working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          clean: true

      - name: Guard exact target head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"

      - name: Download one-time transfer payload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$PATCH_URL" -o /tmp/dndnext-class-cinematic-batch2-20260909.zip
          echo "$PATCH_ZIP_SHA256  /tmp/dndnext-class-cinematic-batch2-20260909.zip" | sha256sum -c -
          unzip -t /tmp/dndnext-class-cinematic-batch2-20260909.zip

      - name: Verify transfer payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/class-cinematic-batch2
          mkdir -p /tmp/class-cinematic-batch2
          unzip -o /tmp/dndnext-class-cinematic-batch2-20260909.zip -d /tmp/class-cinematic-batch2
          cd /tmp/class-cinematic-batch2
          sha256sum -c SHA256SUMS.txt
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          names = [
              'cinematic-paladin.webp',
              'cinematic-sorcerer.webp',
              'cinematic-warlock.webp',
              'cinematic-ranger.webp',
              'cinematic-mystic.webp',
              'cinematic-monster-hunter.webp',
              'cinematic-sidekick.webp',
          ]
          for name in names:
              path = Path(name)
              assert path.exists(), path
              with Image.open(path) as image:
                  assert image.format == 'WEBP', (name, image.format)
                  assert image.size == (1600, 900), (name, image.size)
          PY
          for f in cinematic-*.webp; do
            test "$(file -b --mime-type "$f")" = "image/webp"
          done

      - name: Apply bounded artwork patch
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 /tmp/class-cinematic-batch2/cinematic-paladin.webp public/media/classes/cinematic-paladin.webp
          install -m 0644 /tmp/class-cinematic-batch2/cinematic-sorcerer.webp public/media/classes/cinematic-sorcerer.webp
          install -m 0644 /tmp/class-cinematic-batch2/cinematic-warlock.webp public/media/classes/cinematic-warlock.webp
          install -m 0644 /tmp/class-cinematic-batch2/cinematic-ranger.webp public/media/classes/cinematic-ranger.webp
          install -m 0644 /tmp/class-cinematic-batch2/cinematic-mystic.webp public/media/classes/cinematic-mystic.webp
          install -m 0644 /tmp/class-cinematic-batch2/cinematic-monster-hunter.webp public/media/classes/cinematic-monster-hunter.webp
          install -m 0644 /tmp/class-cinematic-batch2/cinematic-sidekick.webp public/media/classes/cinematic-sidekick.webp

          cat > /tmp/expected.txt <<'EOF'
          public/media/classes/cinematic-ranger.webp
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          git diff --name-only | sort > /tmp/actual.txt
          sort /tmp/expected.txt -o /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --check

      - name: Run focused Class regressions
        run: |
          node scripts/validate_class_browser_polish.mjs
          node scripts/validate_class_hero_framing.mjs
          node scripts/validate_class_subclass_browser.mjs
          node scripts/validate_class_final_browser_fix.mjs
          node scripts/validate_species_class_review_fix.mjs
          node scripts/validate_player_forge_source_magic_routing.mjs

      - name: Commit and push exact validated artwork batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --pathspec-from-file=/tmp/expected.txt
          git commit -m "Install approved Elf Ranger cinematic artwork"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_TARGET_HEAD"
          git push origin "HEAD:$TARGET_BRANCH"
