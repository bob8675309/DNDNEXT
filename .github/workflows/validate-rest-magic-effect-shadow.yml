name: Validate Rest Magic Effect Eligibility Shadow
on:
  pull_request:
    paths:
      - "sql/20261025_03_rest_magic_effect_eligibility_shadow.sql"
      - "scripts/fixtures/rest_magic_effect_eligibility_shadow.sql"
      - ".github/workflows/validate-rest-magic-effect-shadow.yml"
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: rest_effect_shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d rest_effect_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: rest_effect_shadow
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/rest_magic_effect_eligibility_shadow.sql
