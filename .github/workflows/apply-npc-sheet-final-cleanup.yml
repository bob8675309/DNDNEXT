name: Apply NPC sheet final cleanup

on:
  push:
    branches:
      - agent/npc-sheet-action-parity
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/npc-sheet-action-parity
          fetch-depth: 0

      - name: Apply final fail-closed cleanup
        run: python3 scripts/apply_npc_sheet_final_cleanup.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate NPC sheet action parity
        run: npm run check:npc-sheet-action-parity

      - name: Validate player sheet actions
        run: npm run check:player-sheet-actions

      - name: Validate NPC sheet selection reconciliation
        run: node scripts/validate_npc_sheet_selection_reconciliation.mjs

      - name: Run complete production build gate
        run: npm run build:vercel

      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components utils scripts
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "Polish NPC sheet action details"
          git push origin HEAD:agent/npc-sheet-action-parity
