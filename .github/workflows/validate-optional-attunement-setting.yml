name: Validate Optional Attunement Setting
on:
  pull_request:
    paths:
      - "sql/20261025_01_optional_campaign_attunement_setting.sql"
      - "pages/admin.js"
      - "components/AdminAttunementSetting.js"
      - "scripts/fixtures/optional_attunement_setting_behavior.sql"
      - "scripts/validate_optional_attunement_setting.mjs"
      - ".github/workflows/validate-optional-attunement-setting.yml"
      - "docs/Optional_Attunement_Admin_Setting_2026-10-25.md"
  workflow_dispatch:
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate_optional_attunement_setting.mjs
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: optional_attunement_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d optional_attunement_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: optional_attunement_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/optional_attunement_setting_behavior.sql
