name: Validate Authenticated Attack Caller Preflight
on:
  pull_request:
    paths:
      - "sql/20261027_04_authenticated_attack_caller_preflight_shadow.sql"
      - "scripts/fixtures/canonical_controller_acl_pg16.sql"
      - "scripts/fixtures/authenticated_attack_caller_preflight_shadow.sql"
      - "scripts/validate_authenticated_attack_caller_preflight.mjs"
      - ".github/workflows/validate-authenticated-attack-caller-preflight.yml"
      - "docs/**"
  workflow_dispatch:
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate_canonical_roll_damage_parity.mjs
      - run: node scripts/validate_authenticated_attack_caller_preflight.mjs
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: attack_auth_boundary
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d attack_auth_boundary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: attack_auth_boundary
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/authenticated_attack_caller_preflight_shadow.sql
