name: Validate Simic Animal Enhancement

on:
  pull_request:
    branches:
      - main
    paths:
      - "utils/playerForgeSpeciesChoices.js"
      - "scripts/validate_simic_animal_enhancement_descriptions.mjs"
      - ".github/workflows/validate-simic-animal-enhancement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Simic Animal Enhancement descriptions
        run: node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_simic_animal_enhancement_descriptions.mjs
