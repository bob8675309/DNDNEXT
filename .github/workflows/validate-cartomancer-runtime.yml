name: Validate Cartomancer runtime

on:
  push:
    branches:
      - agent/character-forge-resilience-presentation
    paths:
      - "utils/featSourceChoiceNormalization.js"
      - "components/CharacterCartomancerPanel.js"
      - "components/CharacterCurrencyBadge.js"
      - "scripts/validate_cartomancer_runtime.mjs"
      - "sql/20260809_72_cartomancer_runtime.sql"
      - "sql/20260809_73_cartomancer_runtime_state_fix.sql"
      - ".github/workflows/validate-cartomancer-runtime.yml"
  pull_request:
    paths:
      - "utils/featSourceChoiceNormalization.js"
      - "components/CharacterCartomancerPanel.js"
      - "components/CharacterCurrencyBadge.js"
      - "scripts/validate_cartomancer_runtime.mjs"
      - "sql/20260809_72_cartomancer_runtime.sql"
      - "sql/20260809_73_cartomancer_runtime_state_fix.sql"
      - ".github/workflows/validate-cartomancer-runtime.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Cartomancer authority
        run: |
          node scripts/validate_cartomancer_runtime.mjs
          node scripts/validate_unified_character_forge.mjs
          node scripts/validate_character_progression_v3.mjs
      - name: Run production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder
        run: npm run build:vercel
