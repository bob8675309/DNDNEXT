name: Materialize approved Species artwork

on:
  push:
    branches:
      - agent/character-forge-resilience-presentation
    paths:
      - ".github/workflows/materialize-gem-dragonborn-art.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: agent/realistic-dice-core
          fetch-depth: 0

      - name: Guard expected baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "aef1d29e714bcf5116638ece28c07d7569edf90a"

      - name: Download approved artwork bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://ucb2cc6fee8a02f0003cdb9c8957.dl.dropboxusercontent.com/cd/0/get/DHnv0pk7ADsxouxN9kqJTrK8ZkytpSARTAl8zBfIOIi5Ua3CbIYcUjmfHnv8xCisURTXgxhwZI_MBrYebbeCvERIvse9MqSfSzd5koUJaR6JJ2I4mPpdRDA2p7eLRykFRSSyoVOqiWN_mEg2k3sn1jvMuh2rufMKN4ym5D4rUaH7sg/file?c_luid=c335000c' \
            --output /tmp/species.zip
          echo '4e5dd03eb2f6711ed7ef5b2e05c03c1ed6c7628e629423219fdb59aa23b28045  /tmp/species.zip' | sha256sum -c -
          rm -rf /tmp/species-art
          mkdir -p /tmp/species-art
          unzip -q /tmp/species.zip -d /tmp/species-art

      - name: Verify exact approved WebPs
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/species-art
          cat > /tmp/species.sha256 <<'EOF'
          c96cbc2dd0fd4cae99371986c305456e50975addf0ddf8e20a6498203529288e  cinematic-aetherborn.webp
          2a29398a566938efedaac7962719564e7d997b83966fdffa5e5890b23f10660e  cinematic-autognome.webp
          5ffef66548d68056b08460271d9e87830f2ef1ab2537e4f8c804a4eb160c052a  cinematic-dragonborn.webp
          1f4c5aa378e18dcd1ba19d0b155d7c0884a07fac3c4b8158b1324444dfa7ee25  cinematic-dwarf.webp
          c42517f55b8ca3fde1b0665faa04f7305092c45a9dc7617299218a82a65038be  cinematic-elf.webp
          030c96550257414e8c11c89c48bbadf8e6572be2d196aae789f02e2466731475  cinematic-gnome.webp
          52f6f48650a7ba0728e860cd8d8b5ee0724f12451d9d241f0dbde3f775d25c81  cinematic-goliath.webp
          d63a16468ce3d2915d6d2f1addddbcfadeebc44292b63a9ccd433c9cd6c1ab6b  cinematic-half-orc.webp
          7e75eb550a1f41944ae4e899c503b43259830a28aa555394f34b6c4b2cbe86f7  cinematic-halfling.webp
          bed149f6fdb6bf04820c687bb9796c75fef1b1a72f3fdd7c755cefed4bd71bb7  cinematic-human.webp
          EOF
          sha256sum -c /tmp/species.sha256
          for f in cinematic-*.webp; do
            test "$(file -b --mime-type "$f")" = "image/webp"
          done

      - name: Materialize artwork and approved mapping
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/species-art/cinematic-*.webp public/media/species/
          git show 51bd3195a3e5538097fae64042fba1f7cba72439:utils/speciesArtwork.js > utils/speciesArtwork.js

      - name: Validate exact diff boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          public/media/species/cinematic-aetherborn.webp
          public/media/species/cinematic-autognome.webp
          public/media/species/cinematic-dragonborn.webp
          public/media/species/cinematic-dwarf.webp
          public/media/species/cinematic-elf.webp
          public/media/species/cinematic-gnome.webp
          public/media/species/cinematic-goliath.webp
          public/media/species/cinematic-half-orc.webp
          public/media/species/cinematic-halfling.webp
          public/media/species/cinematic-human.webp
          utils/speciesArtwork.js
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit and push to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/species/cinematic-aetherborn.webp \
                  public/media/species/cinematic-autognome.webp \
                  public/media/species/cinematic-dragonborn.webp \
                  public/media/species/cinematic-dwarf.webp \
                  public/media/species/cinematic-elf.webp \
                  public/media/species/cinematic-gnome.webp \
                  public/media/species/cinematic-goliath.webp \
                  public/media/species/cinematic-half-orc.webp \
                  public/media/species/cinematic-halfling.webp \
                  public/media/species/cinematic-human.webp \
                  utils/speciesArtwork.js
          git commit -m "Add next approved cinematic species portraits"
          git push origin HEAD:agent/realistic-dice-core
