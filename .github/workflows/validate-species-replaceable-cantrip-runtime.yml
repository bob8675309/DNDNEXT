name: Validate Species replaceable cantrip runtime

on:
  push:
    branches:
      - agent/character-forge-resilience-presentation
    paths:
      - "sql/20260809_67_species_replaceable_cantrip_runtime.sql"
      - "components/CharacterSpeciesReplaceableCantripPanel.js"
      - "components/CharacterSpeciesRestProficiencyPanel.js"
      - "utils/playerForgeSpeciesChoices.js"
      - "scripts/validate_species_replaceable_cantrip_runtime.mjs"
      - ".github/workflows/validate-species-replaceable-cantrip-runtime.yml"
  pull_request:
    paths:
      - "sql/20260809_67_species_replaceable_cantrip_runtime.sql"
      - "components/CharacterSpeciesReplaceableCantripPanel.js"
      - "components/CharacterSpeciesRestProficiencyPanel.js"
      - "utils/playerForgeSpeciesChoices.js"
      - "scripts/validate_species_replaceable_cantrip_runtime.mjs"
      - ".github/workflows/validate-species-replaceable-cantrip-runtime.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Species replaceable cantrip authority
        run: |
          node scripts/validate_species_replaceable_cantrip_runtime.mjs
          node scripts/validate_species_rest_proficiency_runtime.mjs
          node scripts/validate_unified_character_forge.mjs
      - name: Run production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder
        run: npm run build:vercel
