name: I2J historical level-up v2 source preflight (pure Node, no DB)
on:
  push:
    branches:
      - research/i2j-levelup-v2-source-preflight-20261123
    paths:
      - 'scripts/audits/test_i2j_levelup_v2_source_preflight.mjs'
      - 'docs/research/I2J_LEVELUP_V2_MIRROR_SOURCE_PREFLIGHT_2026-11-23.md'
      - '.github/workflows/validate-i2j-levelup-v2-source-preflight.yml'
      - 'scripts/audits/i2j_offline_v2_pg17_evidence_gate.mjs'
      - 'scripts/audits/test_i2j_offline_v2_pg17_evidence_gate.mjs'
      - 'docs/research/I2J_P1_OFFLINE_V2_EVIDENCE_GATE_2026-11-23.md'
      - 'docs/research/I2J_P2_WEAPON_MASTERY_ORIGINAL_WRITER_SOURCE_2026-11-23.md'
      - 'scripts/audits/test_i2j_p2_weapon_mastery_original_writer_source.mjs'
      - 'scripts/audits/test_i2j_p3_invocation_recovery_source.mjs'
      - 'docs/research/I2J_P3_INVOCATION_RECOVERY_ORIGINAL_WRITER_2026-11-23.md'
      - 'scripts/audits/i2j_p4_offline_original_functions_export.mjs'
      - 'scripts/audits/test_i2j_p4_offline_original_functions_export.mjs'
      - 'docs/research/I2J_P4_OFFLINE_ORIGINAL_SOURCE_EXPORT_2026-11-23.md'
      - 'scripts/audits/i2j_p5_inert_offline_bundle_review.mjs'
      - 'scripts/audits/test_i2j_p5_inert_offline_bundle_review.mjs'
      - 'docs/research/I2J_P5_FILE_ONLY_BUNDLE_REVIEW_2026-11-23.md'
      - 'scripts/audits/i2j_original_function_pins.mjs'
      - 'docs/research/I2J_P6_REVIEWER_IMPORT_AND_NOFOLLOW_SECURITY_2026-11-23.md'
      - 'scripts/audits/i2j_p7_file_only_original_source_intake.mjs'
      - 'scripts/audits/test_i2j_p7_file_only_original_source_intake.mjs'
      - 'docs/research/I2J_P7_RETIRE_P4_DB_CLI_FILE_ONLY_INTAKE_2026-11-23.md'
      - 'docs/research/I2J_PR361_364_RETIREMENT_CROSSWALK_2026-11-23.json'
      - 'docs/research/I2J_PR361_364_RETIREMENT_READINESS_2026-11-23.md'
      - 'scripts/audits/test_i2j_pr361_364_retirement_custody.mjs'
      - 'docs/research/I2J_PR355_360_ORIGINAL_CUSTODY_2026-11-23.json'
      - 'docs/research/I2J_PR355_360_RETIREMENT_READINESS_2026-11-23.md'
      - 'scripts/audits/test_i2j_pr355_360_original_custody.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-v2-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated historical research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node source syntax check
        run: node --check scripts/audits/test_i2j_levelup_v2_source_preflight.mjs
      - name: Pin original source and negative assertions (no SQL)
        run: node --test scripts/audits/test_i2j_levelup_v2_source_preflight.mjs
      - name: Check inert offline evidence gate syntax
        run: node --check scripts/audits/i2j_offline_v2_pg17_evidence_gate.mjs && node --check scripts/audits/test_i2j_offline_v2_pg17_evidence_gate.mjs
      - name: Offline restore candidate safety negative tests (no SQL)
        run: node --test scripts/audits/test_i2j_offline_v2_pg17_evidence_gate.mjs
      - name: Check original Weapon Mastery writer historical source (no SQL)
        run: node --check scripts/audits/test_i2j_p2_weapon_mastery_original_writer_source.mjs && node --test scripts/audits/test_i2j_p2_weapon_mastery_original_writer_source.mjs
      - name: Audit mounted Warlock recovery source and account history (no SQL)
        run: node --check scripts/audits/test_i2j_p3_invocation_recovery_source.mjs && node --test scripts/audits/test_i2j_p3_invocation_recovery_source.mjs
      - name: Offline extraction kit inert harness (NO PostgreSQL calls)
        run: node --check scripts/audits/i2j_p4_offline_original_functions_export.mjs && node --check scripts/audits/test_i2j_p4_offline_original_functions_export.mjs && node --test scripts/audits/test_i2j_p4_offline_original_functions_export.mjs
      - name: Inert PG17 original function evidence reviewer (NO database)
        run: node --check scripts/audits/i2j_p5_inert_offline_bundle_review.mjs && node --check scripts/audits/test_i2j_p5_inert_offline_bundle_review.mjs && node --test scripts/audits/test_i2j_p5_inert_offline_bundle_review.mjs
      - name: P7 retired-db-CLI gate and file-only candidate intake (NO PostgreSQL)
        run: node --check scripts/audits/i2j_p7_file_only_original_source_intake.mjs && node --check scripts/audits/test_i2j_p7_file_only_original_source_intake.mjs && node --test scripts/audits/test_i2j_p7_file_only_original_source_intake.mjs
      - name: Audit full 28-entry original PR 361–364 preservation in held successor (NO DB)
        run: node --check scripts/audits/test_i2j_pr361_364_retirement_custody.mjs && node --test scripts/audits/test_i2j_pr361_364_retirement_custody.mjs
      - name: Audit all 38 original PR355–360 file entries and signed test cores (NO DB)
        run: node --check scripts/audits/test_i2j_pr355_360_original_custody.mjs && node --test scripts/audits/test_i2j_pr355_360_original_custody.mjs
