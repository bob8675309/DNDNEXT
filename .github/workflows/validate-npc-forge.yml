name: Validate NPC Forge foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-npc-forge.yml"
      - "tools/apply_character_forge_pr_a.py"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-character-forge-pr-a:
    if: github.head_ref == 'agent/character-forge-resilience-presentation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/character-forge-resilience-presentation
          fetch-depth: 0

      - name: Restore canonical validator workflow for asserted editing
        run: git checkout origin/main -- .github/workflows/validate-npc-forge.yml

      - name: Apply asserted patch
        run: python tools/apply_character_forge_pr_a.py

      - name: Exclude workflow policy from generated commit
        run: |
          git checkout HEAD -- .github/workflows/validate-npc-forge.yml
          rm -f tools/apply_character_forge_pr_a.py

      - name: Commit application, migration, documentation, and validation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows'
          git diff --cached --check
          git commit -m "Refine Character Forge resilience and player presentation"
          git push origin HEAD:agent/character-forge-resilience-presentation
