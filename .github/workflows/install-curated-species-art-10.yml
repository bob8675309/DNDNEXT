name: Install Curated Species Art 10

on:
  push:
    branches:
      - agent/species-art-curated-10
    paths:
      - ".art-transfer/curated-10/SOURCE_URL"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard authoritative PR head
        shell: bash
        run: |
          set -euo pipefail
          BASE='4388295b6760d26c2fb34b27da794d5b83b61bb7'
          git fetch origin agent/realistic-dice-core
          test "$(git rev-parse origin/agent/realistic-dice-core)" = "$BASE"

      - name: Download exact approved archive
        shell: bash
        run: |
          set -euo pipefail
          url="$(tr -d '\r\n' < .art-transfer/curated-10/SOURCE_URL)"
          test -n "$url"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output /tmp/species-curated-10.zip
          echo '5de1925683a90d1d3364ec8dcae3b8a9d7e1970220a66e5e241da9a432041df8  /tmp/species-curated-10.zip' | sha256sum -c -
          unzip -t /tmp/species-curated-10.zip
          rm -rf /tmp/species-curated-10
          mkdir -p /tmp/species-curated-10
          unzip -q /tmp/species-curated-10.zip -d /tmp/species-curated-10

      - name: Verify exact file set, dimensions, and Git blobs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import subprocess

          expected = {
            'cinematic-aarakocra.webp': ('76f8b3a9e55810f19589fdb6f75859d00ab466af', '7fd6133c974a5171345f884396d160c6db2bda1fa17bfa10356a85e6d9d9b4ac'),
            'cinematic-aasimar.webp': ('f3105de6a33536ccb50f2d7665bad6e80d775c65', 'bca8ccd54163f2f796b42c97511e065596b766058cc3666c44693c17b8b4a0a0'),
            'cinematic-bugbear.webp': ('75be85c85e5c780990fc5f055a96e10049ebcc1b', '626bf013ce1ce1e669a516c7282b07185353f0c172d7470343f792d1d85d282b'),
            'cinematic-firbolg.webp': ('7acc922b61f2573923924aa561bdb406e49d0c42', 'f6b8efb49aed59f45ddbb8510f75bbfc72aaa4afc56fc0fcf9a6c34ac5c13aaa'),
            'cinematic-goblin.webp': ('9f22f30165c04110541d0ef14ead15ca65889575', '4b303a3874cd1e92ced0a7c0d1d8c0448ee1457dc00971fbe50d83b87e8db1dc'),
            'cinematic-kenku.webp': ('13e79c760f8a6c2f168a5c891890022aa9899eb8', 'cec6b1c942590538c976c22fd01c89330d2cd5060c13db0eb6bfd923d0304664'),
            'cinematic-kobold.webp': ('9fdbd0ef7381ed6a16fc23140e4a260d491b069f', 'c842972b16b05cf5228ca1b64ef2c2cc3aa8ee8090946d1454e68b1b7775d37a'),
            'cinematic-orc.webp': ('bce8121432a3d8d4c57dca43f9e70b7ce3c238e3', 'b42776cb40daf7c7f04c692fabab74c03af73b2cc22bfb9adda66c145c24be72'),
            'cinematic-tabaxi.webp': ('f91ea7cf64f80383fbe2c1ca1f9b66e19f1add53', 'f124906a44c8cd6cf1159c67c1d5bf14532199a78df61754555a7864cf8e3718'),
            'cinematic-tiefling.webp': ('4cb9cfa3831452b9fcba20fb5ce4179dd4536b5d', '3cae27f1c900302eb723ebccbdf124622315384257b1073bc48bdbdc5760b3de'),
          }
          root = Path('/tmp/species-curated-10')
          files = {p.name for p in root.iterdir() if p.is_file()}
          assert files == set(expected), (sorted(files), sorted(expected))
          for name, (expected_git, expected_sha256) in sorted(expected.items()):
            path = root / name
            data = path.read_bytes()
            assert data[:4] == b'RIFF', name
            assert data[8:12] == b'WEBP', name
            assert hashlib.sha256(data).hexdigest() == expected_sha256, name
            with Image.open(path) as im:
              assert im.format == 'WEBP', (name, im.format)
              assert im.size == (720, 960), (name, im.size)
            actual_git = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
            assert actual_git == expected_git, (name, actual_git, expected_git)
            print(name, actual_git, path.stat().st_size)
          PY

      - name: Build clean curated worktree
        shell: bash
        run: |
          set -euo pipefail
          BASE='4388295b6760d26c2fb34b27da794d5b83b61bb7'
          git worktree add --detach /tmp/curated-worktree "$BASE"
          cp /tmp/species-curated-10/cinematic-*.webp /tmp/curated-worktree/public/media/species/
          cd /tmp/curated-worktree
          python - <<'PY'
          from pathlib import Path
          path = Path('utils/speciesArtwork.js')
          text = path.read_text()
          start = text.index('const CINEMATIC_SPECIES_HERO_ARTWORK = Object.freeze({')
          end = text.index('});', start) + 3
          replacement = '''const CINEMATIC_SPECIES_HERO_ARTWORK = Object.freeze({
            aarakocra: "/media/species/cinematic-aarakocra.webp",
            aasimar: "/media/species/cinematic-aasimar.webp",
            bugbear: "/media/species/cinematic-bugbear.webp",
            elf: "/media/species/cinematic-elf.webp",
            firbolg: "/media/species/cinematic-firbolg.webp",
            goblin: "/media/species/cinematic-goblin.webp",
            "half-orc": "/media/species/cinematic-half-orc.webp",
            halfling: "/media/species/cinematic-halfling.webp",
            kenku: "/media/species/cinematic-kenku.webp",
            kobold: "/media/species/cinematic-kobold.webp",
            orc: "/media/species/cinematic-orc.webp",
            tabaxi: "/media/species/cinematic-tabaxi.webp",
            tiefling: "/media/species/cinematic-tiefling.webp",
          });'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Enforce exact change boundary
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/curated-worktree
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          public/media/species/cinematic-aarakocra.webp
          public/media/species/cinematic-aasimar.webp
          public/media/species/cinematic-bugbear.webp
          public/media/species/cinematic-firbolg.webp
          public/media/species/cinematic-goblin.webp
          public/media/species/cinematic-kenku.webp
          public/media/species/cinematic-kobold.webp
          public/media/species/cinematic-orc.webp
          public/media/species/cinematic-tabaxi.webp
          public/media/species/cinematic-tiefling.webp
          utils/speciesArtwork.js
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          ! git diff --name-only | grep -Eiq '(^|/)(world.?map|town.?map|city.?map)(/|\.|$)'
          ! git diff --name-only | grep -Eq 'public/media/species/(air-genasi|earth-genasi|fire-genasi|water-genasi|black-dragonborn|blue-dragonborn|green-dragonborn|red-dragonborn|white-dragonborn|brass-dragonborn|bronze-dragonborn|copper-dragonborn|gold-dragonborn|silver-dragonborn|amethyst-gem-dragonborn|crystal-gem-dragonborn|emerald-gem-dragonborn|sapphire-gem-dragonborn|topaz-gem-dragonborn|hawk-headed-aven|ibis-headed-aven|drow|high-elf|wood-elf|forest-gnome|rock-gnome|beasthide-shifter|longtooth-shifter|swiftstride-shifter|wildhunt-shifter|lorwyn-fairy|shadowmoor-fairy|lorwyn-kithkin|shadowmoor-kithkin|dwarf-kaladesh|goblin-dankwood|orc-ixalan)\.webp$'

      - name: Validate Forge and production build
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/curated-worktree
          npm ci
          node scripts/validate_species_class_review_fix.mjs
          node scripts/validate_class_browser_polish.mjs
          npm run build

      - name: Recheck PR head and push clean direct branch
        shell: bash
        run: |
          set -euo pipefail
          BASE='4388295b6760d26c2fb34b27da794d5b83b61bb7'
          git fetch origin agent/realistic-dice-core agent/species-art-curated-10-direct
          test "$(git rev-parse origin/agent/realistic-dice-core)" = "$BASE"
          test "$(git rev-parse origin/agent/species-art-curated-10-direct)" = "$BASE"
          cd /tmp/curated-worktree
          git add public/media/species/cinematic-*.webp utils/speciesArtwork.js
          git diff --cached --name-only | sort > /tmp/final-actual.txt
          diff -u /tmp/expected.txt /tmp/final-actual.txt
          git config user.name 'DNDNext Automation'
          git config user.email 'automation@dndnext.local'
          git commit -m 'Replace curated Species cinematic artwork'
          git push origin HEAD:agent/species-art-curated-10-direct
