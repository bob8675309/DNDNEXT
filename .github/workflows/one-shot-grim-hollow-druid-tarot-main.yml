name: One-shot validate Grim Hollow Druid Tarot main

on:
  push:
    branches:
      - agent/grim-hollow-druid-tarot-main-transfer-20261007
    paths:
      - ".github/workflows/one-shot-grim-hollow-druid-tarot-main.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main target
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard exact main head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5caf25069e91ac5b40b723c4d9826c1fb93cfbb8"

      - name: Verify approved Druid Tarot bytes and dimensions
        shell: bash
        run: |
          set -euo pipefail
          echo "b4bd7a3601b7adc419a7544abd97c6d608b7c5503ef6522785fd9481d80945e3  public/media/subclasses/druid/druid-circle-of-blood.webp" | sha256sum -c -
          echo "1952185310c3896710bb7270cfb500d60c7ae0890041b91576ee4c1fa8bc62c1  public/media/subclasses/druid/druid-circle-of-entropy.webp" | sha256sum -c -
          echo "cb55b3ed67819ac9829b198a0c2a3726f12049fcd05fcec2c3bae4ec84b35685  public/media/subclasses/druid/druid-circle-of-mutation.webp" | sha256sum -c -
          for f in public/media/subclasses/druid/druid-circle-of-{blood,entropy,mutation}.webp; do
            test "$(file -b --mime-type "$f")" = "image/webp"
          done
          python -m pip install --disable-pip-version-check pillow==11.3.0 >/dev/null
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ["blood", "entropy", "mutation"]:
              p = Path(f"public/media/subclasses/druid/druid-circle-of-{name}.webp")
              with Image.open(p) as im:
                  assert im.format == "WEBP", (p, im.format)
                  assert im.size == (840, 1440), (p, im.size)
          PY

      - name: Validate subclass Tarot browser
        run: node scripts/validate_class_subclass_browser.mjs
