      - name: Add regression validation and update existing validators
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/validate_class_subclass_browser.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          const read = (file) => fs.readFileSync(path.join(root, file), "utf8");
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          const guide = read("components/NpcForgeClassGuide.js");
          const browser = read("components/ClassSubclassSection.js");
          const presentation = read("utils/classes/classPresentation.js");
          const framing = read("styles/character-forge-class-hero-framing.css");
          const model = read("components/NpcForgeClassGuideModel.js");

          for (const token of [
            'import ClassSubclassSection from "./ClassSubclassSection"',
            "<ClassSubclassSection",
            "onPreviewSubclass={(option) => previewSubclass(model, onFeatureDetail, option)}",
            '<p className="npc-forge-class-guide__hero-tagline">{classOverviewSummary(selectedClass)}</p>',
          ]) assert(guide.includes(token), `Class guide is missing ${token}`);
          assert(!guide.includes("model.options.map((option) => <SubclassButton"), "Legacy all-subclass pill wall is still rendered by the Class guide.");
          assert(!guide.includes("<ClassOverviewCopy selectedClass={selectedClass}"), "Expanded Class overview copy is duplicated below the hero facts.");

          for (const token of [
            'import { useEffect, useMemo, useState } from "react"',
            "const [browserOpen, setBrowserOpen] = useState(false)",
            "const [search, setSearch] = useState(\"\")",
            "const [source, setSource] = useState(\"all\")",
            "const [expandedKey, setExpandedKey] = useState(\"\")",
            "model?.options || []",
            "model.selectSubclass(option)",
            "Number(option.firstLevel || 1) <= Number(model?.currentLevel || 1)",
            'aria-label="Subclass catalogue"',
            'aria-label="Subclass source filters"',
            "Search subclasses",
            "Browse Subclasses",
            "Change Subclass",
            "Available at level",
            "max-height:min(48vh,520px)",
            "grid-template-columns:repeat(2,minmax(0,1fr))",
            "grid-column:1/-1",
          ]) assert(browser.includes(token), `Subclass browser is missing ${token}`);
          assert(!browser.includes("supabase"), "Subclass browser must remain presentation-only and must not query Supabase directly.");
          assert(model.includes("resolveSubclassCatalog") && model.includes("const options = useMemo"), "Subclass browser must continue receiving canonical options from the existing guide model.");

          for (const key of ["fighter", "wizard", "rogue", "cleric", "ranger", "paladin", "warlock"]) {
            assert(presentation.includes(`${key}:`), `Expanded standard Class overview copy is missing ${key}.`);
          }
          assert(presentation.includes("imported.length >= 180"), "Long imported/campaign-specific Class summaries must remain authoritative over generic standard copy.");

          for (const token of [
            "object-position: right top !important",
            "left: 24% !important",
            "min-height: 286px !important",
            "grid-template-columns: minmax(0, 55%) minmax(0, 45%) !important",
            "grid-template-columns: minmax(0, 72%) minmax(220px, 28%) !important",
          ]) assert(framing.includes(token), `Top-right cinematic Class art framing is missing ${token}`);

          const protectedSource = `${guide}\n${browser}\n${presentation}\n${framing}`.toLowerCase();
          for (const token of ["map_routes", "advance_all_characters", "mappageclient", "townsheet", "encounter_weapon_attack", "crafting_recipe"]) {
            assert(!protectedSource.includes(token), `Class presentation patch crossed protected boundary: ${token}`);
          }

          console.log("Class subclass browser validation passed: compact summary, searchable/source-filtered two-column browser, explicit details/selection, current-level eligibility, expanded Class copy, top-right cinematic art, canonical model authority, and protected boundaries are intact.");
          EOF

          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/validate-class-browser-polish.yml')
          text = workflow.read_text()
          anchor = '''      - name: Validate Class hero framing
                  run: node scripts/validate_class_hero_framing.mjs
          '''
          assert anchor in text
          text = text.replace(anchor, anchor + '''      - name: Validate Class subclass browser
                  run: node scripts/validate_class_subclass_browser.mjs
          ''', 1)
          workflow.write_text(text)

          polish = Path('scripts/validate_class_browser_polish.mjs')
          text = polish.read_text()
          anchor = 'const guide = read("components/NpcForgeClassGuide.js");\n'
          assert anchor in text
          text = text.replace(anchor, anchor + 'const subclassBrowser = read("components/ClassSubclassSection.js");\n', 1)
          replacements = {
            '"classHeroTagline"': '"classOverviewSummary(selectedClass)"',
            '"npc-forge-class-guide__subclass-grid"': '"ClassSubclassSection"',
            '\'aria-label="Available subclasses"\'': '"onPreviewSubclass"',
            '"model.options.map((option) => <SubclassButton"': '"model={model}"',
            '"npc-forge-class-guide__subclass-confirm"': '"ForgeSubclassSelection"',
          }
          for old, new in replacements.items():
            assert old in text, old
            text = text.replace(old, new, 1)
          insertion = '''assert(!guide.includes("model.options.slice(0, 4)"), "Subclass catalogue must no longer collapse after four entries.");'''
          assert insertion in text
          text = text.replace(insertion, '''assert(!guide.includes("model.options.slice(0, 4)"), "Subclass catalogue must no longer collapse after four entries.");
          for (const token of ["Browse Subclasses", "Search subclasses", "model.selectSubclass(option)", "aria-label=\\"Subclass catalogue\\""]) assert(subclassBrowser.includes(token), `Compact subclass browser is missing ${token}`);''', 1)
          protected_old = 'const protectedSources = `${step}\\n${catalog}\\n${guide}\\n${guideStyles}\\n${dock}\\n${artwork}\\n${presentation}\\n${catalogWrapper}\\n${polish}`.toLowerCase();'
          assert protected_old in text
          text = text.replace(protected_old, 'const protectedSources = `${step}\\n${catalog}\\n${guide}\\n${subclassBrowser}\\n${guideStyles}\\n${dock}\\n${artwork}\\n${presentation}\\n${catalogWrapper}\\n${polish}`.toLowerCase();', 1)
          polish.write_text(text)

          review = Path('scripts/validate_species_class_review_fix.mjs')
          text = review.read_text()
          anchor = 'const guide = read("components/NpcForgeClassGuide.js");\n'
          assert anchor in text
          text = text.replace(anchor, anchor + 'const subclassBrowser = read("components/ClassSubclassSection.js");\n', 1)
          old = '''assert(guide.includes("model.options.map((option) => <SubclassButton"), "Every subclass must render directly in the visible subclass grid.");
          assert(!guide.includes("model.options.slice(0, 4)"), "Subclass grid must not collapse after four entries.");
          assert(!guide.includes("npc-forge-class-guide__subclass-more"), "The Class overview must not hide subclasses behind a More disclosure.");
          assert(guide.includes("ForgeSubclassSelection"), "Subclass selection behavior was removed.");
          assert(guide.includes("model.selectSubclass(model.preview)"), "Subclass confirmation behavior was removed.");'''
          new = '''assert(guide.includes("ClassSubclassSection"), "Class overview must use the compact subclass browser.");
          assert(!guide.includes("model.options.map((option) => <SubclassButton"), "Legacy subclass pill wall returned to the Class overview.");
          assert(!guide.includes("model.options.slice(0, 4)"), "Subclass catalogue must not collapse after four entries.");
          assert(!guide.includes("npc-forge-class-guide__subclass-more"), "The Class overview must not hide subclasses behind a More disclosure.");
          assert(guide.includes("ForgeSubclassSelection"), "Subclass selection behavior was removed.");
          assert(subclassBrowser.includes("model.selectSubclass(option)"), "Subclass confirmation behavior was removed from the browser.");
          assert(subclassBrowser.includes('aria-label="Subclass catalogue"'), "Every canonical subclass must remain browseable in the inline catalogue.");'''
          assert old in text
          text = text.replace(old, new, 1)
          protected_old = 'const protectedSource = `${css}\\n${cinematic}\\n${finalCorrections}\\n${guide}\\n${classCatalog}\\n${classEmpty}\\n${classArtwork}\\n${speciesArtwork}\\n${forgeModal}`.toLowerCase();'
          assert protected_old in text
          text = text.replace(protected_old, 'const protectedSource = `${css}\\n${cinematic}\\n${finalCorrections}\\n${guide}\\n${subclassBrowser}\\n${classCatalog}\\n${classEmpty}\\n${classArtwork}\\n${speciesArtwork}\\n${forgeModal}`.toLowerCase();', 1)
          review.write_text(text)

          hero = Path('scripts/validate_class_hero_framing.mjs')
          text = hero.read_text()
          anchor = '"object-position: right center !important",\n'
          # Keep the legacy right-center guard and explicitly add the public cinematic top-right guard.
          assert anchor in text
          text = text.replace(anchor, anchor + '  "object-position: right top !important",\n', 1)
          hero.write_text(text)
          PY

