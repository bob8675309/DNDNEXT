name: Materialize Class subclass browser polish

on:
  push:
    branches:
      - agent/class-subclass-browser-20260905
    paths:
      - .github/workflows/materialize-class-subclass-browser.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@v4
        with:
          ref: agent/class-subclass-browser-20260905
          fetch-depth: 0

      - name: Guard exact scratch parent and PR baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '05b2f32a84b8e64127f1518452b9d0a2369df2df'
          git cat-file -e '2be4a16fd4fdc9b943c2cfee1c8097e3d9589833^{commit}'

      - name: Patch Class guide and presentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('components/NpcForgeClassGuide.js')
          text = path.read_text()
          anchor = 'import NpcForgeClassGuideStyles from "./NpcForgeClassGuideStyles";\n'
          if 'import ClassSubclassSection from "./ClassSubclassSection";' not in text:
              assert anchor in text
              text = text.replace(anchor, anchor + 'import ClassSubclassSection from "./ClassSubclassSection";\n', 1)

          old_tagline = '''function classHeroTagline(selectedClass = {}) {
            if (classThemeKey(selectedClass) === "artificer") return "A master of invention who turns ideas into reality.";
            const copy = classOverviewSummary(selectedClass);
            const firstStop = copy.search(/[.!?](?:\\s|$)/);
            return firstStop >= 0 ? copy.slice(0, firstStop + 1) : copy;
          }
          '''
          if old_tagline in text:
              text = text.replace(old_tagline, '', 1)
          text = text.replace(
              '<p className="npc-forge-class-guide__hero-tagline">{classHeroTagline(selectedClass)}</p>',
              '<p className="npc-forge-class-guide__hero-tagline">{classOverviewSummary(selectedClass)}</p>',
              1,
          )

          old_copy = 'function ClassOverviewCopy({ selectedClass }) {\n  return <section className="npc-forge-class-guide__overview-copy"><p>{classOverviewSummary(selectedClass)}</p></section>;\n}\n'
          text = text.replace(old_copy, '', 1)

          if 'function SubclassButton(' in text:
              start = text.index('function SubclassButton(')
              end = text.index('function ChoiceRoutingNote(')
              wrapper = '''function ForgeSubclassSelection({ model, onFeatureDetail, detailed = false }) {
            return <ClassSubclassSection
              model={model}
              detailed={detailed}
              onPreviewSubclass={(option) => previewSubclass(model, onFeatureDetail, option)}
            />;
          }
          '''
              text = text[:start] + wrapper + text[end:]

          text = text.replace('        <ClassOverviewCopy selectedClass={selectedClass} />\n', '', 1)

          for token in [
              'import ClassSubclassSection from "./ClassSubclassSection";',
              '<p className="npc-forge-class-guide__hero-tagline">{classOverviewSummary(selectedClass)}</p>',
              '<ClassSubclassSection',
              'onPreviewSubclass={(option) => previewSubclass(model, onFeatureDetail, option)}',
          ]:
              assert token in text, token
          assert 'function SubclassButton(' not in text
          assert '<ClassOverviewCopy selectedClass={selectedClass}' not in text
          path.write_text(text)
          PY

          cat > utils/classes/classPresentation.js <<'EOF'
          const text = (value) => String(value ?? "").trim();
          const keyFor = (classRow = {}) => text(classRow?.class_key).toLowerCase();

          const SPECIAL_CLASS_SUMMARIES = Object.freeze({
            "monster-hunter": "A tactical martial hunter who records dangerous creatures in a personal Monster Grimoire, combines weapon mastery with Studied Response reaction attacks, and expands that specialized knowledge as their experience grows. At level 3 the hunter joins the Carver, Devourer, Occultist, or Trapper Guild, shifting the class toward fearless frontline combat, monster-derived adaptations, occult countermeasures, or prepared gadgets and traps.",
            mystic: "An Intelligence-focused psionic adept who turns disciplined thought into supernatural effects through talents, psi points, psychic focus, and psionic disciplines rather than conventional spellcasting. A Mystic Order is chosen at level 1—Avatar, Awakened, Immortal, Nomad, Soul Knife, or Wu Jen—and shapes how that mental power inspires allies, manipulates minds, reinforces the body, explores, fights, or controls the natural world.",
            "expert-sidekick": "A support-oriented NPC sidekick built around broad proficiency, timely assistance, mobility, and Expertise. The Expert can Help as a Bonus Action, develops Cunning Action, and grows into a versatile problem-solver beside the adventuring party.",
            "warrior-sidekick": "A combat-focused NPC sidekick trained to stand beside adventurers in a fight. The Warrior chooses an Attacker or Defender role at level 1 and develops dependable offense and durability through features such as Second Wind and Improved Critical.",
            "spellcaster-sidekick": "A magic-focused NPC sidekick that chooses a Mage, Healer, or Prodigy role at level 1. That role determines its spell list and spellcasting ability—Intelligence, Wisdom, or Charisma—while the class advances a compact spellcasting progression alongside its sidekick features.",
            civilian: "A character without an adventuring class: a townsperson, professional, official, artisan, scholar, attendant, or other ordinary person whose identity comes from species, background, skills, profession, and story rather than class progression.",
          });

          const STANDARD_CLASS_SUMMARIES = Object.freeze({
            artificer: "Artificers turn practical knowledge into magical invention, combining careful study with tools, crafted devices, and adaptable spellwork. They excel at solving problems before and during an adventure, improving equipment, supporting allies, and shaping a personal specialty around the way they build, experiment, and apply magic.",
            barbarian: "Barbarians meet danger with raw physical power, instinct, and extraordinary resilience. Their defining battle fury lets them endure punishment and hit with frightening force, while their primal path determines whether that ferocity comes from ancestors, nature, divine influence, supernatural transformation, or another source of untamed strength.",
            bard: "Bards turn talent, lore, and force of personality into versatile magic. They inspire companions, undermine enemies, and adapt to unfamiliar problems with an unusually broad range of skills. A bard's chosen college shapes whether that creativity is expressed through performance, swordplay, secrets, eloquence, supernatural tales, or another specialized tradition.",
            cleric: "Clerics wield divine magic through devotion to a deity, sacred ideal, cosmic force, or spiritual calling. They can protect and restore their companions while bringing formidable magic against their enemies. Their divine domain gives that faith a distinct expression, shaping the miracles, combat role, and sacred responsibilities that define the cleric's path.",
            druid: "Druids draw magic from the living world and the primal forces that move through it. They combine versatile nature magic with transformation, survival, and control of the battlefield. A druidic circle emphasizes a particular relationship with nature, from shapeshifting and elemental power to stars, spores, dreams, wildfire, or other ancient traditions.",
            fighter: "Fighters are disciplined combatants whose strength comes from training, battlefield awareness, and mastery of weapons and armor. They can be straightforward front-line defenders or highly technical specialists, adapting their tactics to the encounter at hand. Their martial archetype determines the techniques, supernatural talents, or specialized training that set them apart.",
            monk: "Monks transform disciplined training into remarkable speed, precision, and control over body and spirit. They fight effectively with martial arts, movement, and focused inner power rather than relying on heavy equipment. A monastic tradition determines how that discipline develops, from weapon mastery and shadow to elemental, spiritual, or supernatural techniques.",
            paladin: "Paladins bind martial training to a powerful oath, turning conviction into protective and destructive divine magic. They stand comfortably on the front line, shielding allies, confronting dangerous foes, and delivering decisive bursts of power. The oath they swear defines both their supernatural gifts and the ideals they are expected to uphold.",
            ranger: "Rangers are adaptable warriors and explorers who thrive where civilization gives way to dangerous wilderness. They combine weapon skill, survival expertise, mobility, and nature-oriented magic to track threats and control difficult terrain. Their archetype shapes the quarry, environment, companion, supernatural gift, or specialized hunting style they bring to an adventuring party.",
            rogue: "Rogues rely on precision, timing, mobility, and a deep collection of practical skills rather than brute force. They are experts at exploiting openings, bypassing obstacles, and approaching danger on their own terms. A rogue archetype can emphasize stealth, investigation, deception, magic, swashbuckling, assassination, psychic talent, or another highly specialized tradecraft.",
            sorcerer: "Sorcerers possess magic as an intrinsic part of who they are rather than learning it through formal study. Their spellcasting is flexible and personal, shaped by metamagic and the supernatural origin of their power. That origin might come from dragons, wild magic, cosmic forces, strange bloodlines, divine influence, or another transformative source.",
            warlock: "Warlocks gain occult power through a pact, bargain, bond, or forbidden connection with an extraordinary patron. Their compact spellcasting is reinforced by invocations and other customizable gifts, allowing two warlocks to develop very differently. Patron and pact choices shape the magic, abilities, obligations, and strange advantages that define the character.",
            wizard: "Wizards master arcane magic through disciplined study, experimentation, and carefully recorded formulae. Their spellbooks let them prepare a broad range of magic for the challenges ahead, making them exceptionally versatile problem-solvers. As their knowledge grows, wizards specialize in magical traditions that refine how they study, shape, defend against, and deploy spells.",
          });

          export function classPresentationSummary(classRow = {}, fallback = "") {
            const special = SPECIAL_CLASS_SUMMARIES[keyFor(classRow)];
            const imported = text(classRow?.summary);
            const standard = STANDARD_CLASS_SUMMARIES[keyFor(classRow)];
            return special || (imported.length >= 180 ? imported : standard || imported || fallback);
          }

          export function classPrimaryAbilities(classRow = {}) {
            const imported = Array.isArray(classRow?.primary_abilities) ? classRow.primary_abilities.filter(Boolean) : [];
            if (imported.length) return imported;
            if (keyFor(classRow) === "artificer") return ["int"];
            if (keyFor(classRow) === "mystic") return ["int"];
            return [];
          }

          export function classMagicPresentation(classRow = {}, abilityLabels = {}) {
            const key = keyFor(classRow);
            if (key === "mystic") return "Psionics • Intelligence";
            if (key === "monster-hunter") return "Guild-dependent";
            if (key === "spellcaster-sidekick") return "Role-based • Int / Wis / Cha";
            const ability = text(classRow?.spellcasting_ability);
            return ability ? (abilityLabels[ability] || ability) : "None at base class";
          }

          export function isSidekickClass(classRow = {}) {
            return keyFor(classRow).endsWith("-sidekick");
          }
          EOF

      - name: Refine public cinematic hero framing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('styles/character-forge-class-hero-framing.css')
          css = path.read_text()
          pairs = [
              ('grid-template-columns: minmax(0, 62%) minmax(0, 38%) !important;', 'grid-template-columns: minmax(0, 55%) minmax(0, 45%) !important;'),
              ('left: 30% !important;', 'left: 24% !important;'),
          ]
          for old, new in pairs:
              assert old in css, old
              css = css.replace(old, new, 1)
          assert css.count('min-height: 218px !important;') >= 2
          css = css.replace('min-height: 218px !important;', 'min-height: 286px !important;', 2)

          marker = '  /* Keep all normal Class copy/control surfaces above the full-height art. */'
          assert marker in css
          enhancement = '''  /* Browser-review refinement: expose more of approved cinematic art from the top-right. */
          .unified-player-character-forge .npc-forge-class-guide .npc-forge-class-guide__hero-art:has(img[src*="/media/classes/cinematic-"])::before {
            background:
              linear-gradient(90deg, rgba(5, 8, 15, 0.99) 0%, rgba(5, 8, 15, 0.88) 18%, rgba(5, 8, 15, 0.52) 39%, rgba(5, 8, 15, 0.12) 61%, rgba(5, 8, 15, 0) 78%),
              linear-gradient(0deg, rgba(5, 8, 14, 0.52) 0%, rgba(5, 8, 14, 0.04) 30%, rgba(5, 8, 14, 0.02) 80%, rgba(5, 8, 14, 0.18) 100%) !important;
          }

          .unified-player-character-forge .npc-forge-class-guide .npc-forge-class-guide__hero-art:has(img[src*="/media/classes/cinematic-"]) img {
            object-position: right top !important;
            transform-origin: right top !important;
            filter: saturate(0.98) contrast(1.04) brightness(0.94) !important;
          }

          .unified-player-character-forge .npc-forge-class-guide .npc-forge-class-guide__book-hero:has(.npc-forge-class-guide__hero-art img[src*="/media/classes/cinematic-"]) > .npc-forge-class-guide__hero-copy {
            align-content: start !important;
            padding: 42px 24px 24px 28px !important;
          }

          .unified-player-character-forge .npc-forge-class-guide .npc-forge-class-guide__book-hero:has(.npc-forge-class-guide__hero-art img[src*="/media/classes/cinematic-"]) .npc-forge-class-guide__hero-tagline {
            max-width: 68ch !important;
            font-size: .76rem !important;
            line-height: 1.55 !important;
          }

          .unified-player-character-forge .npc-forge-class-guide .npc-forge-class-guide__overview-book:has(.npc-forge-class-guide__hero-art img[src*="/media/classes/cinematic-"]) .npc-forge-class-guide__overview-layout {
            grid-template-columns: minmax(0, 72%) minmax(220px, 28%) !important;
            gap: 10px !important;
          }

          '''
          css = css.replace(marker, enhancement + marker, 1)
          path.write_text(css)
          PY

      - name: Add subclass-browser regression coverage
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/validate_class_subclass_browser.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          const root = process.cwd();
          const read = (file) => fs.readFileSync(path.join(root, file), "utf8");
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const guide = read("components/NpcForgeClassGuide.js");
          const browser = read("components/ClassSubclassSection.js");
          const presentation = read("utils/classes/classPresentation.js");
          const framing = read("styles/character-forge-class-hero-framing.css");
          const model = read("components/NpcForgeClassGuideModel.js");

          for (const token of ['import ClassSubclassSection from "./ClassSubclassSection"', '<ClassSubclassSection', 'onPreviewSubclass={(option) => previewSubclass(model, onFeatureDetail, option)}', '<p className="npc-forge-class-guide__hero-tagline">{classOverviewSummary(selectedClass)}</p>']) assert(guide.includes(token), `Class guide is missing ${token}`);
          assert(!guide.includes("model.options.map((option) => <SubclassButton"), "Legacy subclass pill wall is still rendered.");
          assert(!guide.includes("<ClassOverviewCopy selectedClass={selectedClass}"), "Expanded Class overview copy is duplicated below the hero facts.");
          for (const token of ['const [browserOpen, setBrowserOpen] = useState(false)', 'const [search, setSearch] = useState("")', 'const [source, setSource] = useState("all")', 'const [expandedKey, setExpandedKey] = useState("")', 'model?.options || []', 'model.selectSubclass(option)', 'Number(option.firstLevel || 1) <= Number(model?.currentLevel || 1)', 'aria-label="Subclass catalogue"', 'aria-label="Subclass source filters"', 'Search subclasses', 'Browse Subclasses', 'Change Subclass', 'Available at level', 'max-height:min(48vh,520px)', 'grid-template-columns:repeat(2,minmax(0,1fr))', 'grid-column:1/-1', 'detailed ? " is-detailed" : ""']) assert(browser.includes(token), `Subclass browser is missing ${token}`);
          assert(!browser.includes("supabase"), "Subclass browser must remain presentation-only.");
          assert(model.includes("resolveSubclassCatalog") && model.includes("const options = useMemo"), "Canonical subclass authority moved out of the existing guide model.");
          for (const key of ["fighter", "wizard", "rogue", "cleric", "ranger", "paladin", "warlock"]) assert(presentation.includes(`${key}:`), `Expanded core Class summary missing ${key}.`);
          assert(presentation.includes("imported.length >= 180"), "Long imported/campaign Class summaries must remain authoritative.");
          for (const token of ['object-position: right top !important', 'left: 24% !important', 'min-height: 286px !important', 'grid-template-columns: minmax(0, 55%) minmax(0, 45%) !important', 'grid-template-columns: minmax(0, 72%) minmax(220px, 28%) !important']) assert(framing.includes(token), `Top-right cinematic framing missing ${token}`);
          const protectedSource = `${guide}\n${browser}\n${presentation}\n${framing}`.toLowerCase();
          for (const token of ["map_routes", "advance_all_characters", "mappageclient", "townsheet", "encounter_weapon_attack", "crafting_recipe"]) assert(!protectedSource.includes(token), `Class presentation patch crossed protected boundary: ${token}`);
          console.log("Class subclass browser validation passed.");
          EOF

          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/validate-class-browser-polish.yml')
          text = workflow.read_text()
          if 'Validate Class subclass browser' not in text:
              anchor = '      - name: Validate Class hero framing\n        run: node scripts/validate_class_hero_framing.mjs\n'
              assert anchor in text
              text = text.replace(anchor, anchor + '      - name: Validate Class subclass browser\n        run: node scripts/validate_class_subclass_browser.mjs\n', 1)
          workflow.write_text(text)

          polish = Path('scripts/validate_class_browser_polish.mjs')
          text = polish.read_text()
          if 'const subclassBrowser = read("components/ClassSubclassSection.js");' not in text:
              text = text.replace('const guide = read("components/NpcForgeClassGuide.js");\n', 'const guide = read("components/NpcForgeClassGuide.js");\nconst subclassBrowser = read("components/ClassSubclassSection.js");\n', 1)
          for old, new in {
              '"classHeroTagline"':'"classOverviewSummary(selectedClass)"',
              '"npc-forge-class-guide__subclass-grid"':'"ClassSubclassSection"',
              '\'aria-label="Available subclasses"\'':'"onPreviewSubclass"',
              '"model.options.map((option) => <SubclassButton"':'"model={model}"',
              '"npc-forge-class-guide__subclass-confirm"':'"ForgeSubclassSelection"',
          }.items():
              assert old in text, old
              text = text.replace(old, new, 1)
          insertion = 'assert(!guide.includes("model.options.slice(0, 4)"), "Subclass catalogue must no longer collapse after four entries.");'
          assert insertion in text
          text = text.replace(insertion, insertion + '\nfor (const token of ["Browse Subclasses", "Search subclasses", "model.selectSubclass(option)", \'aria-label="Subclass catalogue"\']) assert(subclassBrowser.includes(token), `Compact subclass browser is missing ${token}`);', 1)
          old = 'const protectedSources = `${step}\\n${catalog}\\n${guide}\\n${guideStyles}\\n${dock}\\n${artwork}\\n${presentation}\\n${catalogWrapper}\\n${polish}`.toLowerCase();'
          assert old in text
          text = text.replace(old, 'const protectedSources = `${step}\\n${catalog}\\n${guide}\\n${subclassBrowser}\\n${guideStyles}\\n${dock}\\n${artwork}\\n${presentation}\\n${catalogWrapper}\\n${polish}`.toLowerCase();', 1)
          polish.write_text(text)

          review = Path('scripts/validate_species_class_review_fix.mjs')
          text = review.read_text()
          if 'const subclassBrowser = read("components/ClassSubclassSection.js");' not in text:
              text = text.replace('const guide = read("components/NpcForgeClassGuide.js");\n', 'const guide = read("components/NpcForgeClassGuide.js");\nconst subclassBrowser = read("components/ClassSubclassSection.js");\n', 1)
          old_block = '''assert(guide.includes("model.options.map((option) => <SubclassButton"), "Every subclass must render directly in the visible subclass grid.");
          assert(!guide.includes("model.options.slice(0, 4)"), "Subclass grid must not collapse after four entries.");
          assert(!guide.includes("npc-forge-class-guide__subclass-more"), "The Class overview must not hide subclasses behind a More disclosure.");
          assert(guide.includes("ForgeSubclassSelection"), "Subclass selection behavior was removed.");
          assert(guide.includes("model.selectSubclass(model.preview)"), "Subclass confirmation behavior was removed.");'''
          new_block = '''assert(guide.includes("ClassSubclassSection"), "Class overview must use the compact subclass browser.");
          assert(!guide.includes("model.options.map((option) => <SubclassButton"), "Legacy subclass pill wall returned to the Class overview.");
          assert(!guide.includes("model.options.slice(0, 4)"), "Subclass catalogue must not collapse after four entries.");
          assert(!guide.includes("npc-forge-class-guide__subclass-more"), "The Class overview must not hide subclasses behind a More disclosure.");
          assert(guide.includes("ForgeSubclassSelection"), "Subclass selection behavior was removed.");
          assert(subclassBrowser.includes("model.selectSubclass(option)"), "Subclass confirmation behavior was removed from the browser.");
          assert(subclassBrowser.includes('aria-label="Subclass catalogue"'), "Every canonical subclass must remain browseable in the inline catalogue.");'''
          assert old_block in text
          text = text.replace(old_block, new_block, 1)
          old = 'const protectedSource = `${css}\\n${cinematic}\\n${finalCorrections}\\n${guide}\\n${classCatalog}\\n${classEmpty}\\n${classArtwork}\\n${speciesArtwork}\\n${forgeModal}`.toLowerCase();'
          assert old in text
          text = text.replace(old, 'const protectedSource = `${css}\\n${cinematic}\\n${finalCorrections}\\n${guide}\\n${subclassBrowser}\\n${classCatalog}\\n${classEmpty}\\n${classArtwork}\\n${speciesArtwork}\\n${forgeModal}`.toLowerCase();', 1)
          review.write_text(text)
          PY

      - name: Update rollout documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/CHARACTER_FORGE_CLASS_CINEMATIC_ARTWORK_ROLLOUT.md')
          text = path.read_text()
          marker = '## Validation gate\n'
          assert marker in text
          section = '''## Browser-review refinement: top-right art + compact subclass browser

          The first live cinematic browser review established three presentation refinements:

          - Public cinematic hero art is anchored to the top-right and exposed more aggressively instead of reading like a mid-page framed insert.
          - The Class identity paragraph in the hero uses the longer presentation summary. Long imported/campaign-specific summaries remain authoritative; concise core summaries receive richer presentation copy.
          - The permanent all-subclass pill wall is replaced by a compact summary plus an inline browser. The browser exposes every canonical `model.options` subclass with search, source filters, a bounded two-column scroll area, one expanded detail card at a time, and explicit level-gated Choose buttons. Browsing never changes eligibility or persistence authority.

          `components/ClassSubclassSection.js` owns only browser presentation state (`browserOpen`, `search`, `source`, `expandedKey`). Actual subclass availability and persistence remain in `useNpcForgeClassGuideModel` / `NpcForgeClassChoiceContext` through `model.options`, `model.currentLevel`, and `model.selectSubclass`.

          '''
          if '## Browser-review refinement: top-right art + compact subclass browser' not in text:
              text = text.replace(marker, section + marker, 1)
          path.write_text(text)
          PY

      - name: Validate scoped patch
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate_class_subclass_browser.mjs
          node scripts/validate_class_browser_polish.mjs
          node scripts/validate_class_hero_framing.mjs
          node scripts/validate_class_final_browser_fix.mjs
          node scripts/validate_species_class_review_fix.mjs

      - name: Commit clean scratch result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-class-subclass-browser.yml
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/validate-class-browser-polish.yml
          components/ClassSubclassSection.js
          components/NpcForgeClassGuide.js
          docs/CHARACTER_FORGE_CLASS_CINEMATIC_ARTWORK_ROLLOUT.md
          scripts/validate_class_browser_polish.mjs
          scripts/validate_class_subclass_browser.mjs
          scripts/validate_species_class_review_fix.mjs
          styles/character-forge-class-hero-framing.css
          utils/classes/classPresentation.js
          EOF
          git diff --name-only 2be4a16fd4fdc9b943c2cfee1c8097e3d9589833 | grep -v '^.github/workflows/materialize-class-subclass-browser.yml$' | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine Class hero and subclass browser presentation'
          git push origin HEAD:agent/class-subclass-browser-20260905
