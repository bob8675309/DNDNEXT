name: Apply Character Forge PR A

on:
  push:
    branches:
      - agent/character-forge-resilience-presentation
    paths:
      - "tools/apply_character_forge_pr_a.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/character-forge-resilience-presentation
          fetch-depth: 0

      - name: Apply asserted patch
        run: python tools/apply_character_forge_pr_a.py

      - name: Remove one-use patch helpers
        run: |
          rm -f tools/apply_character_forge_pr_a.py
          rm -f .github/workflows/apply-character-forge-pr-a.yml

      - name: Commit real patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine Character Forge resilience and player presentation"
          git push origin HEAD:agent/character-forge-resilience-presentation
