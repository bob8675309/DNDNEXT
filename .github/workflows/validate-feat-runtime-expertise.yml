name: Validate feat runtime Expertise

on:
  push:
    branches:
      - agent/character-forge-resilience-presentation
    paths:
      - "utils/featSourceChoiceNormalization.js"
      - "utils/characterRuntimeProficiencies.js"
      - "components/CharacterFeatRuntimeExpertisePanel.js"
      - "components/CharacterCurrencyBadge.js"
      - "scripts/validate_feat_runtime_expertise.mjs"
      - "sql/20260809_71_feat_runtime_expertise.sql"
      - ".github/workflows/validate-feat-runtime-expertise.yml"
  pull_request:
    paths:
      - "utils/featSourceChoiceNormalization.js"
      - "utils/characterRuntimeProficiencies.js"
      - "components/CharacterFeatRuntimeExpertisePanel.js"
      - "components/CharacterCurrencyBadge.js"
      - "scripts/validate_feat_runtime_expertise.mjs"
      - "sql/20260809_71_feat_runtime_expertise.sql"
      - ".github/workflows/validate-feat-runtime-expertise.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate feat runtime Expertise authority
        run: |
          node scripts/validate_feat_runtime_expertise.mjs
          node scripts/validate_unified_character_forge.mjs
          node scripts/validate_character_progression_v3.mjs
      - name: Run production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder
        run: npm run build:vercel
