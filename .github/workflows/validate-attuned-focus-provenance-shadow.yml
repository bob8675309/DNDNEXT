name: Validate Attuned Focus Provenance Shadow
on:
  pull_request:
    paths:
      - "sql/20261026_03_attuned_focus_provenance_shadow.sql"
      - "scripts/fixtures/attuned_focus_provenance_shadow.sql"
      - "scripts/validate_attuned_focus_provenance_shadow.mjs"
      - ".github/workflows/validate-attuned-focus-provenance-shadow.yml"
      - "docs/**"
  workflow_dispatch:
jobs:
  conservative-source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate_attuned_tactical_spell_execution_preflight.mjs
      - run: node scripts/validate_attuned_focus_provenance_shadow.mjs
  disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: focus_provenance_shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d focus_provenance_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: focus_provenance_shadow
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/attuned_focus_provenance_shadow.sql
