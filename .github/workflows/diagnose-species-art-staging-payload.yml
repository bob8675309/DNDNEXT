name: Diagnose Species Art Staging Payload

on:
  push:
    branches:
      - agent/species-art-checkpoint1-transfer-v2
    paths:
      - ".github/workflows/diagnose-species-art-staging-payload.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch staging payload branch
        run: git fetch origin agent/species-art-materializer-staging

      - name: Decode staged payload groups
        shell: bash
        run: |
          set -euo pipefail
          payload_branch='origin/agent/species-art-materializer-staging'
          mapfile -t parts < <(git ls-tree -r --name-only "$payload_branch" scripts/species-art-payload | sort)
          printf 'payload_parts=%s\n' "${#parts[@]}"
          test "${#parts[@]}" -gt 0

          inspect_binary() {
            local file="$1"
            local label="$2"
            printf '\n=== %s ===\n' "$label"
            file "$file"
            printf 'bytes=%s git_blob=%s\n' "$(stat -c %s "$file")" "$(git hash-object "$file")"
            if unzip -t "$file" >/dev/null 2>&1; then
              local out="/tmp/unpack-${label//[^A-Za-z0-9]/-}"
              rm -rf "$out"
              mkdir -p "$out"
              unzip -q "$file" -d "$out"
              find "$out" -type f -print0 | sort -z | while IFS= read -r -d '' child; do
                printf '%s  %s  %s bytes\n' "$(git hash-object "$child")" "${child#"$out"/}" "$(stat -c %s "$child")"
              done
            fi
          }

          # The staging directory contains one multi-part base-set archive (000-004)
          # and a later independently padded part (005). Inspect both independently.
          : > /tmp/base-set-main.b64
          for part in "${parts[@]}"; do
            printf 'part=%s size=%s head=%s tail=%s\n' \
              "$part" \
              "$(git cat-file -s "$payload_branch:$part")" \
              "$(git show "$payload_branch:$part" | head -c 12)" \
              "$(git show "$payload_branch:$part" | tail -c 12)"
            case "$part" in
              *part000.b64|*part001.b64|*part002.b64|*part003.b64|*part004.b64)
                git show "$payload_branch:$part" >> /tmp/base-set-main.b64
                ;;
            esac
          done
          base64 --decode /tmp/base-set-main.b64 > /tmp/base-set-main.bin
          inspect_binary /tmp/base-set-main.bin base-set-main

          if git cat-file -e "$payload_branch:scripts/species-art-payload/base-set.part005.b64" 2>/dev/null; then
            git show "$payload_branch:scripts/species-art-payload/base-set.part005.b64" | base64 --decode > /tmp/base-set-part005.bin
            inspect_binary /tmp/base-set-part005.bin base-set-part005
          fi

      - name: Approved Checkpoint 1 reference hashes
        shell: bash
        run: |
          cat <<'EOF'
          expected cinematic-human.webp ce44502cc68d26ec58e3048215035757036fe728
          expected cinematic-aarakocra.webp 4259126500d3082782981839bbb1421745245334
          expected cinematic-elf.webp 9ec8cbcd74f329cc1307270a5d93712917be62ec
          expected cinematic-half-orc.webp 68a522fb7dcbcd3d6fa96f3bb5f579334eab85e6
          expected cinematic-halfling.webp 6c1e19406f3949971fac26723b32d1c6d5db76b0
          EOF
