name: Diagnose Species Art Reachable Blobs

on:
  push:
    branches:
      - agent/species-art-checkpoint1-transfer-v2
    paths:
      - ".github/workflows/diagnose-species-art-staging-payload.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out scratch branch with all refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan reachable Git objects and Species paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          cat > /tmp/expected.tsv <<'EOF'
          ce44502cc68d26ec58e3048215035757036fe728	cinematic-human.webp
          4259126500d3082782981839bbb1421745245334	cinematic-aarakocra.webp
          9ec8cbcd74f329cc1307270a5d93712917be62ec	cinematic-elf.webp
          68a522fb7dcbcd3d6fa96f3bb5f579334eab85e6	cinematic-half-orc.webp
          6c1e19406f3949971fac26723b32d1c6d5db76b0	cinematic-halfling.webp
          EOF

          echo '=== exact approved blob reachability ==='
          while IFS=$'\t' read -r sha name; do
            if git cat-file -e "$sha^{blob}" 2>/dev/null; then
              printf 'FOUND %s %s size=%s\n' "$sha" "$name" "$(git cat-file -s "$sha")"
            else
              printf 'MISSING %s %s\n' "$sha" "$name"
            fi
          done < /tmp/expected.tsv

          echo '=== matching Species paths across remote branches ==='
          while IFS= read -r ref; do
            rows="$(git ls-tree -r "$ref" -- \
              public/media/species/cinematic-human.webp \
              public/media/species/cinematic-aarakocra.webp \
              public/media/species/cinematic-elf.webp \
              public/media/species/cinematic-half-orc.webp \
              public/media/species/cinematic-halfling.webp 2>/dev/null || true)"
            if [ -n "$rows" ]; then
              while IFS= read -r row; do
                printf '%s %s\n' "$ref" "$row"
              done <<< "$rows"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin | sort)
