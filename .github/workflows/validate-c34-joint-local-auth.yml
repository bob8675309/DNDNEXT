name: C34 real signed PG17 GoTrue Story nonce and inventory integration

on:
  pull_request:
    paths:
      - 'scripts/integration/c34/**'
      - 'scripts/fixtures/c33_forge_privacy_original_policy_join_pg17.sql'
      - 'scripts/fixtures/p1_3_npc_visible_sheet_original_functions_pg17.sql'
      - 'sql/candidates/20261104_npc_player_safe_profile_rls_v1.sql'
      - 'sql/candidates/20261104_npc_gm_dossier_column_acl_stage2.sql'
      - 'sql/candidates/20261104_gm_vs_player_backstory_secrets_stage3.sql'
      - 'sql/candidates/20261105_player_creation_immutable_intent_v1.sql'
      - 'sql/candidates/20261105_inventory_character_owner_constraint_and_dml_review_v1.sql'
      - 'sql/candidates/20261109_player_story_complete_intent_i1c_research.sql'
      - '.github/workflows/validate-c34-joint-local-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-real-original-research:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      PGHOST: '127.0.0.1'
      PGPORT: '54322'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      DNDNEXT_I1C_LOCAL_CONFIRM: DISPOSABLE_LOCAL_GOTRUE_PG17_ONLY
      DNDNEXT_C34_LOCAL_CONFIRM: DISPOSABLE_LOCAL_GOTRUE_PG17_ONLY
    steps:
      - name: Checkout current research head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check exact source provenance and local-only JS syntax
        run: |
          node scripts/integration/c34/validate_source_contract.mjs --json
          node scripts/integration/c34/validate_joint_fixture_blobs.mjs
          node --check scripts/integration/c34/fixtures/original_i1c_forge_private_story_nonce_local_auth.mjs
          node --check scripts/integration/c34/test_joint_pg17_local_auth.mjs
          node --test scripts/integration/c34/test_source_contract.mjs
      - name: Install lockfile-pinned application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare disposable Supabase PostgreSQL 17 and GoTrue project
        run: |
          mkdir -p "$RUNNER_TEMP/c34-original-joint/supabase"
          cat > "$RUNNER_TEMP/c34-original-joint/supabase/config.toml" <<'TOML'
          project_id = "c34-original-joint-disposable"
          [db]
          port = 54322
          major_version = 17
          [auth.email]
          enable_confirmations = false
          TOML
      - name: Start local-only GoTrue, PostgREST, and PG17
        run: |
          cd "$RUNNER_TEMP/c34-original-joint"
          npx --yes supabase@2.120.0 start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Run source-original signed I1C then new inventory RED/GREEN co-residence
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGPORT" = '54322'
          test "$PGDATABASE" = 'postgres'
          test "$DNDNEXT_C34_LOCAL_CONFIRM" = DISPOSABLE_LOCAL_GOTRUE_PG17_ONLY
          (cd "$RUNNER_TEMP/c34-original-joint" && npx --yes supabase@2.120.0 status -o env) > "$RUNNER_TEMP/c34-local-env"
          set -a
          source "$RUNNER_TEMP/c34-local-env"
          set +a
          export DNDNEXT_I1C_LOCAL_URL='http://127.0.0.1:54321'
          export DNDNEXT_I1C_LOCAL_ANON_KEY="$ANON_KEY"
          export DNDNEXT_C34_LOCAL_URL='http://127.0.0.1:54321'
          export DNDNEXT_C34_LOCAL_ANON_KEY="$ANON_KEY"
          psql -X -v ON_ERROR_STOP=1 -v DNDNEXT_C33_PRIVACY_STAGE3_CREATOR=1 \
            -f scripts/integration/c34/fixtures/forge_creation_replay_local_auth_pr351_pg17.sql
          psql -X -v ON_ERROR_STOP=1 \
            -f scripts/fixtures/c33_forge_privacy_original_policy_join_pg17.sql
          node scripts/integration/c34/fixtures/original_i1c_forge_private_story_nonce_local_auth.mjs
          node scripts/integration/c34/test_joint_pg17_local_auth.mjs
      - name: Discard local databases and credentials
        if: always()
        run: |
          cd "$RUNNER_TEMP/c34-original-joint"
          npx --yes supabase@2.120.0 stop --no-backup || true
