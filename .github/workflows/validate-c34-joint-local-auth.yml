          test ! -e pages/__c34_t33_npc_probe.jsx
          node --check scripts/integration/c34/test_t33_town_stage2_signed_browser.mjs
          node scripts/integration/c34/test_t33_town_stage2_signed_browser.mjs
          test ! -e pages/__c34_t33_auth_probe.jsx
          test ! -e pages/__c34_t33_npc_probe.jsx
          echo 'PASS T33: genuine current Next/Chromium town Stage2 safe GM DM browser; research only'
      - name: T34 signed source-original campaign GM DM versus technical site Admin-only isolation (disposable)
        shell: bash
        run: |
          set -euo pipefail
          test "$CI" = true
          test "$GITHUB_ACTIONS" = true
          test "$PGHOST" = 127.0.0.1
          test "$PGPORT" = 54322
          test "$DNDNEXT_C34_LOCAL_CONFIRM" = DISPOSABLE_LOCAL_GOTRUE_PG17_ONLY
