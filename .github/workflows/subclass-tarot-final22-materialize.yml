name: Complete subclass Tarot deck wiring

on:
  push:
    branches:
      - agent/subclass-tarot-final22-transfer-20260917
    paths:
      - .github/workflows/subclass-tarot-final22-materialize.yml

permissions:
  contents: write

jobs:
  wire-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout intended artwork branch
        uses: actions/checkout@v4
        with:
          ref: agent/subclass-tarot-approved-batch-20260916
          fetch-depth: 0

      - name: Guard exact artwork head
        shell: bash
        run: |
          set -euo pipefail
          expected="f79970d81f9702cef5816a1d0f3a2a3416edb977"
          actual="$(git rev-parse HEAD)"
          echo "Expected target head: $expected"
          echo "Actual target head:   $actual"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Wire all final approved subclass cards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('utils/classes/subclassArtwork.js')
          text = path.read_text()
          replacements = {
          '''  barbarian: Object.freeze({
              berserker: "berserker",
              "wild-heart": "wild-heart",
              "world-tree": "world-tree",
              zealot: "zealot",
            }),''': '''  barbarian: Object.freeze({
              "ancestral-guardian": "ancestral-guardian",
              battlerager: "battlerager",
              beast: "beast",
              berserker: "berserker",
              giant: "giant",
              "storm-herald": "storm-herald",
              "totem-warrior": "totem-warrior",
              "wild-heart": "wild-heart",
              "wild-magic": "wild-magic",
              "world-tree": "world-tree",
              zealot: "zealot",
            }),''',
          '''    spirits: "spirits",
              valor: "valor",
              whispers: "whispers",''': '''    spirits: "spirits",
              swords: "swords",
              valor: "valor",
              whispers: "whispers",''',
          '''    "psi-warrior": "psi-warrior",
              "rune-knight": "rune-knight",''': '''    "psi-warrior": "psi-warrior",
              "rune-knight": "rune-knight",
              samurai: "samurai",''',
          '''  monk: Object.freeze({
              "drunken-master": "drunken-master",
              elements: "elements",
              kensei: "kensei",
              mercy: "mercy",
              "open-hand": "open-hand",
              shadow: "shadow",
            }),''': '''  monk: Object.freeze({
              "ascendant-dragon": "ascendant-dragon",
              "astral-self": "astral-self",
              "drunken-master": "drunken-master",
              elements: "elements",
              "four-elements": "four-elements",
              kensei: "kensei",
              "long-death": "long-death",
              mercy: "mercy",
              "open-hand": "open-hand",
              shadow: "shadow",
              "sun-soul": "sun-soul",
            }),''',
          '''  "monster-hunter": Object.freeze({
              "carver-guild": "carver-guild",
              "devourer-guild": "devourer-guild",
              "occultist-guild": "occultist-guild",
              "trapper-guild": "trapper-guild",
            }),
            paladin: Object.freeze({''': '''  "monster-hunter": Object.freeze({
              "carver-guild": "carver-guild",
              "devourer-guild": "devourer-guild",
              "occultist-guild": "occultist-guild",
              "trapper-guild": "trapper-guild",
            }),
            mystic: Object.freeze({
              avatar: "avatar",
              awakened: "awakened",
              immortal: "immortal",
              nomad: "nomad",
              "soul-knife": "soul-knife",
              "wu-jen": "wu-jen",
            }),
            paladin: Object.freeze({''',
          '''  paladin: Object.freeze({
              ancients: "ancients",
              conquest: "conquest",
              devotion: "devotion",
              glory: "glory",
              "noble-genies": "noble-genies",
              oathbreaker: "oathbreaker",
              redemption: "redemption",
              vengeance: "vengeance",
            }),''': '''  paladin: Object.freeze({
              ancients: "ancients",
              conquest: "conquest",
              crown: "crown",
              devotion: "devotion",
              glory: "glory",
              "noble-genies": "noble-genies",
              oathbreaker: "oathbreaker",
              redemption: "redemption",
              vengeance: "vengeance",
              watchers: "watchers",
            }),''',
          }
          for old, new in replacements.items():
              count = text.count(old)
              assert count == 1, (old[:80], count)
              text = text.replace(old, new)
          text = text.replace(
              '// Only Paul-approved normalized tarot cards are mapped here. Subclasses still in\n// production continue to use the class-menu artwork fallback until individually\n// approved, installed, and added to this resolver.',
              '// All current runtime-visible subclasses approved by Paul are mapped to the completed\n// 7:12 Tarot deck. The class-menu fallback remains only for genuinely unknown/future content.'
          )
          path.write_text(text)
          PY

      - name: Update focused subclass-art validator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_class_subclass_browser.mjs')
          text = path.read_text()
          replacements = {
          '// 2026-09-16 approved normalized tarot install: explicitly mapped cards use the\n// installed 7:12 deck while every unfinished subclass retains the class-art fallback.':
          '// 2026-09-17 completed normalized Tarot install: every current runtime-visible\n// subclass has approved dedicated art; the fallback remains only for unknown/future content.',
          '  barbarian: ["berserker", "wild-heart", "world-tree", "zealot"],':
          '  barbarian: ["ancestral-guardian", "battlerager", "beast", "berserker", "giant", "storm-herald", "totem-warrior", "wild-heart", "wild-magic", "world-tree", "zealot"],',
          '  bard: ["creation", "dance", "eloquence", "glamour", "lore", "moon", "spirits", "valor", "whispers"],':
          '  bard: ["creation", "dance", "eloquence", "glamour", "lore", "moon", "spirits", "swords", "valor", "whispers"],',
          '  fighter: ["arcane-archer", "banneret", "battle-master", "cavalier", "champion", "echo-knight", "eldritch-knight", "purple-dragon-knight-banneret", "psi-warrior", "rune-knight"],':
          '  fighter: ["arcane-archer", "banneret", "battle-master", "cavalier", "champion", "echo-knight", "eldritch-knight", "purple-dragon-knight-banneret", "psi-warrior", "rune-knight", "samurai"],',
          '  monk: ["drunken-master", "elements", "kensei", "mercy", "open-hand", "shadow"],':
          '  monk: ["ascendant-dragon", "astral-self", "drunken-master", "elements", "four-elements", "kensei", "long-death", "mercy", "open-hand", "shadow", "sun-soul"],',
          '  "monster-hunter": ["carver-guild", "devourer-guild", "occultist-guild", "trapper-guild"],':
          '  "monster-hunter": ["carver-guild", "devourer-guild", "occultist-guild", "trapper-guild"],\n  mystic: ["avatar", "awakened", "immortal", "nomad", "soul-knife", "wu-jen"],',
          '  paladin: ["ancients", "conquest", "devotion", "glory", "noble-genies", "oathbreaker", "redemption", "vengeance"],':
          '  paladin: ["ancients", "conquest", "crown", "devotion", "glory", "noble-genies", "oathbreaker", "redemption", "vengeance", "watchers"],',
          'assert(approvedTarotCount === 130, `Expected 130 installed approved normalized tarot concepts, found ${approvedTarotCount}.`);':
          'assert(approvedTarotCount === 152, `Expected 152 installed approved normalized tarot concepts, found ${approvedTarotCount}.`);',
          'all 130 approved normalized tarot concepts are installed and mapped, and unmatched content retains the safe class-art fallback.':
          'all 152 approved normalized tarot concepts are installed and mapped, the 149 current runtime-visible choices have dedicated approved coverage, and unmatched future content retains the safe class-art fallback.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              assert count == 1, (old[:100], count)
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Write final 149-card checklist
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/CHARACTER_FORGE_TAROT_SUBCLASS_ARTWORK_CHECKLIST.md <<'EOF'
          # Character Forge Tarot Subclass Artwork Checklist

          Status date: 2026-09-17

          This checklist tracks the production-visible Tarot deck, not the historical preferred-source concept count.

          ## Completion authority

          Historical normalized checkpoint:

          - **109 approved preferred-source concepts** were the earlier normalized milestone.
          - That number remains provenance only and is not the production completion target.

          Current completed artwork-branch state:

          - runtime-visible choices: **149**;
          - dedicated-card target: **149**;
          - runtime-visible choices with approved dedicated Tarot coverage: **149**;
          - known current runtime-visible choices resolving to generic/class fallback: **0**;
          - normalized installed Tarot concepts in the repository ledger: **152**, because the historical normalized set also retains the four suppressed Wizard compatibility identities and approved source aliases remain explicit.

          **Current remaining Tarot card queue: 0.**

          Intentional art sharing remains allowed only when Paul explicitly approves it. Generic class-art fallback does not count as a completed subclass card.

          Read first for future maintenance:

          - `CHARACTER_FORGE_TAROT_SUBCLASS_CARD_STANDARD.md`;
          - `CHARACTER_FORGE_TAROT_SUBCLASS_ART_HANDOFF.md`;
          - `CHARACTER_FORGE_SUBCLASS_ARTWORK_STATUS.md`;
          - `DNDNext_Current_Handoff_Prompt.md`.

          ## Wizard compatibility note

          The historical Wizard normalized ledger contains 18 identities. Runtime compatibility suppresses four duplicate/reprint identities from the visible carousel:

          - Abjuration
          - Divination
          - Evocation
          - Illusion

          Their normalized assets/mappings remain repository history. They are not missing production cards and must not be re-added to the visible missing-card queue solely because the historical Wizard cardinality is higher than the runtime-visible Wizard set.

          ## 2026-09-16 installed/validated artwork batch — 21

          - Bard: Creation, Eloquence, Whispers
          - Fighter: Arcane Archer, Cavalier, Echo Knight, Purple Dragon Knight (Banneret), Rune Knight
          - Monk: Drunken Master, Kensei
          - Paladin: Conquest, Oathbreaker, Redemption
          - Ranger: Drakewarden, Horizon Walker, Monster Slayer, Swarmkeeper
          - Rogue: Inquisitive, Mastermind, Scout, Swashbuckler

          Mastermind is complete and must not be re-queued unless Paul explicitly requests a replacement.

          ## 2026-09-17 final completion batch — 22

          All of the following received explicit individual/batch approval from Paul, were normalized to canonical 7:12 **840x1440 WebP**, installed under canonical subclass paths, wired to their exact runtime-visible identities, and are covered by the focused subclass validator.

          ### Barbarian — 7

          - [x] Ancestral Guardian
          - [x] Battlerager
          - [x] Beast
          - [x] Giant
          - [x] Storm Herald
          - [x] Totem Warrior
          - [x] Wild Magic

          Final-review notes:

          - Giant uses the approved revised weapon artwork.
          - Totem Warrior uses the approved final composition with the purple footer-emblem fill removed.

          ### Bard — 1

          - [x] Swords

          ### Fighter — 1

          - [x] Samurai

          ### Monk — 5

          - [x] Ascendant Dragon
          - [x] Astral Self
          - [x] Four Elements
          - [x] Long Death
          - [x] Sun Soul

          ### Mystic — 6

          - [x] Avatar
          - [x] Awakened
          - [x] Immortal
          - [x] Nomad
          - [x] Soul Knife
          - [x] Wu Jen

          Final-review notes:

          - Avatar uses the stronger revised presentation.
          - Nomad uses the revised, more-covered costume composition.
          - Long Death uses the revision with less-prominent hair.
          - Soul Knife uses Paul's explicitly selected final image from the last review.
          - Wu Jen uses Paul's explicitly selected final image from the last review.

          ### Paladin — 2

          - [x] Crown
          - [x] Watchers

          Watchers uses the approved final revised species/composition.

          **Final completion batch: 22.**

          ## Runtime fallback queue — 0

          The current 149 runtime-visible subclass choices all have approved dedicated Tarot coverage. The resolver retains a class-art fallback only as a safety net for genuinely unknown or future catalogue content.

          Re-audit the actual runtime-visible set whenever subclass catalogue/compatibility behavior changes. Do not assume 149 is permanent if new playable subclass identities are later imported.

          ## Card completion rule

          For any future visible subclass:

          1. Confirm the exact visible identity against current Forge runtime/catalogue behavior.
          2. Paul reviews and approves the individual artwork.
          3. Anatomy, hands, weapons, props, companions, and species details pass QA.
          4. The card follows the canonical 7:12 full-bleed template.
          5. Final export is 840x1440 WebP.
          6. Install under `public/media/subclasses/<class-key>/`.
          7. Wire the exact visible identity in `utils/classes/subclassArtwork.js`, unless an intentional alias was explicitly approved.
          8. Confirm the choice no longer silently falls back to generic class art.
          9. Run focused validation.
          10. Check an intentional Vercel Preview when browser validation is needed.

          ## Art standard summary

          - 7:12 aspect ratio.
          - 840x1440 WebP final export.
          - Full-bleed illustration through title/emblem area.
          - No opaque footer or separate title band.
          - Fixed reusable antique-gold frame/title/emblem geometry.
          - Restrained lower readability gradient.
          - Crisp cinematic fantasy realism.
          - Deliberate species/gender/presentation/pose/environment diversity.
          - Prefer underused Forge species when the subclass fantasy supports them.
          - Vary facing direction, camera angle, focal point, action, weather, environment, and color temperature across the deck.
          - Mandatory full-resolution anatomy/prop/species QA.

          Detailed authority: `CHARACTER_FORGE_TAROT_SUBCLASS_CARD_STANDARD.md`.

          ## Production/Preview rule

          Work from current `main` or an explicitly current artwork branch. PR #187 is historical/working context, not production authority.

          Ordinary `agent/*` commits skip full Vercel Preview builds. Use `[deploy-preview]` only on the exact commit requiring browser review.

          ## Protected boundaries

          Subclass art is presentation-only. No Supabase write/migration is required. Do not touch world-map/town-map behavior, travel/routes/weather/camps/clock, crafting, inventory, merchants, economy, encounter/tactical authority, or unrelated character runtime while maintaining this deck.
          EOF
          sed -i 's/^          //' docs/CHARACTER_FORGE_TAROT_SUBCLASS_ARTWORK_CHECKLIST.md

      - name: Guard exact three-file text diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          docs/CHARACTER_FORGE_TAROT_SUBCLASS_ARTWORK_CHECKLIST.md
          scripts/validate_class_subclass_browser.mjs
          utils/classes/subclassArtwork.js
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Run focused subclass validator
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate_class_subclass_browser.mjs

      - name: Commit and push completed deck
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CHARACTER_FORGE_TAROT_SUBCLASS_ARTWORK_CHECKLIST.md scripts/validate_class_subclass_browser.mjs utils/classes/subclassArtwork.js
          git commit -m "Complete 149-card subclass Tarot deck [deploy-preview]"
          git push origin HEAD:agent/subclass-tarot-approved-batch-20260916
