name: Fix profile reconciliation docs

on:
  push:
    branches:
      - agent/reconcile-profile-layout-and-docs

permissions:
  contents: write

jobs:
  fix-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reconcile-profile-layout-and-docs
      - name: Correct milestone status placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/Current_Development_Status_and_Roadmap.md')
          source = path.read_text(encoding='utf-8')

          old = '- Production runtime baseline entering this reconciliation: `6f57b8f5827e5b286bf9b7fa66b1108436c8285d` (PR #147 merge).'
          new = '- Production runtime baseline: current `main`; the last fixed production anchor before this reconciliation was `6f57b8f5827e5b286bf9b7fa66b1108436c8285d` (PR #147 merge).'
          if source.count(old) != 1:
              raise RuntimeError(f'Expected one runtime baseline line, found {source.count(old)}')
          source = source.replace(old, new, 1)

          old_block = '''- No world-map or town/city-map source was changed, and the protected 20/4/9 world baseline remained exact.

Still required before Milestone 2 is complete:

- Account provisioning is complete: the live project now has three Auth users and three player profiles.
- Prepare a fresh staged smoke session on the reusable arena, assign its actors to GM / Player A / Player B, and start it through the guarded durable-start command. Do not rewrite controller ownership on the active Round 6 session.'''
          new_block = '''- No world-map or town/city-map source was changed, and the protected 20/4/9 world baseline remained exact.
- Account provisioning is complete: the live project now has three Auth users and three player profiles.

Still required before Milestone 2 is complete:

- Prepare a fresh staged smoke session on the reusable arena, assign its actors to GM / Player A / Player B, and start it through the guarded durable-start command. Do not rewrite controller ownership on the active Round 6 session.'''
          if source.count(old_block) != 1:
              raise RuntimeError(f'Expected one Milestone 2 account block, found {source.count(old_block)}')
          path.write_text(source.replace(old_block, new_block, 1), encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Current_Development_Status_and_Roadmap.md
          git commit -m "Correct Milestone 2 documentation status"
          git push origin HEAD:agent/reconcile-profile-layout-and-docs
