name: Validate Attuned Tactical Mitigation Shadow
on:
  pull_request:
    paths:
      - "sql/20261025_05_tactical_attuned_mitigation_shadow.sql"
      - "scripts/fixtures/attuned_tactical_mitigation_shadow.sql"
      - "scripts/validate_attuned_tactical_shadow.mjs"
      - ".github/workflows/validate-attuned-tactical-mitigation-shadow.yml"
  workflow_dispatch:
jobs:
  existing-source-and-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate_tactical_equipped_damage_mitigation.mjs
      - run: node scripts/validate_attuned_tactical_shadow.mjs
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: attuned_mitigation_shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d attuned_mitigation_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: attuned_mitigation_shadow
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/attuned_tactical_mitigation_shadow.sql
