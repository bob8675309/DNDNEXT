name: Materialize Forge portal host compatibility fix 20260908

on:
  push:
    branches:
      - agent/forge-portal-host-compat-fix-20260908

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bounded patch source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage patch script outside worktree
        run: cp scripts/materialize_forge_portal_host_compat_fix_20260908.mjs /tmp/materialize_forge_portal_host_compat_fix_20260908.mjs

      - name: Check out exact working branch
        run: |
          git fetch origin agent/realistic-dice-core
          git checkout agent/realistic-dice-core
          git reset --hard origin/agent/realistic-dice-core

      - name: Guard exact target head
        run: |
          test "$(git rev-parse HEAD)" = "15de61684ccb700783219ffba782c297eff4305d"

      - name: Apply bounded compatibility patch and verify scope
        run: |
          node /tmp/materialize_forge_portal_host_compat_fix_20260908.mjs
          git diff --check
          printf '%s\n' \
            components/NewNpcModalV3.js \
            components/PlayerCharacterCreatorV2.js \
            components/PlayerCharacterProfilePanelUnified.js \
            docs/CHARACTER_FORGE_VIEWPORT_PORTAL_FIX.md \
            scripts/validate_npc_page_panel_wrapper_adoption.mjs \
            > /tmp/expected.txt
          git diff --name-only | sort > /tmp/actual.txt
          diff -u <(sort /tmp/expected.txt) /tmp/actual.txt

      - name: Run focused Forge portal regressions
        run: |
          node scripts/validate_npc_page_panel_wrapper_adoption.mjs
          node scripts/validate_character_forge_resilience.mjs
          node scripts/validate_class_hero_framing.mjs
          node scripts/validate_player_forge_source_magic_routing.mjs

      - name: Commit and push exact validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/NewNpcModalV3.js components/PlayerCharacterCreatorV2.js components/PlayerCharacterProfilePanelUnified.js docs/CHARACTER_FORGE_VIEWPORT_PORTAL_FIX.md scripts/validate_npc_page_panel_wrapper_adoption.mjs
          git commit -m "Restore Forge portal host lifecycle"
          git push origin HEAD:agent/realistic-dice-core
