name: Validate character portrait authority

on:
  pull_request:
    branches:
      - main
    paths:
      - "components/NewNpcModalV3.js"
      - "components/NewNpcModalV3Refined.js"
      - "components/NpcForgePortraitPickerModal.js"
      - "components/PlayerCharacterProfilePanelUnified.js"
      - "utils/characterPortraits.js"
      - "scripts/generate_npc_portrait_pack.mjs"
      - "scripts/validate_character_forge_resilience.mjs"
      - "sql/20260804_03_character_forge_resilience_and_tags.sql"
      - "public/npc-portraits/defaults/**"
      - "public/npc-portraits/library/**"
      - "docs/Character_Forge_PR_A_Deployment_Evidence.md"
      - ".github/workflows/validate-character-portrait-authority.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate raster-only portrait and Forge authority
        run: |
          node --check utils/characterPortraits.js
          node --check scripts/validate_character_forge_resilience.mjs
          node scripts/validate_character_forge_resilience.mjs


  import_item_art_batch_01:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'item-art-foundation-batch-01-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out item art branch
        uses: actions/checkout@v4
        with:
          ref: item-art-foundation-batch-01-20261017
          fetch-depth: 0

