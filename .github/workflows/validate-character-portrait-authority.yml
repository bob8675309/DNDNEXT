agonborn-jeweler-20261016.png","url":"https://ucdddfb1c7f8d756ea62c31d2854.dl.dropboxusercontent.com/cd/0/get/DKKk6rE2D_zvu-BbBheknwHSs9wzUY1odmDFaKriHsPmP_SnqiIBWjeA-ihZ4wUazv1d7IuiF_kK1Q3e0omqfyCM2_7cXTeo29d2rsXuy_KpJqkmyPk9qwabbqAo4Z-9dxZ2sO7HpUJOZV7Q_ZpO-TGwXy7ez1YQkBmqKq_oLpNPDw/file?c_luid=c335000c","hash":"81c5c1138f43a54e5de66447cd61bb495cea522574e3a6ad2d5eebccb863404a","size":3339514}]'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, struct, urllib.request
          from pathlib import Path
          manifest=json.loads(os.environ["PORTRAIT_MANIFEST"])
          target=Path("public/npc-portraits/library/merchant-batch-20261016")
          target.mkdir(parents=True,exist_ok=True)
          def dropbox_hash(data):
              block=4*1024*1024
              digests=b"".join(hashlib.sha256(data[i:i+block]).digest() for i in range(0,len(data),block))
              return hashlib.sha256(digests).hexdigest()
          for item in manifest:
              req=urllib.request.Request(item["url"],headers={"User-Agent":"DNDNext-Portrait-Import/1.0"})
              with urllib.request.urlopen(req,timeout=120) as resp:
                  data=resp.read()
              if len(data)!=int(item["size"]): raise SystemExit(f'{item["name"]}: size mismatch')
              if dropbox_hash(data)!=item["hash"]: raise SystemExit(f'{item["name"]}: hash mismatch')
              if data[:8]!=b"\x89PNG\r\n\x1a\n" or data[12:16]!=b"IHDR": raise SystemExit(f'{item["name"]}: invalid PNG')
              w,h=struct.unpack(">II",data[16:24])
              if w<768 or h<1024: raise SystemExit(f'{item["name"]}: too small {w}x{h}')
              if abs((w/h)-0.75)>0.002: raise SystemExit(f'{item["name"]}: not 3:4 ({w}x{h})')
              (target/item["name"]).write_bytes(data)
              print("OK",item["name"],w,h)
