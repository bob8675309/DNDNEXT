kS4CGnQvAtN25lB6bPgupju4BbnI7J04gcpDyn0qp9orBVdY3w/file?c_luid=c335000c"},{"name":"itemart_weapon_bow_plain_01.png","size":675213,"hash":"7be909563925bad04a27025c8f7209a26c87d0b9cf0b0afd065ea98413fdc887","url":"https://uc6c231c905d72eb545546a462d9.dl.dropboxusercontent.com/cd/0/get/DKN6K3NlUN0JtqSetknf4ROvcSIF3u892svGXALkgABNBXx71mZNLHZdhsHF3RU4BfFebnWk2h1aypTF5jItzIwUczeAO-KPytmL6KsE84otC-Ul1G1XAKhxMm6PwraKw-vhd1yMeyjNefu-bDIagUyQBt5KrennsPvwBH7mZg6Phg/file?c_luid=c335000c"},{"name":"itemart_weapon_crossbow_plain_01.png","size":814802,"hash":"c7e734b0cc804401645f0a03c61b1851e21a6ca6048b74965d71e8517886dbd6","url":"https://uc865527f4375bf1127d09e24df8.dl.dropboxusercontent.com/cd/0/get/DKOJGqX82qHbb1sd6BuU_GibNrfhyaXeZfiAykDhFH0MP0je5DDo-W1Z2hO0oymQ6xl-f0qHXh3jSMSBhMBqLDoc1THd-g_55a_64gXLlBD-EleSph53lGgNYUaiH4jw6WQ4-SPZxK4SlbxhRYoFlbfVbM3igiUYS3OaWNS3i7Kkbg/file?c_luid=c335000c"},{"name":"itemart_weapon_staff_plain_01.png","size":683247,"hash":"dc292de21d451fc2b6171a923fd369711d08749486398c204b305aa9320d4946","url":"https://uc4cf6ae36bfe196a93665b5426c.dl.dropboxusercontent.com/cd/0/get/DKMBhmy0aDmnhuV45wlnDXmc10xV7b25VgJaUmVqJ2dpX6rsa6iX8zTdMuruFDMw4FHlc0NroEi4HtZRhBxM7vAbgIW4QPmFz8R54NzN3ZfTHbDBfKJe8OvMxTX6I0vVSW1RqqOeFNIOPtDlplp_tDVeqyTtYCECrwDJEMux-ZWllA/file?c_luid=c335000c"},{"name":"itemart_armor_light_plain_01.png","size":903250,"hash":"b56ef39fd405f69077c55de931a5d3c605f5a1057cd9f48028ebfe1420bc5462","url":"https://ucc59cfee629ba0a487e8c4a8459.dl.dropboxusercontent.com/cd/0/get/DKOize4-y3OraNlBQhMqbfAr7qzPAnbjwxvrSaTJ8xMOpjVTDKpOcemjerUNk9LxgSaaHMnNIaKIJ3Rh5RQkuX99so77f7vsoV-UOabgqLI9HXnXFoGRn0DYvKyuJpRiKgrd_k-GgddQH-qCISKBFLv69m053rcRsliDVkNWRVmHnw/file?c_luid=c335000c"},{"name":"itemart_armor_medium_plain_01.png","size":1026325,"hash":"02cbc988a79662691ab495b01871b0d4986b38d8b3487e235be624e3bb6f0910","url":"https://uc8c6fa3665ce8c1cfbb3eec1633.dl.dropboxusercontent.com/cd/0/get/DKMUOd273fL8wYWbp7coXu7ACLSHVUGgBBwkLCBkDGLuYHCembWPHoACqRZ2mqcIAf21lfx9ujG0gfWYhov-_h2qwoD1cvIjfKQ9qrGGH1SKLqSXHDu1ntgG_wZwiZTrVPVruiDt68_GMk-yDrln09r_aBdcuHlSm7O2680i4b6ysA/file?c_luid=c335000c"}]'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, struct, urllib.request
          from pathlib import Path

          manifest = json.loads(os.environ["ITEM_ART_MANIFEST"])
          target = Path("public/item-art/masters/batch-01")
          target.mkdir(parents=True, exist_ok=True)

          def dropbox_hash(data: bytes) -> str:
              block = 4 * 1024 * 1024
              digests = b"".join(hashlib.sha256(data[i:i+block]).digest() for i in range(0, len(data), block))
              return hashlib.sha256(digests).hexdigest()

          for item in manifest:
              req = urllib.request.Request(item["url"], headers={"User-Agent":"DNDNext-Item-Art-Import/1.0"})
              with urllib.request.urlopen(req, timeout=120) as resp:
                  data = resp.read()
              if len(data) != int(item["size"]):
                  raise SystemExit(f'{item["name"]}: size mismatch')
              if dropbox_hash(data) != item["hash"]:
                  raise SystemExit(f'{item["name"]}: Dropbox content hash mismatch')
              if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise SystemExit(f'{item["name"]}: invalid PNG')
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != (1024, 1024):
                  raise SystemExit(f'{item["name"]}: expected 1024x1024, got {width}x{height}')
              (target / item["name"]).write_bytes(data)
              print(f'OK {item["name"]}: {width}x{height} {len(data)} bytes')
          PY

      - name: Commit only verified item art
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain --untracked-files=all | awk '$2 !~ /^public\/item-art\/masters\/batch-01\// {print}')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected working tree changes:"
            echo "$unexpected"
            exit 1
          fi
          git add public/item-art/masters/batch-01
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add foundational item art batch 01"
          git push origin HEAD:item-art-foundation-batch-01-20261017
