name: Validate PR170 browser smoke corrections

on:
  pull_request:
    branches:
      - main
    paths:
      - "components/CharacterAstralTrancePanel.js"
      - "components/CharacterSheetRestSyncBridge.js"
      - "components/ClassFeatureText.js"
      - "components/NpcForgeClassFeatureDock.js"
      - "components/NpcForgeClassGuide.js"
      - "components/NpcForgeClassGuideModel.js"
      - "components/NpcForgeContextPanelRefined.js"
      - "components/NpcForgeSourceChoiceFields.js"
      - "components/NpcForgeSpeciesBonusPanel.js"
      - "components/SourceChoiceFields.js"
      - "hooks/useNpcSheetActionData.js"
      - "pages/login.js"
      - "pages/_app.js"
      - "styles/character-forge-smoke-fixes.css"
      - "utils/artificerPlanChoices.js"
      - "utils/classes/subclassCompatibility.js"
      - "utils/playerForgeFeatChoiceRouting.js"
      - "utils/playerForgeSpeciesRuntimeChoices.js"
      - "sql/20260810_90_rest_class_feature_restoration.sql"
      - "scripts/node_relative_js_loader.mjs"
      - "scripts/validate_pr170_browser_smoke_corrections.mjs"
      - ".github/workflows/validate-pr170-browser-smoke-corrections.yml"
  push:
    branches:
      - "agent/character-forge-resilience-presentation"
    paths:
      - "components/CharacterAstralTrancePanel.js"
      - "components/CharacterSheetRestSyncBridge.js"
      - "components/ClassFeatureText.js"
      - "components/NpcForgeClassFeatureDock.js"
      - "components/NpcForgeClassGuide.js"
      - "components/NpcForgeClassGuideModel.js"
      - "components/NpcForgeContextPanelRefined.js"
      - "components/NpcForgeSourceChoiceFields.js"
      - "components/NpcForgeSpeciesBonusPanel.js"
      - "components/SourceChoiceFields.js"
      - "hooks/useNpcSheetActionData.js"
      - "pages/login.js"
      - "pages/_app.js"
      - "styles/character-forge-smoke-fixes.css"
      - "utils/artificerPlanChoices.js"
      - "utils/classes/subclassCompatibility.js"
      - "utils/playerForgeFeatChoiceRouting.js"
      - "utils/playerForgeSpeciesRuntimeChoices.js"
      - "sql/20260810_90_rest_class_feature_restoration.sql"
      - "scripts/node_relative_js_loader.mjs"
      - "scripts/validate_pr170_browser_smoke_corrections.mjs"
      - ".github/workflows/validate-pr170-browser-smoke-corrections.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate smoke correction contracts
        run: node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_pr170_browser_smoke_corrections.mjs

      - name: Run production build gate
        run: node scripts/vercel_build_v2.mjs
