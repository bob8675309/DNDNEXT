name: Validate Compact Rule Reference Glossary
on:
  pull_request:
    paths:
      - "utils/itemRuleReferences.js"
      - "utils/spellRuleReferences.js"
      - "components/NpcForgeClassFeatureDock.js"
      - "scripts/validate_compact_rule_reference_glossary.mjs"
      - ".github/workflows/validate-compact-rule-references.yml"
  push:
    branches: [main]
    paths:
      - "utils/itemRuleReferences.js"
      - "utils/spellRuleReferences.js"
      - "components/NpcForgeClassFeatureDock.js"
      - "scripts/validate_compact_rule_reference_glossary.mjs"
      - ".github/workflows/validate-compact-rule-references.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate_compact_rule_reference_glossary.mjs
