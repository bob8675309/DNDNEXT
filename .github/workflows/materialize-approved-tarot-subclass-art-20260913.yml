name: Materialize approved tarot subclass art 20260913

on:
  push:
    branches:
      - agent/tarot-approved-materialize-20260913

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact target branch
        uses: actions/checkout@v4
        with:
          ref: agent/subclass-carousel-selector-20260911
          fetch-depth: 0

      - name: Guard exact target head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "81aa6941aff4649118c84d39ce71b3b26128709f"

      - name: Download approved normalized tarot payload
        shell: bash
        env:
          PAYLOAD_URL: "https://uc187072029534619bb913b2b9f9.dl.dropboxusercontent.com/cd/0/get/DIDsrfMWk9B_C9YNJriV4BCK6b-xW_asxzXQLuUvKNar822H-jMIevigAXyx7yU3gwnX9MnaHFIfQycPqLDbBhvlHn7AfA2HZo3TTM0kcTyGoIM8dfSjyi9O__we5C-LazJ43C7qdq6ml4b0Fg3wdE-GUo6G2N0ztWRCSzrJiEmaqA/file?c_luid=c335000c"
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-delay 2 "$PAYLOAD_URL" --output /tmp/tarot.zip
          echo "a14229e70ae622374f4eace5f9580f8c0d1b3618a974f687c4312eabc53dd130  /tmp/tarot.zip" | sha256sum -c -
          rm -rf /tmp/tarot-payload
          mkdir -p /tmp/tarot-payload
          unzip -q /tmp/tarot.zip -d /tmp/tarot-payload
          cd /tmp/tarot-payload
          sha256sum -c SHA256SUMS
          test "$(find public/media/subclasses -type f -name '*.webp' | wc -l)" -eq 34
          test "$(python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('MANIFEST.json').read_text())
          assert len(rows) == 34
          assert len({row['dest'] for row in rows}) == 34
          assert all(row.get('width') == 840 and row.get('height') == 1440 for row in rows)
          print(len(rows))
          PY
          )" = "34"

      - name: Apply exact approved artwork scope
        shell: bash
        run: |
          set -euo pipefail
          cp -R /tmp/tarot-payload/public/media/subclasses/. public/media/subclasses/
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('/tmp/tarot-payload/MANIFEST.json').read_text())
          paths = sorted(row['dest'] for row in rows)
          Path('/tmp/expected.txt').write_text('\n'.join(paths) + '\n')
          PY
          git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort > /tmp/changed.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit and push exact artwork batch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/subclass-carousel-selector-20260911
          test "$(git rev-parse origin/agent/subclass-carousel-selector-20260911)" = "81aa6941aff4649118c84d39ce71b3b26128709f"
          git config user.name "DNDNext Artwork Materializer"
          git config user.email "actions@users.noreply.github.com"
          while IFS= read -r path; do git add -- "$path"; done < /tmp/expected.txt
          git diff --cached --name-only | sort > /tmp/staged.txt
          diff -u /tmp/expected.txt /tmp/staged.txt
          test "$(wc -l < /tmp/staged.txt)" -eq 34
          git commit -m "Install approved normalized tarot subclass artwork"
          git push origin HEAD:agent/subclass-carousel-selector-20260911
