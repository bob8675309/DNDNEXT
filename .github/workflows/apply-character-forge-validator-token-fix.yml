name: Apply Character Forge validator token fix

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/apply_character_forge_validator_token_fix.py"
      - ".github/workflows/apply-character-forge-validator-token-fix.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.head_ref == 'agent/character-forge-resilience-presentation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/character-forge-resilience-presentation
          fetch-depth: 0

      - name: Apply asserted validator correction
        run: python tools/apply_character_forge_validator_token_fix.py

      - name: Remove normal-file helper
        run: rm -f tools/apply_character_forge_validator_token_fix.py

      - name: Commit validator correction only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows'
          git diff --cached --check
          git commit -m "Reconcile NPC Forge story validator token"
          git push origin HEAD:agent/character-forge-resilience-presentation
