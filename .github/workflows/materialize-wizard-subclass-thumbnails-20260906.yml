name: Materialize Wizard subclass thumbnails 2026-09-06

on:
  push:
    branches:
      - agent/class-subclass-compact-art-20260906

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/class-subclass-compact-art-20260906
          fetch-depth: 2

      - name: Guard exact starting head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c344fbd417a56b6f3f08f711bec0a870bd305eff"

      - name: Download and verify approved artwork bundle
        shell: bash
        env:
          DROPBOX_URL: "https://uc0b3d70e65766db1c5ff0433cef.dl.dropboxusercontent.com/cd/0/get/DHorERA08Zvnt2CMPgFmCOt6R47o9laZkWVP5GGHAlocsHumk4GNgc5nbNQ-VZ94esS74H233ljThlj6Q8iwPjK8KVP4o9-0T7WjLaEEdKCVQqdy50IvdHSicsTnDM2REVdQJbxpV0xD_lu-pZK6iKaz/file?c_luid=c335000c"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$DROPBOX_URL" -o /tmp/wizard-subclasses.zip
          echo "6d9e7f45b50c6036aa219bd70dc4772ac30fcb5e9e787a1a7df4b3c644e42da7  /tmp/wizard-subclasses.zip" | sha256sum -c -
          rm -rf /tmp/wizard-subclasses
          mkdir -p /tmp/wizard-subclasses
          unzip -q /tmp/wizard-subclasses.zip -d /tmp/wizard-subclasses

          expected=$(cat <<'EOF'
          public/media/subclasses/wizard/wizard-abjuration.webp
          public/media/subclasses/wizard/wizard-conjuration.webp
          public/media/subclasses/wizard/wizard-divination.webp
          public/media/subclasses/wizard/wizard-enchantment.webp
          public/media/subclasses/wizard/wizard-evocation.webp
          public/media/subclasses/wizard/wizard-illusion.webp
          public/media/subclasses/wizard/wizard-necromancy.webp
          public/media/subclasses/wizard/wizard-transmutation.webp
          EOF
          )
          actual=$(cd /tmp/wizard-subclasses && find public -type f | sort)
          test "$actual" = "$expected"

          cat > /tmp/wizard-subclasses.sha256 <<'EOF'
          ebcd930fd8a48371dda99222ffe6fd4e7d743fa26ce08d4084f3b6e5c204144c  public/media/subclasses/wizard/wizard-abjuration.webp
          a1a0b9cf9b69c6c518345f9a684377ea4c294f183ff826de6f790dc41901af8f  public/media/subclasses/wizard/wizard-conjuration.webp
          10b3f5217f49f6b26765b1bb88681a7cfa3bf6b7cfd2d7433c65517fa21673c3  public/media/subclasses/wizard/wizard-divination.webp
          3f6d5adc0fef624133ac08754a86a3fc14ed7ca578975d823c8e85c805c25c05  public/media/subclasses/wizard/wizard-enchantment.webp
          ece7ecf51119c103536950f326f89ea437f934d1fb354c58ccd858a831194c32  public/media/subclasses/wizard/wizard-evocation.webp
          0c020694e609072861db23d9de80083feb6a434e4b233a569debb306803a8b92  public/media/subclasses/wizard/wizard-illusion.webp
          c2a868c72179fc1e1b7e4b8f544b41ef17ff7f8cbcfef55ef5fd033f2db6e742  public/media/subclasses/wizard/wizard-necromancy.webp
          9bf727c1db3c5064c57da7960e45a0a01002601292fb3d50b47ad1134c035474  public/media/subclasses/wizard/wizard-transmutation.webp
          EOF
          (cd /tmp/wizard-subclasses && sha256sum -c /tmp/wizard-subclasses.sha256)

          while IFS= read -r path; do
            kind=$(file -b "/tmp/wizard-subclasses/$path")
            echo "$path :: $kind"
            echo "$kind" | grep -Eqi 'Web/P|WebP'
            echo "$kind" | grep -q '240x112'
          done <<< "$expected"

      - name: Install exact artwork paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media/subclasses/wizard
          cp /tmp/wizard-subclasses/public/media/subclasses/wizard/*.webp public/media/subclasses/wizard/
          expected=$(cat <<'EOF'
          public/media/subclasses/wizard/wizard-abjuration.webp
          public/media/subclasses/wizard/wizard-conjuration.webp
          public/media/subclasses/wizard/wizard-divination.webp
          public/media/subclasses/wizard/wizard-enchantment.webp
          public/media/subclasses/wizard/wizard-evocation.webp
          public/media/subclasses/wizard/wizard-illusion.webp
          public/media/subclasses/wizard/wizard-necromancy.webp
          public/media/subclasses/wizard/wizard-transmutation.webp
          EOF
          )
          actual=$(git status --short | awk '{print $2}' | sort)
          test "$actual" = "$expected"

      - name: Commit approved thumbnails
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/subclasses/wizard/*.webp
          git diff --cached --check
          git commit -m "Add Wizard subclass selector thumbnails"
          git push origin HEAD:agent/class-subclass-compact-art-20260906
