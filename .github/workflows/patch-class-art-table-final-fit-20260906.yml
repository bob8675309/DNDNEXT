name: Patch Class art and table final fit 2026-09-06

on:
  push:
    branches:
      - agent/class-art-table-final-fit-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/class-art-table-final-fit-20260906
          fetch-depth: 2

      - name: Guard exact starting head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "caf6399cd9eae33398b93bb9acbf39ff2b198bcb"

      - name: Align progression and extend cinematic art
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{path}: missing expected token: {old[:220]}')
              p.write_text(s.replace(old, new))

          guide = 'components/NpcForgeClassGuide.js'
          replace_required(
              guide,
              '.npc-forge-class-guide__table-card .class-level-guide__table{width:100%!important;min-width:760px!important}',
              '.npc-forge-class-guide__table-card .class-level-guide__table{width:100%!important;min-width:0!important;box-sizing:border-box!important}',
          )
          replace_required(
              guide,
              '.npc-forge-class-guide__table-card .class-level-guide__table.has-spell-progression{min-width:820px!important}.npc-forge-class-guide__table-card .class-level-guide__row.is-spell-progression{grid-template-columns:42px 38px minmax(230px,2.25fr) 50px 72px repeat(9,minmax(28px,.3fr))!important;gap:.22rem!important}',
              '.npc-forge-class-guide__table-card .class-level-guide__table.has-spell-progression{min-width:0!important}.npc-forge-class-guide__table-card .class-level-guide__row.is-spell-progression{grid-template-columns:40px 34px minmax(190px,2.15fr) 46px 62px repeat(9,minmax(24px,.32fr))!important;gap:.14rem!important}',
          )
          anchor = '.npc-forge-class-guide__table-card .class-level-guide__slot-cell{color:rgba(255,255,255,.76)!important;font-size:.53rem!important}'
          alignment = anchor + '.npc-forge-class-guide__table-card .class-level-guide__row.is-spell-progression>div{min-width:0!important;padding-left:2px!important;padding-right:2px!important;text-align:center!important;box-sizing:border-box!important}.npc-forge-class-guide__table-card .class-level-guide__row.is-spell-progression>div:nth-child(3){text-align:left!important}.npc-forge-class-guide__table-card .class-level-guide__row.is-spell-progression>.class-level-guide__features{justify-content:flex-start!important}.npc-forge-class-guide__table-card .class-level-guide__row.is-head.is-spell-progression>div:nth-child(5){white-space:normal!important;line-height:1.05!important}'
          replace_required(guide, anchor, alignment)

          framing = 'styles/character-forge-class-hero-framing.css'
          replace_required(framing, 'width: calc(100% + 8px) !important;', 'width: calc(100% + 32px) !important;')
          replace_required(framing, 'margin-right: -8px !important;', 'margin-right: -32px !important;')

          for validator in ['scripts/validate_class_browser_polish.mjs', 'scripts/validate_class_subclass_browser.mjs']:
              p = Path(validator)
              v = p.read_text()
              for old, new in [
                  ('"min-width:820px!important"', '"min-width:0!important"'),
                  ('"repeat(9,minmax(28px,.3fr))"', '"repeat(9,minmax(24px,.32fr))"'),
                  ("'min-width:820px!important'", "'min-width:0!important'"),
                  ("'repeat(9,minmax(28px,.3fr))'", "'repeat(9,minmax(24px,.32fr))'"),
              ]:
                  if old in v:
                      v = v.replace(old, new)
              marker = '"font-size:.57rem!important",' if '"font-size:.57rem!important",' in v else "'font-size:.57rem!important',"
              addition = ('\n  "grid-template-columns:40px 34px minmax(190px,2.15fr) 46px 62px repeat(9,minmax(24px,.32fr))!important",\n  "text-align:center!important",' if marker.startswith('"') else "\n  'grid-template-columns:40px 34px minmax(190px,2.15fr) 46px 62px repeat(9,minmax(24px,.32fr))!important',\n  'text-align:center!important',")
              if 'grid-template-columns:40px 34px minmax(190px,2.15fr)' not in v:
                  v = v.replace(marker, marker + addition, 1)
              p.write_text(v)

          p = Path('scripts/validate_class_hero_framing.mjs')
          v = p.read_text()
          v = v.replace('"width: calc(100% + 8px) !important"', '"width: calc(100% + 32px) !important"')
          v = v.replace('"margin-right: -8px !important"', '"margin-right: -32px !important"')
          p.write_text(v)

          p = Path('docs/CHARACTER_FORGE_CLASS_SUBCLASS_SELECTOR_ARTWORK.md')
          d = p.read_text()
          d = d.replace('desktop spell-table minimum width is 820px while preserving all columns; narrow layouts retain the wider scrolling treatment;', 'desktop spell-table uses the available card width with no forced desktop minimum; its columns are rebalanced so Level, PB, Features, Cantrips, Known/Prepared, and 1st–9th remain aligned and the 9th-level column is visible without horizontal clipping at the approved desktop layout; narrow layouts retain the wider scrolling treatment;')
          d = d.replace('`margin-top:-8px`, `margin-right:-8px`, `width:calc(100% + 8px)`', '`margin-top:-8px`, `margin-right:-32px`, `width:calc(100% + 32px)`')
          p.write_text(d)

          guide_text = Path(guide).read_text()
          assert 'width:min(74%,860px)' in guide_text
          assert 'min-width:0!important;box-sizing:border-box!important' in guide_text
          assert 'grid-template-columns:40px 34px minmax(190px,2.15fr) 46px 62px repeat(9,minmax(24px,.32fr))!important' in guide_text
          assert 'text-align:center!important' in guide_text
          assert 'const slotLabels = ["1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th"]' in guide_text
          framing_text = Path(framing).read_text()
          assert 'width: calc(100% + 32px) !important' in framing_text
          assert 'margin-right: -32px !important' in framing_text
          assert 'object-position: 100% 0% !important' in framing_text
          PY

          node scripts/validate_class_browser_polish.mjs
          node scripts/validate_class_subclass_browser.mjs
          node scripts/validate_class_hero_framing.mjs
          git diff --check

          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' components/NpcForgeClassGuide.js docs/CHARACTER_FORGE_CLASS_SUBCLASS_SELECTOR_ARTWORK.md scripts/validate_class_browser_polish.mjs scripts/validate_class_hero_framing.mjs scripts/validate_class_subclass_browser.mjs styles/character-forge-class-hero-framing.css | sort)"
          test "$changed" = "$expected"

      - name: Commit focused Class art/table refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/NpcForgeClassGuide.js docs/CHARACTER_FORGE_CLASS_SUBCLASS_SELECTOR_ARTWORK.md scripts/validate_class_browser_polish.mjs scripts/validate_class_hero_framing.mjs scripts/validate_class_subclass_browser.mjs styles/character-forge-class-hero-framing.css
          git diff --cached --check
          git commit -m "Align Class progression and extend cinematic art"
          git push origin HEAD:agent/class-art-table-final-fit-20260906
