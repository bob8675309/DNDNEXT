name: Apply profile layout reconciliation

on:
  push:
    branches:
      - agent/reconcile-profile-layout-and-docs

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/reconcile-profile-layout-and-docs
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply source and documentation reconciliation
        run: python3 scripts/apply_profile_layout_reconciliation.py

      - name: Validate focused contracts
        run: |
          node --check scripts/validate_npc_sheet_action_parity.mjs
          npm run check:npc-sheet-action-parity
          npm run check:player-sheet-actions
          node scripts/validate_npc_sheet_selection_reconciliation.mjs

      - name: Run complete production gate
        run: npm run build:vercel

      - name: Commit validated reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/NpcPanel.js styles/npc-profile-panel.css styles/character-sheet-enhancements.css scripts/validate_npc_sheet_action_parity.mjs docs/Current_Development_Status_and_Roadmap.md docs/Deferred_UI_Polish_Backlog.md docs/NPC_Character_Sheet_Selection_Reconciliation.md
          if git diff --cached --quiet; then
            echo "No reconciliation changes to commit."
            exit 0
          fi
          git commit -m "Reconcile profile portrait layout and UI status"
          git push origin HEAD:agent/reconcile-profile-layout-and-docs
