permissions:
  contents: read
jobs:
  real-current-active-npc-original-red:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/research/c34-clean-main-privacy-forge-joint-source-20261112')
    runs-on: ubuntu-latest
    timeout-minutes: 31
    env:
      CI: 'true'
      PGHOST: '127.0.0.1'
      PGPORT: '54322'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      DNDNEXT_C34_LOCAL_CONFIRM: DISPOSABLE_LOCAL_GOTRUE_PG17_ONLY
      DNDNEXT_T46_P2_LOCAL_CONFIRM: T46_P2_EXACT_PRIVACY_REAL_NEXT_SIGNED_ONLY
    steps:
      - name: Checkout current research branch without retaining credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preserve original Stage1–3, T45/T46-P1 sources and T46-P2 static privacy
        run: |
          node --check scripts/integration/c34/test_t46_p3_p4b_c2b_guarded_buy_signed.mjs
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b3_original_browser.mjs
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b4_guarded_town_signed.mjs
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b5_flag01_signed.mjs
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b6_stock_lock_signed.mjs
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b7_travel_camp_deadlock_signed.mjs
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b8_manager_qty_signed.mjs
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b9_reroll_ui_signed.mjs
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b10_stock_writers_signed.mjs
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b11_stock_ui_signed.mjs
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b11_brace_pending_rpc_signed.mjs
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b12_qty_reroll_signed.mjs
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b14_inventory_roles_signed.mjs
          node --check scripts/integration/c34/run_t46_p3_p4b_c2b14_p2_inventory_signed.mjs
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b12_qty_reroll_epoch_overlay.mjs
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b11_brace_pending_rpc_overlay.mjs
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b11_stock_ui_overlay.mjs
          node scripts/integration/c34/test_t46_p3_p4b_c2b11_stock_ui_source.mjs
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b10_bulk_source.mjs
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b9_reroll_source.mjs
          node --check scripts/integration/c34/candidates/t46_p3_p4b_c2b_merchant_eligibility_guard.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2b_guard_source.mjs
          node --test scripts/integration/c34/test_t46_p3_p4b_c2_merchant_commerce_source.mjs
          node --check scripts/integration/c34/test_t46_p2_profile_source.mjs
          node --test scripts/integration/c34/test_t46_p2_profile_source.mjs
          node --test scripts/integration/c34/test_t46_progression_visibility_source.mjs
          node --test scripts/integration/c34/test_t45_parent_review_source.mjs
          node --test scripts/integration/c34/test_t44_level_up_browser_source.mjs
          node --test scripts/integration/c34/test_t43_earned_v5_source.mjs
      - name: Install lockfile-pinned current Next and local Chromium controller
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/t46-p3-p4bc2b2-browser-tools"
          npm install --prefix "$RUNNER_TEMP/t46-p3-p4bc2b2-browser-tools" --no-save --package-lock=false --no-audit --no-fund --no-progress playwright-core@1.56.1 esbuild@0.25.12
      - name: Prepare isolated PostgreSQL 17 and signed Auth
        run: |
          mkdir -p "$RUNNER_TEMP/t46-p3-p4bc2b2-signed/supabase"
          cat > "$RUNNER_TEMP/t46-p3-p4bc2b2-signed/supabase/config.toml" <<'TOML'
          project_id = "t46-p3-p4bc2b2-guarded-source"
          [db]
          port = 54322
          major_version = 17
          [auth.email]
          enable_confirmations = false
          TOML
      - name: Start disposable local GoTrue/PostgREST/Postgres (no hosted operations)
        run: |
          cd "$RUNNER_TEMP/t46-p3-p4bc2b2-signed"
          npx --yes supabase@2.120.0 start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Install exact original Forge privacy setup and original PR345 Stage 1/2/3
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGPORT" = 54322
          test "$PGDATABASE" = postgres
          test "$GITHUB_ACTIONS" = true
          (cd "$RUNNER_TEMP/t46-p3-p4bc2b2-signed" && npx --yes supabase@2.120.0 status -o env) > "$RUNNER_TEMP/t46-p3-p4bc2b2-auth-env"
          psql -X -v ON_ERROR_STOP=1 -v DNDNEXT_C33_PRIVACY_STAGE3_CREATOR=1 -f scripts/integration/c34/fixtures/forge_creation_replay_local_auth_pr351_pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/fixtures/c33_forge_privacy_original_policy_join_pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/integration/c34/sources/02_npc_profile_stage1.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/integration/c34/sources/03_npc_dossier_stage2.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/integration/c34/sources/04_private_story_stage3.sql
          echo 'PASS T46-P2-PR345-SOURCE: real exact unmodified source-original Stage1/2/3 installed in disposable PG17'
      - name: Actual current Next browser, held PR345 Profile, original Class parent, signed role/reveal/secret tests
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/t46-p3-p4bc2b2-auth-env"
          export DNDNEXT_C34_LOCAL_URL=http://127.0.0.1:54321
          export DNDNEXT_C34_LOCAL_ANON_KEY="$ANON_KEY"
          export C33_BROWSER_TOOL_ROOT="$RUNNER_TEMP/t46-p3-p4bc2b2-browser-tools"
          export C33_BROWSER_CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$C33_BROWSER_CHROME" || { echo 'No local Chromium; no remote fallback' >&2; exit 1; }
          test ! -e pages/__c34_t46_p3_roster_probe.jsx
          node scripts/integration/c34/test_t46_p3_p4b_c2b_guarded_buy_signed.mjs
          test ! -e pages/__c34_t46_p3_roster_probe.jsx
          echo 'PASS T46-P3-P4B-C2-B2: original hidden seller RED then disposable guarded 42501 GREEN with stock, GP -1 and recipe parity; no live SQL, release HOLD'
      - name: Remove disposable database/Auth/role data and temporary route
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/t46-p3-p4bc2b2-signed" ]; then
            cd "$RUNNER_TEMP/t46-p3-p4bc2b2-signed"
            npx --yes supabase@2.120.0 stop --no-backup || true
          else
            echo "No disposable services were created; teardown not needed"
          fi
