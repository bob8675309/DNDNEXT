name: Patch Class density and art 2026-09-06

on:
  push:
    branches:
      - agent/class-density-art-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/class-density-art-20260906
          fetch-depth: 2

      - name: Guard exact starting head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1f5ad332120fdf984a113ce083b2df24c8da564e"

      - name: Apply browser-review proportions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  n = s.count(old)
                  if n < 1:
                      raise SystemExit(f'{path}: missing expected token: {old[:140]}')
                  s = s.replace(old, new)
              p.write_text(s)

          # Selector: shrink total desktop footprint to ~67% of the current area while
          # preserving the readable two-column card treatment and all canonical options.
          patch('components/ClassSubclassSection.js', [
              ('width:min(66%,760px);max-width:760px', 'width:min(54%,620px);max-width:620px'),
              ('grid-template-columns:78px minmax(0,1fr) 22px', 'grid-template-columns:70px minmax(0,1fr) 20px'),
              ('width:78px;height:40px', 'width:70px;height:36px'),
              ('max-height:min(28vh,205px)', 'max-height:min(23vh,168px)'),
              ('grid-template-columns:82px minmax(0,1fr) auto 22px', 'grid-template-columns:74px minmax(0,1fr) auto 20px'),
              ('min-height:48px', 'min-height:44px'),
              ('width:82px;height:40px', 'width:74px;height:36px'),
              ('@media(max-width:1100px){.class-subclass-section.is-two-column:not(.is-detailed){width:min(72%,760px)}}', '@media(max-width:1100px){.class-subclass-section.is-two-column:not(.is-detailed){width:min(60%,620px)}}'),
          ])

          # Progression: ~20% less vertical density, without removing columns or changing data.
          patch('components/NpcForgeClassGuide.js', [
              ('max-height:545px!important;padding:6px!important', 'max-height:435px!important;padding:5px!important'),
              ('gap:.34rem!important;min-height:42px!important;padding:.31rem .46rem!important', 'gap:.28rem!important;min-height:34px!important;padding:.22rem .38rem!important'),
              ('.npc-forge-class-guide__table-card .class-level-guide__row>div{padding:3px 4px!important;font-size:.61rem!important;line-height:1.3!important}', '.npc-forge-class-guide__table-card .class-level-guide__row>div{padding:2px 3px!important;font-size:.57rem!important;line-height:1.26!important}'),
              ('.npc-forge-class-guide__table-card .class-level-guide__row.is-head{min-height:34px!important}', '.npc-forge-class-guide__table-card .class-level-guide__row.is-head{min-height:28px!important}'),
              ('.class-level-guide__features button{appearance:none!important;padding:.2rem .42rem!important', '.class-level-guide__features button{appearance:none!important;padding:.16rem .34rem!important'),
              ('font-size:.6rem!important;font-weight:650!important;line-height:1.2!important', 'font-size:.56rem!important;font-weight:650!important;line-height:1.18!important'),
              ('.class-level-guide__slot-head{color:rgba(255,255,255,.56)!important;font-size:.5rem!important}', '.class-level-guide__slot-head{color:rgba(255,255,255,.56)!important;font-size:.47rem!important}'),
              ('.class-level-guide__slot-cell{color:rgba(255,255,255,.76)!important;font-size:.57rem!important}', '.class-level-guide__slot-cell{color:rgba(255,255,255,.76)!important;font-size:.53rem!important}'),
          ])

          # Cinematic art: fill the complete Class Overview width and fade beneath the copy.
          # Height remains viewport-derived so subclass expansion still cannot recrop the art.
          patch('styles/character-forge-class-hero-framing.css', [
              ('left: 20% !important', 'left: 0 !important'),
              ('linear-gradient(90deg, rgba(5, 8, 15, 0.98) 0%, rgba(5, 8, 15, 0.78) 16%, rgba(5, 8, 15, 0.34) 34%, rgba(5, 8, 15, 0.06) 56%, rgba(5, 8, 15, 0) 72%)', 'linear-gradient(90deg, rgba(5, 8, 15, 0.995) 0%, rgba(5, 8, 15, 0.95) 18%, rgba(5, 8, 15, 0.76) 34%, rgba(5, 8, 15, 0.46) 47%, rgba(5, 8, 15, 0.18) 59%, rgba(5, 8, 15, 0.04) 69%, rgba(5, 8, 15, 0) 80%)'),
              ('background: linear-gradient(90deg, rgba(4, 7, 13, 0.18) 0%, rgba(4, 7, 13, 0.045) 48%, rgba(4, 7, 13, 0) 100%)', 'background: linear-gradient(90deg, rgba(4, 7, 13, 0.26) 0%, rgba(4, 7, 13, 0.1) 47%, rgba(4, 7, 13, 0.015) 72%, rgba(4, 7, 13, 0) 100%)'),
          ])

          for validator in ['scripts/validate_class_browser_polish.mjs', 'scripts/validate_class_subclass_browser.mjs']:
              patch(validator, [
                  ('max-height:min(28vh,205px)', 'max-height:min(23vh,168px)'),
                  ('width:min(66%,760px)', 'width:min(54%,620px)'),
                  ('grid-template-columns:82px minmax(0,1fr) auto 22px', 'grid-template-columns:74px minmax(0,1fr) auto 20px'),
                  ('min-height:48px', 'min-height:44px'),
                  ('min-height:42px!important', 'min-height:34px!important'),
                  ('padding:.2rem .42rem!important', 'padding:.16rem .34rem!important'),
                  ('font-size:.61rem!important', 'font-size:.57rem!important'),
                  ('left: 20% !important', 'left: 0 !important'),
              ])

          patch('scripts/validate_class_hero_framing.mjs', [
              ('"left: 20% !important"', '"left: 0 !important"'),
              ('bottom: 0 !important;\\n    left: 20% !important', 'bottom: 0 !important;\\n    left: 0 !important'),
              ('stable brighter top-right layer', 'stable full-width faded background layer'),
          ])

          patch('docs/CHARACTER_FORGE_CLASS_SUBCLASS_SELECTOR_ARTWORK.md', [
              ('`width:min(66%,760px)`', '`width:min(54%,620px)`'),
              ('`max-height:min(28vh,205px)`', '`max-height:min(23vh,168px)`'),
              ('approximately 48px', 'approximately 44px'),
              ('82×40', '74×36'),
              ('normal rows are **42px** minimum', 'normal rows are **34px** minimum'),
              ('header **34px**', 'header **28px**'),
              ('row text `.61rem`', 'row text `.57rem`'),
              ('feature pills `.2rem .42rem`', 'feature pills `.16rem .34rem`'),
          ])

          selector = Path('components/ClassSubclassSection.js').read_text()
          guide = Path('components/NpcForgeClassGuide.js').read_text()
          framing = Path('styles/character-forge-class-hero-framing.css').read_text()
          assert 'width:min(54%,620px)' in selector
          assert 'max-height:min(23vh,168px)' in selector
          assert 'grid-template-columns:74px minmax(0,1fr) auto 20px' in selector
          assert 'min-height:34px!important' in guide
          assert 'max-height:435px!important' in guide
          assert 'min-height:28px!important' in guide
          assert 'left: 0 !important' in framing
          assert 'rgba(5, 8, 15, 0.95) 18%' in framing
          assert 'left: 20% !important' not in framing
          PY

          node scripts/validate_class_browser_polish.mjs
          node scripts/validate_class_hero_framing.mjs
          node scripts/validate_class_subclass_browser.mjs
          git diff --check

          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$(printf '%s\n' components/ClassSubclassSection.js components/NpcForgeClassGuide.js docs/CHARACTER_FORGE_CLASS_SUBCLASS_SELECTOR_ARTWORK.md scripts/validate_class_browser_polish.mjs scripts/validate_class_hero_framing.mjs scripts/validate_class_subclass_browser.mjs styles/character-forge-class-hero-framing.css | sort)"

      - name: Commit focused Class presentation patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ClassSubclassSection.js components/NpcForgeClassGuide.js styles/character-forge-class-hero-framing.css scripts/validate_class_browser_polish.mjs scripts/validate_class_hero_framing.mjs scripts/validate_class_subclass_browser.mjs docs/CHARACTER_FORGE_CLASS_SUBCLASS_SELECTOR_ARTWORK.md
          git diff --cached --check
          git commit -m "Tighten Class overview density and widen artwork"
          git push origin HEAD:agent/class-density-art-20260906
