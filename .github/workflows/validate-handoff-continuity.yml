name: Verify authored handoff continuity (no production access)

on:
  pull_request:
    paths:
      - 'scripts/agents/check_handoff_continuity.mjs'
      - 'scripts/agents/test_handoff_continuity.mjs'
      - 'scripts/agents/render_open_pr_index.mjs'
      - 'scripts/agents/validate_open_pr_index.mjs'
      - 'scripts/agents/project_health.mjs'
      - 'scripts/agents/validate_project_health.mjs'
      - '.github/workflows/research-docs-maintenance.yml'
      - '.github/workflows/validate-handoff-continuity.yml'
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  local-contract-tests:
    name: Self-test deterministic continuity gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check scripts/agents/check_handoff_continuity.mjs
          node --check scripts/agents/test_handoff_continuity.mjs
          node scripts/agents/test_handoff_continuity.mjs
          node --check scripts/agents/render_open_pr_index.mjs
          node scripts/agents/validate_open_pr_index.mjs
          node scripts/agents/validate_project_health.mjs
          node scripts/agents/validate_research_docs_maintainer.mjs

  trusted-source-gate:
    name: Check actual PR source chronology against appended handoff
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted DEFAULT BRANCH (not PR base); never execute PR-supplied scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch PR commits as inert Git data and pin exact event HEAD
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PR_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PR_BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$PR_BASE_REF" != *'..'* ]]
          git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/continuity-pr-base"
          test "$(git rev-parse refs/remotes/origin/continuity-pr-base)" = "$PR_BASE_SHA"
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/continuity-pr-head"
          test "$(git rev-parse refs/remotes/origin/continuity-pr-head)" = "$PR_HEAD_SHA"
      - name: Verify authored docs, append-only log and latest source chronology
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: node scripts/agents/check_handoff_continuity.mjs
