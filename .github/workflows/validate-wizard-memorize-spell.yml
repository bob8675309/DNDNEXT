name: Validate Wizard Memorize Spell

on:
  push:
    branches:
      - agent/character-forge-resilience-presentation
    paths:
      - "components/CharacterWizardMemorizeSpellPanel.js"
      - "components/CharacterCurrencyBadge.js"
      - "scripts/validate_wizard_memorize_spell_runtime.mjs"
      - "sql/20260809_74_wizard_memorize_spell_runtime.sql"
      - ".github/workflows/validate-wizard-memorize-spell.yml"
  pull_request:
    paths:
      - "components/CharacterWizardMemorizeSpellPanel.js"
      - "components/CharacterCurrencyBadge.js"
      - "scripts/validate_wizard_memorize_spell_runtime.mjs"
      - "sql/20260809_74_wizard_memorize_spell_runtime.sql"
      - ".github/workflows/validate-wizard-memorize-spell.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Memorize Spell authority
        run: |
          node scripts/validate_wizard_memorize_spell_runtime.mjs
          node scripts/validate_unified_character_forge.mjs
          node scripts/validate_character_progression_v3.mjs
          node scripts/validate_wizard_spell_mastery_runtime.mjs
      - name: Run production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder
        run: npm run build:vercel
