name: Validate Forge source presentation

on:
  pull_request:
    branches:
      - main
    paths:
      - "components/ClassFeatureText.js"
      - "components/NpcForgeClassFeatureDock.js"
      - "components/NpcForgeClassGuide.js"
      - "components/NpcForgeClassGuideModel.js"
      - "components/NpcForgeContextPanel.js"
      - "components/NpcForgeCoreSupport.js"
      - "components/NpcForgeEmbeddedSourceChoices.js"
      - "components/SourceRuleContent.js"
      - "public/media/species/*-dragonborn.webp"
      - "public/media/species/*-aven.webp"
      - "public/media/species/drow.webp"
      - "public/media/species/*-elf.webp"
      - "public/media/species/*-gnome.webp"
      - "public/media/species/*-shifter.webp"
      - "public/media/species/*-fairy.webp"
      - "public/media/species/*-kithkin.webp"
      - "public/media/species/dwarf-kaladesh.webp"
      - "public/media/species/goblin-dankwood.webp"
      - "public/media/species/orc-ixalan.webp"
      - "scripts/import_5etools_character_options_refined.mjs"
      - "scripts/materialize_gem_dragonborn_art.py"
      - "scripts/validate_forge_source_presentation.mjs"
      - "scripts/validate_forge_species_catalog_families.mjs"
      - "scripts/validate_forge_species_family_expansion.mjs"
      - "scripts/validate_forge_species_catalog_portraits.mjs"
      - "scripts/validate_forge_species_catalog_portraits_v2.mjs"
      - "scripts/validate_forge_chromatic_dragonborn_art.mjs"
      - "scripts/validate_forge_metallic_dragonborn_art.mjs"
      - "scripts/validate_forge_gem_dragonborn_art.mjs"
      - "scripts/validate_forge_aven_art.mjs"
      - "scripts/validate_forge_elf_gnome_art.mjs"
      - "scripts/validate_forge_shifter_art.mjs"
      - "scripts/validate_forge_fairy_kithkin_art.mjs"
      - "scripts/validate_forge_setting_alias_art.mjs"
      - "sql/20260811_91_genasi_subrace_catalog.sql"
      - "sql/20260811_92_genasi_source_detail_restore.sql"
      - "sql/20260812_93_aven_subrace_catalog.sql"
      - "utils/npcForgeCatalog.js"
      - "utils/playerFacingText.js"
      - "utils/playerForgeSpeciesChoices.js"
      - "utils/speciesArtwork.js"
      - "utils/speciesCatalogExpansion.js"
      - "utils/speciesCatalogFamilyMenu.js"
      - "utils/speciesLore.js"
      - "utils/speciesPresentation.js"
      - "utils/speciesVariantFamilies.js"
      - ".github/workflows/validate-forge-source-presentation.yml"
  push:
    branches:
      - "agent/species-art-post170"
    paths:
      - "components/ClassFeatureText.js"
      - "components/NpcForgeClassFeatureDock.js"
      - "components/NpcForgeClassGuide.js"
      - "components/NpcForgeClassGuideModel.js"
      - "components/NpcForgeContextPanel.js"
      - "components/NpcForgeCoreSupport.js"
      - "components/NpcForgeEmbeddedSourceChoices.js"
      - "components/SourceRuleContent.js"
      - "public/media/species/*-dragonborn.webp"
      - "public/media/species/*-aven.webp"
      - "public/media/species/drow.webp"
      - "public/media/species/*-elf.webp"
      - "public/media/species/*-gnome.webp"
      - "public/media/species/*-shifter.webp"
      - "public/media/species/*-fairy.webp"
      - "public/media/species/*-kithkin.webp"
      - "public/media/species/dwarf-kaladesh.webp"
      - "public/media/species/goblin-dankwood.webp"
      - "public/media/species/orc-ixalan.webp"
      - "scripts/import_5etools_character_options_refined.mjs"
      - "scripts/materialize_gem_dragonborn_art.py"
      - "scripts/validate_forge_source_presentation.mjs"
      - "scripts/validate_forge_species_catalog_families.mjs"
      - "scripts/validate_forge_species_family_expansion.mjs"
      - "scripts/validate_forge_species_catalog_portraits.mjs"
      - "scripts/validate_forge_species_catalog_portraits_v2.mjs"
      - "scripts/validate_forge_chromatic_dragonborn_art.mjs"
      - "scripts/validate_forge_metallic_dragonborn_art.mjs"
      - "scripts/validate_forge_gem_dragonborn_art.mjs"
      - "scripts/validate_forge_aven_art.mjs"
      - "scripts/validate_forge_elf_gnome_art.mjs"
      - "scripts/validate_forge_shifter_art.mjs"
      - "scripts/validate_forge_fairy_kithkin_art.mjs"
      - "scripts/validate_forge_setting_alias_art.mjs"
      - "sql/20260811_91_genasi_subrace_catalog.sql"
      - "sql/20260811_92_genasi_source_detail_restore.sql"
      - "sql/20260812_93_aven_subrace_catalog.sql"
      - "utils/npcForgeCatalog.js"
      - "utils/playerFacingText.js"
      - "utils/playerForgeSpeciesChoices.js"
      - "utils/speciesArtwork.js"
      - "utils/speciesCatalogExpansion.js"
      - "utils/speciesCatalogFamilyMenu.js"
      - "utils/speciesLore.js"
      - "utils/speciesPresentation.js"
      - "utils/speciesVariantFamilies.js"
      - ".github/workflows/validate-forge-source-presentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate structured source presentation
        run: node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_forge_source_presentation.mjs

      - name: Validate established Species catalogue families
        shell: bash
        run: |
          set +e
          output=$(node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_forge_species_catalog_families.mjs 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tr '\n' ' ' | tail -c 2400)
            echo "::error title=Established Species family validator::${message}"
            exit "$status"
          fi

      - name: Validate expanded Species catalogue families
        run: node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_forge_species_family_expansion.mjs

      - name: Validate Species catalogue portraits and collapse state
        run: node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_forge_species_catalog_portraits_v2.mjs

      - name: Validate Chromatic Dragonborn dedicated artwork
        run: node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_forge_chromatic_dragonborn_art.mjs

      - name: Validate Metallic Dragonborn dedicated artwork
        run: node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_forge_metallic_dragonborn_art.mjs

      - name: Validate Gem Dragonborn dedicated artwork
        run: node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_forge_gem_dragonborn_art.mjs

      - name: Validate Aven dedicated artwork
        run: node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_forge_aven_art.mjs

      - name: Validate Elf and Gnome dedicated artwork
        run: node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_forge_elf_gnome_art.mjs

      - name: Validate Shifter dedicated artwork
        run: node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_forge_shifter_art.mjs

      - name: Validate Fairy and Kithkin dedicated artwork
        run: node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_forge_fairy_kithkin_art.mjs

      - name: Validate setting-variant dedicated artwork
        run: node --experimental-loader ./scripts/node_relative_js_loader.mjs scripts/validate_forge_setting_alias_art.mjs

      - name: Run production build gate
        run: node scripts/vercel_build_v2.mjs
